<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N2 한자 암기</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N2 한자">
<meta name="theme-color" content="#16181d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1f24;--sub:#6b6f78;--line:#e4e2dc;
  --accent:#c8553d;--accent-weak:#f6e3de;--ok:#2f8f5b;--ok-weak:#dcf1e5;--ng:#c8553d;--ng-weak:#f8e0da;
  --chip:#efede8;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;
    --accent:#e27a5f;--accent-weak:#3a2622;--ok:#5cc28a;--ok-weak:#1d3328;--ng:#e27a5f;--ng-weak:#3a2622;
    --chip:#2a2e36;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;
  --accent:#e27a5f;--accent-weak:#3a2622;--ok:#5cc28a;--ok-weak:#1d3328;--ng:#e27a5f;--ng-weak:#3a2622;
  --chip:#2a2e36;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px 32px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--chip)}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.menu{display:grid;gap:12px;margin-top:8px}
.menu .card{padding:20px;text-align:left;display:flex;gap:16px;align-items:center;width:100%}
.menu .big{font-size:34px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent)}
.menu h2{margin:0;font-size:18px}.menu p{margin:2px 0 0;color:var(--sub);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{padding:12px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:16px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--chip);font-size:14px;white-space:nowrap}
.days button.on{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row .w{font-size:22px;min-width:0;flex:1}
.row .w small{display:block;font-size:13px;color:var(--sub);font-family:inherit}
.row .m{font-size:13px;color:var(--sub);text-align:right;max-width:45%}
.row.done{opacity:.55}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:13px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.toolbar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px}
.pill.on{background:var(--accent);color:#fff}
/* detail */
.detail .head{padding:20px;text-align:center}
.detail .head .word{font-size:44px;line-height:1.2;word-break:keep-all}
.detail .head .reading{font-size:20px;color:var(--accent);margin-top:4px}
.detail .head .mean{font-size:16px;margin-top:6px}
.detail .head .yrs{font-size:12px;color:var(--sub);margin-top:6px}
.sec{margin-top:12px;padding:16px}
.sec h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.kj{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kj:first-of-type{border-top:0;padding-top:0}
.kj .c{font-size:48px;line-height:64px;text-align:center;background:var(--chip);border-radius:12px;height:64px}
.kj .h{font-weight:700}
.kj .t{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--accent-weak);color:var(--accent);margin-left:6px;vertical-align:2px}
.kj .p{font-size:14px;margin-top:2px}
.kj .o{font-size:14px;color:var(--sub);margin-top:4px}
.ex .s{font-size:19px;line-height:1.7}
mark{background:var(--accent-weak);color:inherit;border-radius:4px;padding:0 2px}
.ex .k{color:var(--sub);font-size:14px;margin-top:4px}
.nav2{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:14px;background:var(--chip);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.tts{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--chip);margin-top:10px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{padding:28px 16px;text-align:center;margin-top:12px}
.qcard .word{font-size:52px;line-height:1.2;word-break:keep-all}
.qcard .step{font-size:13px;color:var(--sub);margin-bottom:10px}
.qcard .revealed{font-size:18px;color:var(--accent);min-height:27px;margin-top:6px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:17px}
.choice.ok{background:var(--ok-weak);border-color:var(--ok)}
.choice.ng{background:var(--ng-weak);border-color:var(--ng)}
.inp{display:flex;gap:8px;margin-top:12px}
.inp input{flex:1;min-width:0;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--sub);margin-top:6px;min-height:18px}
.fb{margin-top:12px;padding:14px 16px;border-radius:14px;font-size:15px}
.fb.ok{background:var(--ok-weak)}.fb.ng{background:var(--ng-weak)}
.result{padding:24px;text-align:center}
.result .score{font-size:48px;font-weight:800}
.wrongs{margin-top:12px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dgrid .card{padding:14px 8px;text-align:center}
.dgrid b{display:block;font-size:17px}.dgrid span{font-size:12px;color:var(--sub)}
.dgrid .perfect{border-color:var(--ok)}
h2.sub{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:600}
.menu .card:disabled{opacity:.5}
.grow{display:block;width:100%;text-align:left;padding:12px 14px}
.gp{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.gp .jp{font-size:18px}.gp .gm{font-size:13px;color:var(--sub);text-align:right}
.gx{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.gx .s{font-size:17px;line-height:1.7}.gx .k{font-size:14px;color:var(--sub);margin-top:2px}
.gx .meta{font-size:12px;color:var(--sub);margin-top:6px}
.gsent{font-size:21px;line-height:1.8;text-align:left}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
</style>
</head>

 寺|형성|해(日)의 움직임으로 재는 때. 寺(じ)가 음.\n的|과녁 적|白(희다) + 勺|형성|흰(白) 과녁 한가운데 → 목표, '~적'.\n関|관계할 관|門(문) + 关(빗장)|형성|문(門)에 빗장을 거는 곳 → 관문 → 관계.\n与|줄 여|与|상형|두 손이 물건을 주고받는 모양 → 주다, 관여.\n則|법칙 칙|貝(鼎: 솥) + 刂(칼)|회의|솥(鼎)에 칼(刂)로 새긴 법률 → 규칙.\n追|쫓을 추|辶(가다) + 𠂤|형성|뒤를 따라가(辶) 쫓음.\n払|떨칠 불|扌(손) + 厶(弗의 약자)|형성|손(扌)으로 털어냄 → 쫓다, 지불하다.\n妙|묘할 묘|女(여자) + 少(젊다)|회의|젊은(少) 여자(女)의 오묘한 아름다움 → 묘하다.\n不|아닐 불|不|상형|꽃받침(또는 날아가 돌아오지 않는 새) 모양 → 부정.\n議|의논할 의|言(말) + 義(옳음)|형성|말(言)로 옳고(義) 그름을 따짐 → 의논.\n相|서로 상|木(나무) + 目(눈)|회의|나무(木)를 눈(目)으로 마주 살핌 → 서로.\n当|마땅할 당|尚 + 田(밭) → 當의 약자|형성|밭(田)이 서로 맞먹음 → 해당, 마땅함.\n帰|돌아갈 귀|𠂤 + 帚(빗자루)|형성|빗자루(帚)를 든 여자가 집으로 돌아감.\n省|살필 성·덜 생|少(작다) + 目(눈)|회의|눈(目)을 가늘게(少) 뜨고 살핌. 帰省은 '부모를 살피러 감'.\n突|갑자기 돌|穴(구멍) + 犬(개)|회의|개(犬)가 구멍(穴)에서 갑자기 튀어나옴.\n然|그럴 연|月(고기) + 犬 + 灬(불)|회의|개고기를 불에 굽는 모양(燃의 원자) → '그러하다'로 차용.\n潰|무너질 궤|氵(물) + 貴|형성|둑이 물(氵)에 무너짐 → 찌부러뜨리다.\n粗|거칠 조|米(쌀) + 且|형성|찧지 않은 거친 쌀(米) → 조잡함.\n末|끝 말|木 + 一|지사|나무(木) 윗부분에 선을 그어 '끝'을 가리킴.\n熱|더울 열|埶 + 灬(불)|형성|불(灬)의 뜨거운 기운.\n中|가운데 중|中|지사|깃대를 원의 한가운데 꽂은 모양.\n和|화할 화|禾(벼) + 口(입)|형성|곡식(禾)을 함께 먹으니(口) 화목함.\n愛|사랑 애|旡 + 心 + 夂|형성|마음(心)을 남겨 둔 채 뒤돌아보며 가는 모습 → 사랑.\n着|붙을 착|羊 + 目 (著에서 분화)|형성|著에서 갈라져 나온 글자 → 붙다, 입다, 도착.\n柱|기둥 주|木(나무) + 主(중심)|형성|집의 중심(主)을 받치는 나무(木) → 기둥.\n討|칠 토|言(말) + 寸(법도)|회의|말(言)과 법도(寸)로 따져 공격함 → 토론, 토벌.\n争|다툴 쟁|爫(손) + ⺕(손)|회의|위아래 두 손이 한 물건을 서로 잡아당김.\n豊|풍년 풍|豊|상형|제기(豆)에 곡식이 수북이 담긴 모양.\n富|부자 부|宀(집) + 畐(술단지)|형성|집(宀)에 술단지(畐)가 가득 → 넉넉함.\n略|간략할 략|田(밭) + 各|형성|밭(田)의 경계를 대강 정함 → 간략, 생략.\n涼|서늘할 량|氵(물) + 京|형성|물(氵)기가 있어 서늘함.\n拡|넓힐 확|扌(손) + 広(넓다)|형성|손(扌)으로 넓게(広) 펼침.\n充|채울 충|𠫓(아이) + 儿(사람)|회의|아이가 자라 어른(儿)으로 가득 참 → 채우다.\n救|구원할 구|求(구하다) + 攵(치다)|형성|손을 써서(攵) 구해냄. 求(きゅう)가 음.\n厚|두터울 후|厂(벼랑) + 㫗|형성|벼랑(厂)처럼 두툼하게 쌓인 모양.\n先|먼저 선|⺧(발) + 儿(사람)|회의|사람(儿)보다 발(止)이 앞서 나감 → 먼저.\n順|순할 순|川(내) + 頁(머리)|회의|물(川)이 흐르듯 머리(頁)를 숙여 따름 → 순서.\n仮|거짓 가|亻(사람) + 反|형성|사람(亻)이 잠시 빌린 것 → 임시, 가짜.\n予|미리 예|予|상형|베틀의 북이 앞으로 밀려 나가는 모양 → 미리.\n約|맺을 약|糸(실) + 勺|형성|실(糸)로 묶어 맺음 → 약속, 요약.\n防|막을 방|阝(언덕) + 方|형성|흙 언덕(阝)을 쌓아 물을 막음.\n飛|날 비|飛|상형|새가 날개를 펴고 나는 모양.\n散|흩을 산|𢻃 + 攵(치다)|회의|두드려(攵) 흩뜨림.\n敏|민첩할 민|每 + 攵(치다)|형성|부지런히 손을 움직임(攵) → 민첩, 민감.\n感|느낄 감|咸(모두) + 心(마음)|형성|마음(心) 전체(咸)가 움직임 → 느끼다.\n裏|속 리|衣(옷) + 里|형성|옷(衣)의 안쪽(里) → 뒤, 속.\n付|줄 부|亻(사람) + 寸(손)|회의|손(寸)으로 사람(亻)에게 건넴 → 붙이다.\n致|이를 치|至(이르다) + 攵|회의|목표에 이르게(至) 함 → 일치.\n同|한가지 동|冂(덮개) + 口|회의|덮개(冂) 아래 입(口)이 하나로 모임 → 같다.\n題|제목 제|是 + 頁(머리)|형성|머리(頁) 부분 → 표제, 제목.\n用|쓸 용|用|상형|나무통(또는 울타리) 모양 → 쓰다.\n心|마음 심|心|상형|심장의 모양.\n注|부을 주|氵(물) + 主(한곳)|형성|물(氵)을 한곳(主)에 쏟아부음 → 주의 집중.\n休|쉴 휴|亻(사람) + 木(나무)|회의|사람(亻)이 나무(木) 그늘에서 쉼.\n憩|쉴 게|舌 + 息(숨)|회의|숨(息)을 돌리며 쉼.\n進|나아갈 진|辶(가다) + 隹(새)|회의|새(隹)는 뒤로 가지 않고 앞으로만 나아감(辶).\n貢|바칠 공|工 + 貝(재물)|형성|재물(貝)을 바침. 工(こう)이 음.\n献|드릴 헌|南(鬳: 솥) + 犬(개)|회의|제사에 개(犬)고기를 솥에 담아 바침.\n早|이를 조|日(해) + 十|회의|해(日)가 막 떠오른 이른 아침.\n急|급할 급|刍(及: 따라잡다) + 心|형성|쫓기는(及) 마음(心) → 급함.\n区|구분할 구|匚(상자) + 乂|회의|상자(匚) 안을 칸칸이 나눔.\n切|끊을 절|七 + 刀(칼)|형성|칼(刀)로 자름. 七(しち→せつ)이 음.\n詳|자세할 상|言(말) + 羊|형성|말(言)을 자세하고 꼼꼼히 함.\n細|가늘 세|糸(실) + 田(囟의 변형)|형성|가는 실(糸) → 가늘다, 자세하다.\n分|나눌 분|八(나누다) + 刀(칼)|회의|칼(刀)로 둘로 가름(八).\n析|쪼갤 석|木(나무) + 斤(도끼)|회의|도끼(斤)로 나무(木)를 쪼갬 → 분석.\n絡|이을 락|糸(실) + 各|형성|실(糸)로 얽어 이음 → 얽히다, 연락.\n農|농사 농|曲(밭) + 辰(조개 농기구)|회의|조개껍데기 농기구(辰)로 밭을 가는 모양.\n薬|약 약|艹(풀) + 楽|형성|병을 고쳐 즐겁게(楽) 하는 풀(艹).\n志|뜻 지|士(之: 가다) + 心(마음)|형성|마음(心)이 가는(之) 곳 → 뜻.\n望|바랄 망|亡 + 月(달) + 𡈼(발돋움한 사람)|형성|발돋움하여 달(月)을 바라봄 → 바라다.\n短|짧을 단|矢(화살) + 豆|회의|화살(矢)로 재어 보니 짧음.\n編|엮을 편|糸(실) + 扁(죽간)|형성|죽간(扁)을 실(糸)로 엮음 → 편집.\n柔|부드러울 유|矛(창) + 木(나무)|회의|창(矛) 자루로 쓰는 잘 휘는 나무(木).\n疲|피곤할 피|疒(병) + 皮|형성|병(疒)든 것처럼 지침.\n労|일할 로|ツ(불꽃) + 冖(덮다) + 力(힘)|회의|불을 밝히고 밤새 힘(力)써 일함 → 수고.\n主|주인 주|主|상형|등잔 위의 불꽃 → 중심, 주인.\n原|근원 원|厂(벼랑) + 泉(샘)|회의|벼랑(厂) 아래 샘(泉) → 근원, 들판.\n料|헤아릴 료|米(쌀) + 斗(말)|회의|쌀(米)을 말(斗)로 됨 → 재료, 요금.\n読|읽을 독|言(말) + 売|형성|말(言)로 소리 내어 읽음.\n書|글 서|聿(붓) + 曰(말하다)|형성|붓(聿)으로 말(曰)을 적음.\n離|떠날 리|离(그물) + 隹(새)|형성|새(隹)가 그물(离)에서 떠나감.\n決|결정할 결|氵(물) + 夬(터지다)|형성|물(氵)이 둑을 터뜨림(夬) → 결단, 결정.\n権|권세 권|木(나무) + 雚|형성|원래 나무 저울추 → 저울질하는 힘 → 권력.\n通|통할 통|辶(가다) + 甬(통)|형성|길(辶)이 뚫려 통함.\n報|알릴 보|幸(수갑) + 𠬝(꿇린 사람)|회의|죄인을 잡아 윗사람에게 알림 → 보고, 보답.\n道|길 도|辶(가다) + 首(머리)|회의|머리(首)를 앞세워 걸어가는(辶) 길.\n多|많을 다|夕 + 夕|회의|고기 조각(夕)이 겹겹이 쌓임 → 많다.\n溶|녹을 용|氵(물) + 容(담다)|형성|물(氵)에 담겨(容) 녹아듦.\n込|담을 입|辶(가다) + 入(들다)|회의|안으로(入) 들어감(辶). 일본에서 만든 한자(国字).\n体|몸 체|亻(사람) + 本(근본)|회의|사람(亻)의 근본(本) → 몸.\n行|다닐 행|行|상형|네거리 모양 → 가다, 행하다.\n儀|거동 의|亻(사람) + 義(올바름)|형성|사람(亻)의 올바른(義) 몸가짐 → 예의.\n偉|클 위|亻(사람) + 韋|형성|남보다 뛰어난 사람(亻) → 훌륭하다.\n納|들일 납|糸(실) + 内(안)|형성|실(糸)을 안(内)으로 거둬들임 → 수납, 납부.\n平|평평할 평|平|상형|물 위에 평평하게 뜬 수초의 모양.\n文|글월 문|文|상형|사람 가슴에 새긴 무늬(문신) → 무늬, 글.\n句|글귀 구|勹(싸다) + 口(말)|회의|말(口)을 묶은(勹) 단락 → 구절.\n共|한가지 공|廿 + 廾(두 손)|회의|두 손(廾)으로 함께 받쳐 듦.\n有|있을 유|𠂇(손) + 月(고기)|회의|손(又)에 고기(月)를 쥐고 있음.\n鋭|날카로울 예|金(쇠) + 兌|형성|쇠(金) 끝이 뾰족하고 날카로움.\n鑑|거울 감|金(쇠) + 監(비추어 보다)|형성|쇠(金)로 된 거울에 비춰 봄(監) → 감상.\n賞|상줄 상|尚 + 貝(재물)|형성|재물(貝)을 내려 칭찬함 → 상, 감상하다.\n解|풀 해|角(뿔) + 刀(칼) + 牛(소)|회의|칼(刀)로 소(牛)의 뿔(角)을 발라냄 → 풀다.\n節|마디 절|竹(대나무) + 即|형성|대나무(竹)의 마디 → 절약, 계절.\n割|벨 할|害 + 刂(칼)|형성|칼(刂)로 나눔 → 분할.\n挟|낄 협|扌(손) + 夹(끼다)|형성|손(扌)으로 양쪽에서 끼움.\n詰|물을 힐|言(말) + 吉|형성|말(言)로 따져 물음. 일본어에서는 '가득 채우다'.\n溜|낙숫물 류|氵(물) + 留(머물다)|형성|물(氵)이 머물러(留) 고임.\n穏|편안할 온|禾(벼) + 㥯|형성|곡식(禾)이 넉넉해 마음이 편안함.\n爽|시원할 상|大(사람) + 爻 ×2(창살)|회의|사람(大) 양옆 창살(爻)로 바람이 통함 → 상쾌.\n希|바랄 희|爻 + 巾(천)|회의|성기게 짠 천(巾) → 드물다 → 바라다.\n去|갈 거|土(大: 사람) + 厶|회의|사람이 떠나가는 모양.\n失|잃을 실|手(손) + 乙|형성|손(手)에서 빠져나감 → 잃다.\n許|허락할 허|言(말) + 午|형성|말(言)로 허락함. 午(ご→きょ)가 음.\n由|말미암을 유|由|상형|술 거르는 통 모양 → 말미암다, 까닭.\n直|곧을 직|十 + 目(눈) + 乚|회의|열(十) 개의 눈(目)으로 봐도 곧음.\n横|가로 횡|木(나무) + 黄|형성|문에 가로지른 나무(木) 빗장 → 가로.\n普|넓을 보|並(나란히) + 日(해)|형성|해(日)가 나란히(並) 두루 비춤 → 널리.\n及|미칠 급|人(사람) + 又(손)|회의|앞사람(人)을 손(又)으로 붙잡음 → 미치다.\n伝|전할 전|亻(사람) + 云(말하다)|형성|사람(亻)이 말(云)을 전함.\n言|말씀 언|言|상형|입(口)에서 말이 나오는 모양.\n結|맺을 결|糸(실) + 吉|형성|실(糸)을 단단히 맺음.\n触|닿을 촉|角(뿔) + 虫(벌레)|형성|뿔(角)로 더듬어 닿음.\n合|합할 합|亼(뚜껑) + 口(그릇)|회의|뚜껑(亼)이 그릇(口)에 딱 맞음.\n騒|떠들 소|馬(말) + 蚤(벼룩)|형성|말(馬)이 벼룩(蚤)에 물려 날뜀 → 시끄럽다.\n並|나란히 병|立 + 立|회의|두 사람이 나란히 서 있음(立立).\n捨|버릴 사|扌(손) + 舎|형성|손(扌)에서 놓아 버림.\n預|맡길 예|予(미리) + 頁|형성|미리(予) 맡겨 둠.\n冗|쓸데없을 용|冖(집) + 几(책상)|회의|집(冖) 안에서 할 일 없이 앉아 있음 → 쓸데없음.\n談|말씀 담|言(말) + 炎(모닥불)|형성|모닥불(炎) 가에 앉아 나누는 이야기(言).\n運|옮길 운|辶(가다) + 軍(군대)|형성|군대(軍)가 이동함(辶) → 옮기다, 운.\n賃|품삯 임|任(맡기다) + 貝(돈)|형성|일을 맡긴(任) 대가로 주는 돈(貝).\n乱|어지러울 란|舌 + 乚|회의|엉킨 실을 손으로 푸는 모양 → 어지럽다.\n模|본뜰 모|木(나무) + 莫|형성|나무(木)로 만든 틀 → 본뜨다, 모범.\n範|법 범|竹(대나무) + 車 + 㔾|형성|대나무(竹)로 만든 틀 → 본보기.\n険|험할 험|阝(언덕) + 㑒|형성|언덕(阝)이 가파름 → 험하다.\n握|쥘 악|扌(손) + 屋|형성|손(扌)으로 꽉 쥠.\n手|손 수|手|상형|다섯 손가락을 편 손.\n腕|팔 완|月(몸) + 宛(굽다)|형성|몸(月)에서 굽는(宛) 부분 → 팔, 솜씨.\n善|착할 선|羊(양) + 言(말)|회의|양(羊)처럼 온순하고 좋은 말 → 착함.\n良|어질 량|良|상형|곡식을 골라내는 체 → 좋다.\n幼|어릴 유|幺(작다) + 力(힘)|회의|힘(力)이 아직 작음(幺) → 어리다.\n削|깎을 삭|肖(작아지다) + 刂(칼)|형성|칼(刂)로 조금씩(肖) 깎음.\n除|덜 제|阝(언덕) + 余|형성|계단(阝)의 흙을 걷어냄 → 제거.\n等|무리 등|竹(대나무) + 寺(관청)|회의|관청(寺)에서 죽간(竹)을 가지런히 맞춤 → 같다, 등급.\n布|베 포|父 + 巾(천)|형성|천(巾) → 베, 널리 펴다.\n福|복 복|礻(신) + 畐(술단지)|형성|신(礻)에게 술단지(畐)를 바치고 받는 복.\n祉|복 지|礻(신) + 止(머물다)|형성|신(礻)이 머무는(止) 곳에 내리는 복.\n機|틀 기|木(나무) + 幾|형성|나무(木)로 짠 베틀 → 기계, 기회.\n嫌|싫어할 혐|女(여자) + 兼|형성|여자(女)가 싫어함. 機嫌은 '기분'.\n損|덜 손|扌(손) + 員|형성|손(扌)으로 덜어냄 → 손해.\n管|대롱 관|竹(대나무) + 官|형성|대나무(竹) 관 → 관리하다.\n理|다스릴 리|王(玉: 옥) + 里|형성|옥(玉)을 결대로 다듬음 → 이치, 다스림.\n研|갈 연|石(돌) + 开|형성|돌(石)에 갊 → 연구.\n修|닦을 수|攸 + 彡(꾸밈)|형성|닦고 꾸밈(彡) → 수양, 연수.\n絶|끊을 절|糸(실) + 色(刀+巴)|회의|칼(刀)로 실(糸)을 끊음.\n投|던질 투|扌(손) + 殳(창)|회의|손(扌)으로 창(殳)을 던짐.\n票|표 표|西(襾) + 示|회의|불똥이 튀어 오르는 모양 → 쪽지, 표.\n抱|안을 포|扌(손) + 包(싸다)|형성|손(扌)으로 감싸 안음(包).\n無|없을 무|無|상형|춤추는 사람의 모양 → '없다'로 차용.\n回|돌 회|回|상형|소용돌이 모양 → 돌다, 횟수.\n答|대답 답|竹(대나무) + 合(맞다)|형성|죽간(竹)에 맞게(合) 답을 씀.\n日|날 일|日|상형|해의 모양.\n本|근본 본|木 + 一|지사|나무(木) 뿌리 부분에 표시 → 근본, 책.\n風|바람 풍|凡 + 虫(벌레)|형성|바람이 불면 벌레(虫)가 깨어남 → 바람, 풍습.\n壁|벽 벽|辟 + 土(흙)|형성|흙(土)으로 쌓은 벽.\n際|즈음 제|阝(언덕) + 祭|형성|언덕(阝)이 맞닿는 경계 → 가장자리, 즈음.\n対|대할 대|文(丵) + 寸(손)|회의|손(寸)에 든 것을 마주 대함.\n抗|겨룰 항|扌(손) + 亢(목)|형성|손(扌)으로 막아 버팀 → 저항.\n諸|모두 제|言(말) + 者|형성|여러 사람의 말(言) → 모든, 여러.\n続|이을 속|糸(실) + 売|형성|실(糸)을 계속 이음.\n二|두 이|二|지사|선 두 개.\n連|잇닿을 련|辶(가다) + 車(수레)|회의|수레(車)가 줄지어 감(辶) → 잇다, 동반.\n誤|그르칠 오|言(말) + 呉|형성|말(言)을 잘못함 → 오류.\n好|좋을 호|女(여자) + 子(아이)|회의|어머니(女)가 아이(子)를 안고 좋아함.\n頼|의뢰할 뢰|束(묶다) + 頁|형성|단단히 묶어(束) 의지함 → 믿다, 부탁하다.\n求|구할 구|求|상형|털가죽 옷의 모양 → '구하다'로 차용.\n話|말씀 화|言(말) + 舌(혀)|회의|혀(舌)로 하는 말(言) → 이야기.\n後|뒤 후|彳(가다) + 幺(실) + 夂(발)|회의|발이 실에 묶여 뒤처져 걸음.\n悔|뉘우칠 회|忄(마음) + 每|형성|마음(忄)으로 뉘우침.\n盛|성할 성|成 + 皿(그릇)|형성|그릇(皿)에 수북이 담음 → 번성.\n上|위 상|上|지사|기준선 위에 점을 찍어 '위'를 표시.\n惜|아낄 석|忄(마음) + 昔(옛날)|형성|지난(昔) 것을 마음(忄)으로 아까워함.\n速|빠를 속|辶(가다) + 束|형성|빨리 감(辶). 束(そく)이 음.\n for (let i = 0; i < WORDS.length; i += PER_DAY) DAYS.push(WORDS.slice(i, i + PER_DAY));
// 마지막 Day가 너무 짧으면 앞 Day에 합침
if (DAYS.length > 1 && DAYS[DAYS.length-1].length < PER_DAY/2) { const last = DAYS.pop(); DAYS[DAYS.length-1].push(...last); }
WORDS.forEach(w => w.day = DAYS.findIndex(d => d.includes(w)) + 1);

// 문형: 문형|뜻|예문([정답])|해석|연도|그룹
const GRAMMAR = [];
for (const line of RAW_GRAMMAR.split('\n')) {
  if (!line.trim() || line[0] === '#') continue;
  const [p, m, s, k, years, g] = line.split('|');
  const mt = /\[([^\]]+)\]/.exec(s || '');
  if (!p || !mt) continue;   // 형식이 깨진 줄은 건너뜀 (빌드 단계에서도 검사)
  GRAMMAR.push({id: GRAMMAR.length, p, m, s, a: mt[1], k: k || '', years: (years || '').split(',').filter(Boolean), g: (g || '').trim()});
}
const GDAYS = [];
for (let i = 0; i < GRAMMAR.length; i += PER_DAY) GDAYS.push(GRAMMAR.slice(i, i + PER_DAY));
if (GDAYS.length > 1 && GDAYS[GDAYS.length-1].length < PER_DAY/2) { const last = GDAYS.pop(); GDAYS[GDAYS.length-1].push(...last); }
GRAMMAR.forEach(g => g.day = GDAYS.findIndex(d => d.includes(g)) + 1);

const isKanji = c => /[一-鿿々]/.test(c);
const uniqKanji = w => [...new Set([...w].filter(c => /[一-鿿]/.test(c)))];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- kana utils ----------
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const ROMA = {
  kya:'きゃ',kyu:'きゅ',kyo:'きょ',sha:'しゃ',shu:'しゅ',sho:'しょ',she:'しぇ',sya:'しゃ',syu:'しゅ',syo:'しょ',
  cha:'ちゃ',chu:'ちゅ',cho:'ちょ',che:'ちぇ',tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',cya:'ちゃ',cyu:'ちゅ',cyo:'ちょ',
  nya:'にゃ',nyu:'にゅ',nyo:'にょ',hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',mya:'みゃ',myu:'みゅ',myo:'みょ',
  rya:'りゃ',ryu:'りゅ',ryo:'りょ',gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',ja:'じゃ',ju:'じゅ',jo:'じょ',je:'じぇ',
  jya:'じゃ',jyu:'じゅ',jyo:'じょ',zya:'じゃ',zyu:'じゅ',zyo:'じょ',bya:'びゃ',byu:'びゅ',byo:'びょ',pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
  dya:'ぢゃ',dyu:'ぢゅ',dyo:'ぢょ',shi:'し',chi:'ち',tsu:'つ',ltu:'っ',xtu:'っ',
  ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',sa:'さ',si:'し',su:'す',se:'せ',so:'そ',ta:'た',ti:'ち',tu:'つ',te:'て',to:'と',
  na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ',ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
  ya:'や',yu:'ゆ',yo:'よ',ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',wa:'わ',wo:'を',
  ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご',za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど',
  ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',
  a:'あ',i:'い',u:'う',e:'え',o:'お',xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ',"nn":'ん',"n'":'ん','-':'ー'
};
function romaToHira(input){
  let s = input.toLowerCase(), out = '', i = 0;
  while (i < s.length) {
    const c = s[i];
    if (!/[a-z'\-]/.test(c)) { out += c; i++; continue; }
    // 촉음: 같은 자음 두 번 (n 제외)
    if (i+1 < s.length && c === s[i+1] && /[bcdfghjklmpqrstvwxyz]/.test(c) && c !== 'n') { out += 'っ'; i++; continue; }
    if (c === 't' && s[i+1] === 'c' && s[i+2] === 'h') { out += 'っ'; i++; continue; } // tch → っち
    if (c === 'n' && s[i+1] === 'n') {
      // "konnichi" → こんにち : 뒤에 모음/y가 오면 첫 n만 ん
      if (/[aiueoy]/.test(s[i+2] || '')) { out += 'ん'; i++; } else { out += 'ん'; i += 2; }
      continue;
    }
    let hit = false;
    for (let len = 3; len >= 1; len--) {
      const seg = s.substr(i, len);
      if (ROMA[seg]) {
        out += ROMA[seg]; i += len; hit = true; break;
      }
    }
    if (hit) continue;
    if (c === 'n') { out += 'ん'; i++; continue; }  // 자음 앞 또는 끝의 n
    out += c; i++; // 해석 불가 문자는 그대로 (오답 처리됨)
  }
  return out;
}
const normReading = s => kata2hira(romaToHira(String(s).trim().replace(/\s+/g, ''))).replace(/[・.,、。]/g, '');
function readingMatches(input, answer){
  const a = normReading(answer), u = normReading(input);
  if (!u) return false;
  if (u === a) return true;
  // な형용사 だ / する동사 する 생략 허용
  for (const suf of ['だ', 'する']) if (a.endsWith(suf) && u === a.slice(0, -suf.length)) return true;
  return false;
}

// 오답 후보 생성 (JLPT 문제1 스타일: 장음·탁음·촉음 혼동)
const DAKU = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const UNDAKU = Object.fromEntries(Object.entries(DAKU).map(([k,v]) => [v,k]));
function mutations(r){
  const out = new Set(), h = r;
  // 장음 추가/삭제: ょう↔ょ, ゅう↔ゅ, おう/こう↔こ
  h.replace(/([ょゅ])う/g, (m, p, idx) => { out.add(h.slice(0, idx) + p + h.slice(idx+2)); return m; });
  h.replace(/[ょゅ](?!う)/g, (m, idx) => { out.add(h.slice(0, idx+1) + 'う' + h.slice(idx+1)); return m; });
  h.replace(/([こそとのほもよろごぞどぼぽ])う/g, (m, p, idx) => { out.add(h.slice(0, idx+1) + h.slice(idx+2)); return m; });
  h.replace(/([こそとほよごぞどぼ])(?!う)/g, (m, p, idx) => { if (idx < h.length-1) out.add(h.slice(0, idx+1) + 'う' + h.slice(idx+1)); return m; });
  // 탁음 토글
  [...h].forEach((c, idx) => {
    if (DAKU[c]) out.add(h.slice(0, idx) + DAKU[c] + h.slice(idx+1));
    if (UNDAKU[c]) out.add(h.slice(0, idx) + UNDAKU[c] + h.slice(idx+1));
  });
  // 촉음 토글
  h.replace(/っ/g, (m, idx) => { out.add(h.slice(0, idx) + 'つ' + h.slice(idx+1)); out.add(h.slice(0, idx) + h.slice(idx+1)); return m; });
  out.delete(h);
  return [...out].filter(x => x.length > 0);
}
function readingChoices(word){
  const ans = word.r;
  const pool = new Set();
  shuffle(mutations(word.r)).slice(0, 3).forEach(x => pool.add(x));
  // 같은 길이대의 다른 단어 읽기로 채움
  const others = shuffle(WORDS.filter(w => w.id !== word.id && Math.abs(w.r.length - word.r.length) <= 2)).map(w => w.r);
  for (const o of others) { if (pool.size >= 3) break; if (o !== ans) pool.add(o); }
  pool.delete(ans);
  return shuffle([ans, ...[...pool].slice(0, 3)]);
}
function meaningChoices(word){
  const pool = [];
  for (const w of shuffle(WORDS)) {
    if (pool.length >= 3) break;
    if (w.id !== word.id && w.m !== word.m && !pool.includes(w.m)) pool.push(w.m);
  }
  return shuffle([word.m, ...pool]);
}

// ---------- TTS ----------
function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) {}
}

let stack = [];
function go(fn, args, replace){ if (replace) stack.pop(); stack.push([fn, args]); fn(...(args||[])); window.scrollTo(0, 0); }
function back(){
  if (stack.length <= 1) return;
  stack.pop();
  const [fn, args] = stack[stack.length-1];
  // Detail에서 퀴즈로 돌아올 때 진행 상태를 유지 (재시작 방지)

}

// ---------- SRS (간격 반복, SM-2 간소화) ----------
// key: 'w<단어id>' | 'g<문형id>' → {r: 연속 정답 수, i: 간격(일), e: 난이도 계수, d: 다음 복습일(자정 ms)}
const DAY_MS = 864e5;
const srs = (() => { const v = store.get('srs', {}); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; })();
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
function srsGrade(key, ok){
  const t = today0();
  const c = srs[key] || {r: 0, i: 0, e: 2.5, d: t};
  if (ok) {
    // 아직 복습일이 안 된 카드를 미리 맞힌 경우 간격을 늘리지 않음 (같은 날 반복 풀이로 간격이 폭주하는 것 방지)
    if (c.r > 0 && c.d > t) return;
    c.r += 1;
    c.i = c.r === 1 ? 1 : c.r === 2 ? 3 : Math.min(180, Math.round(c.i * c.e));
    c.e = Math.min(3.0, c.e + 0.1);
  } else {
    c.r = 0; c.i = 0; c.e = Math.max(1.3, c.e - 0.2);
  }
  c.d = t + c.i * DAY_MS;   // 틀리면 i=0 → 오늘 다시 복습 대상
  srs[key] = c; store.set('srs', srs);
}
function dueList(prefix, arr){
  const t = today0();
  return Object.keys(srs)
    .filter(k => k[0] === prefix && srs[k] && srs[k].d <= t && arr[+k.slice(1)])
    .sort((a, b) => srs[a].d - srs[b].d)
    .map(k => arr[+k.slice(1)]);
}
const REVIEW_MAX = 30;
function srsLabel(key){
  const c = srs[key]; if (!c) return '미학습';
  const days = Math.round((c.d - today0()) / DAY_MS);
  return days <= 0 ? '복습 필요' : `${days}일 후 복습`;
}

function highlight(sentence, word){
  // 활용형 대응: 단어의 한자 어간(처음 가나 앞까지)으로 강조
  const stem = word.replace(/だ$/, '');
  let key = sentence.includes(stem) ? stem : (word.match(/^[^぀-ゟ]+/) || [''])[0];
  if (!key || !sentence.includes(key)) return esc(sentence);
  const i = sentence.indexOf(key);
  return esc(sentence.slice(0, i)) + '<mark>' + esc(key) + '</mark>' + esc(sentence.slice(i + key.length));
}

    </div>
    <p class="note" style="margin-top:0">직접 입력은 히라가나·가타카나·로마자(예: kyougi) 모두 인정. な형용사의 'だ', 'する'는 생략 가능.</p>
    <div class="dgrid">${DAYS.map((d, i) => { const b = best[i+1]; const pf = b && b.score === b.total;
      return `<button class="card ${pf?'perfect':''}" data-d="${i+1}"><b>Day ${i+1}</b><span>${b ? `최고 ${b.score}/${b.total}` : `${d.length}문제`}</span></button>`; }).join('')}
      <button class="card" data-d="all"><b>전체 랜덤</b><span>20문제</span></button>
    </div>`;
  view.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { quizMode = b.dataset.m; store.set('quizMode', quizMode); QuizMenu(); });
  view.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    if (b.dataset.d === 'all') go(Quiz, [shuffle(WORDS).slice(0, 20), '전체 랜덤', null]);
    else { const d = +b.dataset.d; go(Quiz, [DAYS[d-1], `Day ${d} 퀴즈`, d]); }
  });
}

function Quiz(list, title, day){
  const qs = shuffle(list);
  let idx = 0, score = 0; const wrong = [];
  let st;
  setHeader(title, true);
  function render(){
    const w = qs[idx];
    st = {w, step: 1, readOK: null, rc: quizMode === 'choice' ? readingChoices(w) : null, mc: meaningChoices(w), locked: false};
    draw();
  }
  function draw(){
    const {w, step} = st;
    view.innerHTML = `
      <div class="qtop"><span>${idx+1} / ${qs.length}</span><div class="bar"><i style="width:${idx/qs.length*100}%"></i></div><span>정답 ${score}</span></div>
      <div class="card qcard">
        <div class="step">${step === 1 ? '① 읽는 법은?' : '② 뜻은?'}</div>
        <div class="word jp">${esc(w.w)}</div>
        <div class="revealed">${step === 2 ? esc(w.r) : ''}</div>
      </div>
      <div id="ans"></div>
      <div id="fb"></div>`;
    const ans = document.getElementById('ans');
    if (step === 1 && quizMode === 'type') {
      ans.innerHTML = `<form class="inp" id="f" autocomplete="off">
          <input id="in" lang="ja" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ひらがな 또는 romaji">
          <button class="btn primary" style="flex:0 0 auto">확인</button></form>
        <div class="hint" id="hint"></div>
        <button class="btn" id="giveup" style="width:100%;margin-top:6px">모르겠어요</button>`;
      const inp = document.getElementById('in'), hint = document.getElementById('hint');
      inp.oninput = () => { const v = inp.value.trim(); hint.textContent = /[a-z]/i.test(v) ? '→ ' + normReading(v) : ''; };
      document.getElementById('f').onsubmit = e => { e.preventDefault(); if (!inp.value.trim()) { inp.focus(); return; } answerReading(readingMatches(inp.value, w.r), inp.value); };
      document.getElementById('giveup').onclick = () => answerReading(false, '');
      setTimeout(() => { try { inp.focus(); } catch(e){} }, 50);
    } else {
      const opts = step === 1 ? st.rc : st.mc;
      ans.innerHTML = `<div class="choices">${opts.map((o, i) => `<button class="choice ${step===1?'jp':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      ans.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        if (st.locked) return;
        const o = opts[+b.dataset.i];
        if (step === 1) answerReading(o === w.r, o, b);
        else answerMeaning(o === w.m, b);
      });
    }
  }
  function mark(btn, ok, correctText){
    const all = view.querySelectorAll('.choice');
    all.forEach(x => { if (x.textContent === correctText) x.classList.add('ok'); });
    if (btn && !ok) btn.classList.add('ng');
  }
  function answerReading(ok, given, btn){
    if (st.locked) return; st.locked = true;
    st.readOK = ok;
    const fb = document.getElementById('fb');
    if (quizMode === 'choice') mark(btn, ok, st.w.r);
    else { const f = document.getElementById('f'); if (f) f.querySelector('input').disabled = true; const g = document.getElementById('giveup'); if (g) g.remove(); }
    fb.innerHTML = `<div class="fb ${ok?'ok':'ng'}">${ok ? '⭕ 정답' : '❌ 오답'} — <b class="jp">${esc(st.w.r)}</b>${!ok && given && quizMode==='type' ? ` <span style="color:var(--sub)">(입력: ${esc(normReading(given))})</span>` : ''}</div>`;
    setTimeout(() => { st.step = 2; st.locked = false; draw(); }, ok ? 650 : 1300);
  }
  function answerMeaning(ok, btn){
    if (st.locked) return; st.locked = true; st.done = true;
    mark(btn, ok, st.w.m);
    const both = ok && st.readOK;
    if (both) { score++; wrongSet.delete(st.w.id); } else { wrong.push(st.w); wrongSet.add(st.w.id); }
    srsGrade('w' + st.w.id, both);
    saveWrong();
    const ex = EX[st.w.w];
    const fb = document.getElementById('fb');
    fb.innerHTML = `<div class="fb ${both?'ok':'ng'}">${both ? '⭕ 완벽!' : (ok ? '뜻은 맞았지만 읽기가 틀렸어요' : '❌ 뜻: ' + esc(st.w.m))}
      ${ex ? `<div class="jp" style="margin-top:6px">${highlight(ex.s, st.w.w)}</div><div style="color:var(--sub);font-size:13px">${esc(ex.k)}</div>` : ''}</div>
      <div class="nav2"><button class="btn" id="info">한자 풀이</button><button class="btn primary" id="nx">${idx < qs.length-1 ? '다음 ›' : '결과 보기'}</button></div>`;
    document.getElementById('nx').onclick = next;
    document.getElementById('info').onclick = () => go(Detail, [st.w.id, null]);
    speak(st.w.r);
  }
  function next(){
    idx++;
    if (idx < qs.length) { render(); window.scrollTo(0, 0); return; }
    if (day) { const prev = best[day]; if (!prev || score > prev.score) { best[day] = {score, total: qs.length}; store.set('best', best); } }
    showResult();
  }
  function showResult(){
    view.innerHTML = `
      <div class="card result"><div style="color:var(--sub)">${esc(title)}</div>
        <div class="score">${score} / ${qs.length}</div>
        <div style="color:var(--sub)">${score === qs.length ? '만점! 🎉' : `틀린 단어 ${wrong.length}개는 오답노트에 저장됨`}</div></div>
      ${wrong.length ? `<h2 class="sub">틀린 단어</h2><div class="list wrongs">${wrong.map(w => `
        <button class="card row" data-id="${w.id}"><div class="w jp">${esc(w.w)}<small>${esc(w.r)}</small></div><div class="m">${esc(w.m)}</div></button>`).join('')}</div>` : ''}
      <div class="nav2">${wrong.length ? `<button class="btn primary" id="retry">틀린 것만 다시</button>` : ''}<button class="btn" id="again">처음부터</button></div>`;
    view.querySelectorAll('.wrongs .row').forEach(r => r.onclick = () => go(Detail, [+r.dataset.id, wrong.map(w => w.id)]));
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => go(Quiz, [wrong.slice(), title + ' (재도전)', null], true);
    document.getElementById('again').onclick = () => go(Quiz, [list, title, day], true);
  }
  Quiz._resume = () => {
    setHeader(title, true);
    if (idx >= qs.length) showResult();
    else if (st.done) next();            // 뜻까지 답한 문제 → 다음 문제로
    else { st.locked = false; draw(); }  // 풀던 문제 그대로
  };
  render();
}

// ---------- review (SRS) ----------
function Review(){
  setHeader('오늘의 복습', true);
  const dw = dueList('w', WORDS), dg = dueList('g', GRAMMAR);
  const learnedW = Object.keys(srs).filter(k => k[0] === 'w').length, learnedG = Object.keys(srs).filter(k => k[0] === 'g').length;
  view.innerHTML = `
    <div class="menu">
      <button class="card" id="rW" ${dw.length ? '' : 'disabled'}><div class="big jp">単</div><div><h2>단어 복습 ${dw.length}개</h2><p>${dw.length ? `한 번에 최대 ${REVIEW_MAX}개` : '오늘 복습할 단어가 없습니다'}</p></div></button>
      <button class="card" id="rG" ${dg.length ? '' : 'disabled'}><div class="big jp">文</div><div><h2>문형 복습 ${dg.length}개</h2><p>${dg.length ? `한 번에 최대 ${REVIEW_MAX}개` : '오늘 복습할 문형이 없습니다'}</p></div></button>
    </div>
    <p class="note">학습 기록: 단어 ${learnedW}/${WORDS.length} · 문형 ${learnedG}/${GRAMMAR.length}<br>
    Day별 퀴즈·문형 퀴즈에서 푼 항목이 자동으로 복습 일정에 등록됩니다. 맞히면 복습 간격이 늘어나고(1일→3일→약 8일→…), 틀리면 오늘 다시 나옵니다.</p>`;
  if (dw.length) document.getElementById('rW').onclick = () => go(Quiz, [dw.slice(0, REVIEW_MAX), '단어 복습', null]);
  if (dg.length) document.getElementById('rG').onclick = () => go(GQuiz, [dg.slice(0, REVIEW_MAX), '문형 복습', null]);
}

// ---------- grammar book ----------
const gFull = s => s.replace(/\[([^\]]+)\]/, '$1');
const gMarked = s => { const m = /\[([^\]]+)\]/.exec(s); return m ? esc(s.slice(0, m.index)) + '<mark>' + esc(m[1]) + '</mark>' + esc(s.slice(m.index + m[0].length)) : esc(s); };
let gOpen = null;
function GBook(day){
  day = Math.min(Math.max(1, day|0), GDAYS.length);
  store.set('gbookDay', day);
  setHeader('기출 문형', true);
  const gb = store.get('gbest', {});
  view.innerHTML = `
    <div class="days">${GDAYS.map((d, i) => `<button class="${i+1===day?'on':''}" data-d="${i+1}">Day ${i+1}${gb[i+1] ? ` · ${gb[i+1].score}/${gb[i+1].total}` : ''}</button>`).join('')}</div>
    <div class="nav2" style="margin:0 0 10px"><button class="btn primary" id="gq">Day ${day} 문형 퀴즈</button><button class="btn" id="gall">전체 랜덤 20</button></div>
    <div class="list">${GDAYS[day-1].map(g => `
      <button class="card grow" data-id="${g.id}">
        <div class="gp"><span class="jp">${esc(g.p)}</span><span class="gm">${esc(g.m)}</span></div>
        ${gOpen === g.id ? `<div class="gx"><div class="jp s">${gMarked(g.s)}</div><div class="k">${esc(g.k)}</div>
          <div class="meta">기출 ${esc(g.years.join(', '))} · ${esc(srsLabel('g' + g.id))}</div></div>` : ''}
      </button>`).join('')}</div>`;
  const on = view.querySelector('.days .on'); if (on) on.scrollIntoView({inline: 'center', block: 'nearest'});
  view.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { gOpen = null; go(GBook, [+b.dataset.d], true); });
  view.querySelectorAll('.grow').forEach(b => b.onclick = () => {
    const id = +b.dataset.id;
    gOpen = gOpen === id ? null : id;
    GBook(day);
    if (gOpen !== null) speak(gFull(GRAMMAR[id].s));
  });
  document.getElementById('gq').onclick = () => go(GQuiz, [GDAYS[day-1], `문형 Day ${day}`, day]);
  document.getElementById('gall').onclick = () => go(GQuiz, [shuffle(GRAMMAR).slice(0, 20), '문형 랜덤', null]);
}

// 오답 보기: 같은 유사 그룹·같은 정답 문자열 제외, 정답과 길이가 비슷한 것 우선
function grammarChoices(g){
  const cands = shuffle(GRAMMAR.filter(x => x.id !== g.id && x.a !== g.a && !(g.g && x.g === g.g)));
  cands.sort((x, y) => Math.abs(x.a.length - g.a.length) - Math.abs(y.a.length - g.a.length));
  const picked = [];
  for (const c of cands.slice(0, 12).sort(() => Math.random() - 0.5)) {
    if (picked.length >= 3) break;
    if (!picked.includes(c.a)) picked.push(c.a);
  }
  return shuffle([g.a, ...picked]);
}

function GQuiz(list, title, gday){
  const qs = shuffle(list);
  let idx = 0, score = 0, locked = false; const wrong = [];
  setHeader(title, true);
  function draw(){
    const g = qs[idx], opts = grammarChoices(g);
    locked = false;
    const blank = g.s.replace(/\[[^\]]+\]/, '<span class="blank">　？　</span>');
    view.innerHTML = `
      <div class="qtop"><span>${idx+1} / ${qs.length}</span><div class="bar"><i style="width:${idx/qs.length*100}%"></i></div><span>정답 ${score}</span></div>
      <div class="card qcard"><div class="step">빈칸에 들어갈 알맞은 것은?</div>
        <div class="jp gsent">${blank.split(/(<span class="blank">　？　<\/span>)/).map((t, i) => i % 2 ? t : esc(t)).join('')}</div></div>
      <div class="choices">${opts.map((o, i) => `<button class="choice jp" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    view.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const ok = opts[+b.dataset.i] === g.a;
      view.querySelectorAll('.choice').forEach(x => { if (x.textContent === g.a) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      if (ok) score++; else wrong.push(g);
      srsGrade('g' + g.id, ok);
      document.getElementById('fb').innerHTML = `
        <div class="fb ${ok ? 'ok' : 'ng'}">${ok ? '⭕ 정답' : '❌ 오답'} — <b class="jp">${esc(g.p)}</b> : ${esc(g.m)}
          <div class="jp" style="margin-top:6px">${gMarked(g.s)}</div><div style="color:var(--sub);font-size:13px">${esc(g.k)}</div></div>
        <div class="nav2"><button class="btn primary" id="nx">${idx < qs.length-1 ? '다음 ›' : '결과 보기'}</button></div>`;
      document.getElementById('nx').onclick = next;
      speak(gFull(g.s));
    });
  }
  function next(){
    idx++;
    if (idx < qs.length) { draw(); window.scrollTo(0, 0); return; }
    if (gday) { const gb = store.get('gbest', {}); if (!gb[gday] || score > gb[gday].score) { gb[gday] = {score, total: qs.length}; store.set('gbest', gb); } }
    view.innerHTML = `
      <div class="card result"><div style="color:var(--sub)">${esc(title)}</div>
        <div class="score">${score} / ${qs.length}</div>
        <div style="color:var(--sub)">${score === qs.length ? '만점! 🎉' : `틀린 문형 ${wrong.length}개는 오늘 복습 목록에 추가됨`}</div></div>
      ${wrong.length ? `<h2 class="sub">틀린 문형</h2><div class="list">${wrong.map(g => `
        <div class="card grow"><div class="gp"><span class="jp">${esc(g.p)}</span><span class="gm">${esc(g.m)}</span></div>
          <div class="gx"><div class="jp s">${gMarked(g.s)}</div><div class="k">${esc(g.k)}</div></div></div>`).join('')}</div>` : ''}
      <div class="nav2">${wrong.length ? `<button class="btn primary" id="retry">틀린 것만 다시</button>` : ''}<button class="btn" id="again">처음부터</button></div>`;
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => go(GQuiz, [wrong.slice(), title + ' (재도전)', null], true);
    document.getElementById('again').onclick = () => go(GQuiz, [list, title, gday], true);
  }
  draw();
}
