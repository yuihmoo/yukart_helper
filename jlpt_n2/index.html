<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことば帳</title>
<meta name="description" content="よん: JLPT N2 필수 단어·문형 / れん: TOPIK 韓国語">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ことば帳">
<meta name="theme-color" content="#16181d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1f24;--sub:#6b6f78;--line:#e4e2dc;--accent:#c8553d;--accent-weak:#f6e3de;--blue:#3d6fc8;--blue-weak:#e0e9f8;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--on-accent:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme]){--bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;--accent:#e27a5f;--accent-weak:#3a2622;--blue:#7fa3e6;--blue-weak:#1f2a3d;--shadow:none}}
:root[data-theme="dark"]{--bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;--accent:#e27a5f;--accent-weak:#3a2622;--blue:#7fa3e6;--blue-weak:#1f2a3d;--shadow:none}
/* 중간 톤(ダーク와 ライト 사이) */
:root[data-theme="dim"]{--bg:#3b3f47;--card:#474c55;--ink:#eef0f3;--sub:#bcc0c8;--line:#575c66;--ok:#7dd6a5;--ok-weak:#3d5549;--ng:#f2a08a;--ng-weak:#5c4840;--chip:#525761;--shadow:0 1px 2px rgba(0,0,0,.15);--on-accent:#22252b;--accent:#f2a08a;--accent-weak:#5c4840;--blue:#a3c0f5;--blue-weak:#46526b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Apple SD Gothic Neo","Noto Sans JP","Noto Sans KR",sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex}
main{margin:auto;width:100%;max-width:560px;padding:24px 16px;display:grid;gap:16px}
h1{font-size:15px;color:var(--sub);font-weight:600;text-align:center;margin:0 0 8px;letter-spacing:.05em}
a.pick{display:flex;align-items:center;gap:18px;padding:26px 22px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:inherit;text-decoration:none}
a.pick:active{transform:scale(.98)}
.badge{flex:0 0 auto;width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-size:40px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.yon .badge{background:var(--accent-weak);color:var(--accent)}
.ren .badge{background:var(--blue-weak);color:var(--blue)}
.name{font-size:30px;font-weight:800;line-height:1.1}
.desc{font-size:14px;color:var(--sub);margin-top:4px}
.pick.off{opacity:.5;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{flex:1;padding:12px;border-radius:12px;background:var(--line);font:inherit;font-weight:600;color:inherit;border:0}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.bkopen{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;justify-self:center}
</style>
</head>
<body>
<main>
  <h1>ことば帳 · 단어장</h1>
  <a class="pick yon" href="yon.html">
    <div class="badge">漢</div>
    <div><div class="name">よん</div><div class="desc">JLPT N2 필수 단어 · 문형 · 기출</div></div>
  </a>
  <a class="pick ren" id="ren" href="ren.html">
    <div class="badge">한</div>
    <div><div class="name">れん</div><div class="desc" id="renDesc">TOPIK 韓国語 単語 · 文法</div></div>
  </a>
  <div id="bkBanner"></div>
  <button class="bkopen" id="bkOpen" type="button"></button>
  <section id="bkView" hidden></section>
</main>
<script src="shared/backup.js"></script>
<script>
try { const t = JSON.parse(localStorage.getItem('n2:theme') || 'null'); if (['light', 'dim', 'dark'].includes(t)) { document.documentElement.setAttribute('data-theme', t); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', {light: '#f6f5f2', dim: '#3b3f47', dark: '#16181d'}[t]); } } catch (e) {}
// ren.html이 아직 배포되지 않았으면 비활성 표시 (오프라인이면 캐시 응답으로 판단)
fetch('ren.html').then(r => { if (!r.ok) throw 0; }).catch(() => {
  document.getElementById('ren').classList.add('off');
  document.getElementById('renDesc').textContent = '準備中 · 준비 중';
});
// 학습 기록 백업 (よん·れん 공통) — 기기 언어가 일본어면 일본어, 아니면 한국어
try {
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lang = /^ja/i.test(navigator.language || '') ? 'ja' : 'ko';
  const BK = makeBackup({esc, T: BACKUP_T[lang]});
  const open = document.getElementById('bkOpen'), sec = document.getElementById('bkView');
  open.textContent = lang === 'ja' ? '学習記録のバックアップ · 학습 기록 백업' : '학습 기록 백업 · 学習記録のバックアップ';
  const show = () => { sec.hidden = false; open.hidden = true; BK.screen(sec); sec.scrollIntoView({behavior: 'smooth'}); };
  open.onclick = show;
  BK.banner(document.getElementById('bkBanner'), show);
} catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
