<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N2 한자 암기</title>
<meta name="description" content="JLPT N2 기출 어휘 한자 암기장 & Day별 퀴즈">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N2 한자">
<meta name="theme-color" content="#16181d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1f24;--sub:#6b6f78;--line:#e4e2dc;
  --accent:#c8553d;--accent-weak:#f6e3de;--ok:#2f8f5b;--ok-weak:#dcf1e5;--ng:#c8553d;--ng-weak:#f8e0da;
  --chip:#efede8;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--on-accent:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;
    --accent:#e27a5f;--accent-weak:#3a2622;--ok:#5cc28a;--ok-weak:#1d3328;--ng:#e27a5f;--ng-weak:#3a2622;
    --chip:#2a2e36;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;
  --accent:#e27a5f;--accent-weak:#3a2622;--ok:#5cc28a;--ok-weak:#1d3328;--ng:#e27a5f;--ng-weak:#3a2622;
  --chip:#2a2e36;--shadow:none;
}
/* 중간 톤(ダーク와 ライト 사이) */
:root[data-theme="dim"]{--bg:#3b3f47;--card:#474c55;--ink:#eef0f3;--sub:#bcc0c8;--line:#575c66;--ok:#7dd6a5;--ok-weak:#3d5549;--ng:#f2a08a;--ng-weak:#5c4840;--chip:#525761;--shadow:0 1px 2px rgba(0,0,0,.15);--on-accent:#22252b;--accent:#f2a08a;--accent-weak:#5c4840;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px 32px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--chip)}
#view{touch-action:manipulation}   /* 더블탭 확대 끄기(핀치 확대는 유지) */
.dtoast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);padding:12px 20px;border-radius:14px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;box-shadow:0 6px 24px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:20}
.dtoast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.swipe-l{animation:swl .18s ease-out}.swipe-r{animation:swr .18s ease-out}
@keyframes swl{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.swipe-l,.swipe-r{animation:none}}
.iconbtn.txt{width:auto;padding:0 10px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.iconbtn.txt.on{background:var(--accent);color:var(--on-accent)}
/* 가리기: 뜻·읽기 / 예문 해석 (탭하면 그 항목만 잠깐 보기) */
.hide-m .detail .reading,.hide-m .detail .mean,.hide-m .rd .use,.hide-m .rd .rchip.hit,.hide-m .rd .rchip:not(.hit) small i,
.hide-m .row .m,.hide-m .row .w small,
.hide-k .ex .k,.hide-k .gx .k{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .15s}
.hide-m .peek,.hide-k .peek{filter:none!important}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.menu{display:grid;gap:12px;margin-top:8px}
.menu .card{padding:20px;text-align:left;display:flex;gap:16px;align-items:center;width:100%}
.menu .big{font-size:34px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent)}
.menu h2{margin:0;font-size:18px}.menu p{margin:2px 0 0;color:var(--sub);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{padding:12px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:16px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--chip);font-size:14px;white-space:nowrap}
.days button.on{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row .w{font-size:22px;min-width:0;flex:1}
.row .w small{display:block;font-size:13px;color:var(--sub);font-family:inherit}
.row .m{font-size:13px;color:var(--sub);text-align:right;max-width:45%}
.row.done{opacity:.55}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:13px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.toolbar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px}
.pill.on{background:var(--accent);color:var(--on-accent)}
/* detail */
.detail .head{padding:20px;text-align:center}
.detail .head .word{font-size:44px;line-height:1.2;word-break:keep-all}
.detail .head .reading{font-size:20px;color:var(--accent);margin-top:4px}
.detail .head .mean{font-size:16px;margin-top:6px}
.detail .head .yrs{font-size:12px;color:var(--sub);margin-top:6px}
.sec{margin-top:12px;padding:16px}
.sec h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.kj{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kj:first-of-type{border-top:0;padding-top:0}
.kj .c{font-size:48px;line-height:64px;text-align:center;background:var(--chip);border-radius:12px;height:64px}
.kj .h{font-weight:700}
.kj .t{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--accent-weak);color:var(--accent);margin-left:6px;vertical-align:2px}
.kj .p{font-size:14px;margin-top:2px}
.kj .o{font-size:14px;color:var(--sub);margin-top:4px}
.rd{margin-top:10px}
.rd .use{font-size:13px;margin-bottom:6px}
.rd .use b{color:var(--accent);font-size:16px}
.rrow{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.rrow .lbl{flex:0 0 auto;font-size:11px;color:var(--sub);padding:5px 0;min-width:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.rchip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:4px 9px;border-radius:9px;background:var(--chip);border:1px solid transparent;line-height:1.3;text-align:left}
.rchip b{font-size:15px;font-weight:600}
.rchip .oku{color:var(--sub);font-weight:400}
.rchip small{font-size:11px;color:var(--sub)}
.rchip small i{font-style:normal;margin-left:3px}
.rchip.hit{background:var(--accent);border-color:var(--accent)}
.rchip.hit b,.rchip.hit small,.rchip.hit .oku{color:#fff}
.rchip.link{cursor:pointer}
.ex .s{font-size:19px;line-height:1.7}
mark{background:var(--accent-weak);color:inherit;border-radius:4px;padding:0 2px}
.ex .k{color:var(--sub);font-size:14px;margin-top:4px}
.exm{margin-top:14px;border-top:1px solid var(--line)}
.exm .xi{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px 0;border-bottom:1px solid var(--line)}
.exm .xi:last-child{border-bottom:0;padding-bottom:0}
.exm .xt{grid-column:1/-1;justify-self:start;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 7px}
.exm .s{font-size:17px;line-height:1.6}
.exm .k{grid-column:1}
.exm .xtts{grid-row:2/4;grid-column:2;align-self:center;width:36px;height:36px;border-radius:10px;background:var(--chip);font-size:15px}
.nav2{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:14px;background:var(--chip);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4}
.tts{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--chip);margin-top:10px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{padding:28px 16px;text-align:center;margin-top:12px}
.qcard .word{font-size:52px;line-height:1.2;word-break:keep-all}
.qcard .step{font-size:13px;color:var(--sub);margin-bottom:10px}
.qcard .revealed{font-size:18px;color:var(--accent);min-height:27px;margin-top:6px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:17px}
.choice.ok{background:var(--ok-weak);border-color:var(--ok)}
.choice.ng{background:var(--ng-weak);border-color:var(--ng)}
.inp{display:flex;gap:8px;margin-top:12px}
.inp input{flex:1;min-width:0;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--sub);margin-top:6px;min-height:18px}
.fb{margin-top:12px;padding:14px 16px;border-radius:14px;font-size:15px}
.fb.ok{background:var(--ok-weak)}.fb.ng{background:var(--ng-weak)}
.result{padding:24px;text-align:center}
.result .score{font-size:48px;font-weight:800}
.wrongs{margin-top:12px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dgrid .card{padding:14px 8px;text-align:center}
.dgrid b{display:block;font-size:17px}.dgrid span{font-size:12px;color:var(--sub)}
.dgrid .perfect{border-color:var(--ok)}
h2.sub{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:600}
.menu .card:disabled{opacity:.5}
.grow{display:block;width:100%;text-align:left;padding:12px 14px}
.gp{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.gp .jp{font-size:18px}.gp .gm{font-size:13px;color:var(--sub);text-align:right}
.gx{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.gx .s{font-size:17px;line-height:1.7}.gx .k{font-size:14px;color:var(--sub);margin-top:2px}
.gx .meta{font-size:12px;color:var(--sub);margin-top:6px}
.gsent{font-size:21px;line-height:1.8;text-align:left}
.sub.cat{margin:14px 0 2px;font-size:12px}
.pstar{font-size:12px;margin-left:6px;vertical-align:4px;color:var(--accent);font-family:inherit;letter-spacing:-1px}
.pstar.t1{opacity:.7}
.pred{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:10px;background:var(--accent-weak);color:var(--accent);font-size:13px;font-weight:600}
.pred small{display:block;font-weight:400;color:var(--sub);font-size:11px;margin-top:2px}
.qparts{flex-wrap:wrap}.qparts .btn{flex:1 1 40%}.qparts small{opacity:.8;font-weight:400;margin-left:2px}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn hidden" id="backBtn" aria-label="뒤로">‹</button>
    <h1 id="title">N2 기출 한자</h1>
    <button class="iconbtn txt" id="blurM" aria-label="뜻·읽기 가리기" aria-pressed="false">뜻</button>
    <button class="iconbtn txt" id="blurK" aria-label="예문 해석 가리기" aria-pressed="false">해석</button>
    <button class="iconbtn" id="themeBtn" aria-label="테마 전환">◐</button>
  </header>
  <main id="view"></main>
</div>

<script>

const RAW_KANJI = "濃|짙을 농|氵(물) + 農|형성|물(氵)기가 많아 걸쭉하고 짙은 상태. 農은 음(のう)을 나타냄.\n競|다툴 경|立 + 兄 ×2|회의|두 사람(兄兄)이 나란히 서서(立) 서로 겨루는 모습.\n技|재주 기|扌(손) + 支|형성|손(扌)으로 부리는 솜씨. 支(し→ぎ)가 음.\n消|사라질 소|氵(물) + 肖(작아지다)|형성|물(氵)이 점점 줄어(肖) 없어짐 → 끄다, 사라지다.\n毒|독 독|屮(풀) + 毋|회의|사람을 해치는 풀(屮)이 무성한 모양 → 독초, 독.\n構|얽을 구|木(나무) + 冓(엇갈려 짠 틀)|형성|나무(木)를 엇갈려 짜 맞춰(冓) 집을 세움 → 구조, 신경 쓰다(構う).\n知|알 지|矢(화살) + 口(입)|회의|화살(矢)처럼 빠르게 입(口)으로 알아맞힘 → 알다.\n人|사람 인|人|상형|사람이 옆을 보고 서 있는 모습.\n睡|졸음 수|目(눈) + 垂(드리우다)|형성|눈(目)꺼풀이 아래로 드리워짐(垂) → 졸다.\n眠|잘 면|目(눈) + 民|형성|눈(目)을 감고 잠. 民(みん)이 음.\n資|재물 자|次 + 貝(돈)|형성|돈(貝)을 차례(次)로 모아 둔 밑천 → 자원, 자본.\n補|기울 보|衤(옷) + 甫|형성|옷(衤)의 해진 곳을 기움 → 보충하다.\n説|말씀 설|言(말) + 兌(기뻐하다)|형성|말(言)로 풀어 상대를 납득(兌)시킴 → 설명.\n教|가르칠 교|孝(爻+子) + 攵(치다)|회의|아이(子)에게 셈(爻)을 회초리(攵)로 가르치는 모습.\n鮮|고울 선|魚(물고기) + 羊(양)|회의|갓 잡은 물고기(魚)와 양고기(羊) → 싱싱함, 선명함.\n大|큰 대|大|상형|사람이 팔다리를 크게 벌리고 선 모습.\n統|거느릴 통|糸(실) + 充(채우다)|형성|실(糸) 가닥을 가득(充) 모아 한 줄로 묶음 → 통합, 통솔.\n領|거느릴 령|令 + 頁(머리)|형성|머리(頁)·목덜미처럼 요점을 쥐고 다스림. 令(れい→りょう)이 음.\n制|절제할 제|未(가지 많은 나무) + 刂(칼)|회의|칼(刂)로 나뭇가지를 쳐서 다듬음 → 억제, 제도.\n判|판단할 판|半(반) + 刂(칼)|형성|칼(刂)로 반(半)씩 갈라 나눔 → 가려서 판정.\n断|끊을 단|㡭(이어진 실) + 斤(도끼)|회의|도끼(斤)로 이어진 실을 끊음 → 결단.\n調|고를 조|言(말) + 周(두루)|형성|말(言)을 두루(周) 맞춰 고르게 함 → 조정, 조사.\n整|가지런할 정|束(묶다) + 攵(치다) + 正(바르다)|형성|묶고(束) 두드려(攵) 바르게(正) 정돈함.\n字|글자 자|宀(집) + 子(아이)|형성|집(宀)에서 아이(子)가 태어나 늘듯, 글자가 불어남.\n雑|섞일 잡|衣(옷) + 集(모으다)의 변형|형성|여러 색의 옷감(衣)을 모아(集) 섞음 → 잡다함.\n逞|굳셀 령|辶(가다) + 呈(드러내다)|형성|힘을 드러내며(呈) 나아감(辶) → 늠름하다.\n一|한 일|一|지사|가로선 하나로 '하나'를 나타냄.\n思|생각 사|田(정수리 囟의 변형) + 心(마음)|회의|머리(囟)와 마음(心)으로 생각함.\n要|요긴할 요|襾 + 女|상형|여자가 두 손으로 허리를 잡은 모양 → 허리 → 중요한 곳.\n点|점 점|占 + 灬(불)|형성|불(灬)에 그을린 검은 점. 占(せん→てん)이 음.\n経|지날 경|糸(실) + 圣(巠: 베틀의 날실)|형성|베틀에 세로로 건 날실(糸) → 지나가다, 경과.\n過|지날 과|辶(가다) + 咼|형성|길을 지나감(辶) → 지나치다, 경과.\n打|칠 타|扌(손) + 丁(못)|형성|손(扌)으로 못(丁)을 두드림.\n確|굳을 확|石(돌) + 隺|형성|돌(石)처럼 단단함 → 확실함.\n信|믿을 신|亻(사람) + 言(말)|회의|사람(亻)의 말(言)에는 거짓이 없어야 함 → 믿음.\n特|특별할 특|牛(소) + 寺|형성|제사에 바치는 특별한 수소(牛) → 특별.\n定|정할 정|宀(집) + 正(바르다)|회의|집(宀) 안에 바르게(正) 자리 잡음 → 정하다.\n評|평할 평|言(말) + 平(공평)|형성|말(言)로 공평하게(平) 따짐 → 평가.\n価|값 가|亻(사람) + 西(賈의 변형)|형성|사람(亻)이 장사(賈)할 때 매기는 값.\n改|고칠 개|己(자기) + 攵(치다)|회의|자기(己)를 채찍질(攵)하여 고침.\n正|바를 정|一(목표) + 止(발)|회의|목표(一)를 향해 곧게 나아가는 발(止).\n備|갖출 비|亻(사람) + 𤰇(화살통)|형성|사람(亻)이 화살통을 갖추고 대비함.\n生|날 생|生|상형|땅(土) 위로 새싹이 돋아나는 모양.\n意|뜻 의|音(소리) + 心(마음)|회의|마음(心)에서 나오는 소리(音) → 뜻, 생각.\n気|기운 기|气(김) + 米(쌀)의 약자|형성|밥 지을 때 피어오르는 김(气) → 기운, 기분.\n地|땅 지|土(흙) + 也|형성|흙(土)이 넓게 펼쳐진 땅.\n悪|악할 악|亜(버금) + 心(마음)|형성|으뜸이 못 되는(亜) 마음(心) → 나쁨.\n反|돌이킬 반|厂(벼랑) + 又(손)|회의|손(又)으로 벼랑(厂)을 짚고 뒤집음 → 반대, 거스르다.\n偏|치우칠 편|亻(사람) + 扁(납작하다)|형성|사람(亻)이 한쪽으로 치우침.\n能|능할 능|能|상형|곰의 모양(=熊) → 힘센 곰처럼 능력이 있음.\n辛|매울 신|辛|상형|죄인에게 문신을 새기던 바늘 → 고통, 맵다.\n刑|형벌 형|开(井: 틀) + 刂(칼)|형성|칼(刂)로 다스리는 형벌.\n事|일 사|事|상형|깃발 달린 도구를 손에 든 모양 → 일, 사건.\n起|일어날 기|走(달리다) + 己|형성|달리려고(走) 몸을 일으킴. 己(き)가 음.\n収|거둘 수|丩(얽다) + 又(손)|형성|손으로 끌어모아 거둬들임.\n湿|젖을 습|氵(물) + 㬎의 약자|형성|물(氵)에 젖어 축축함.\n傾|기울 경|亻(사람) + 頃(기울다)|형성|사람(亻)이 머리를 기울임(頃).\n向|향할 향|宀(집) + 口(창)|상형|집의 북쪽 창문 모양 → 향하다.\n視|볼 시|礻(示: 보이다) + 見(보다)|형성|보이는(示) 것을 자세히 봄(見).\n察|살필 찰|宀(집) + 祭(제사)|형성|집(宀)에서 제사(祭) 지낼 때 세심히 살핌.\n絞|목맬 교|糸(실) + 交(엇갈리다)|형성|실(糸)을 엇갈려(交) 조임 → 짜다, 좁히다.\n施|베풀 시|㫃(깃발) + 也|형성|깃발(㫃)이 펄럭이듯 널리 베풂 → 시설, 실시.\n設|베풀 설|言(말) + 殳(손에 든 도구)|회의|말(言)로 지시하고 손(殳)으로 세움 → 설치.\n育|기를 육|𠫓(갓난아이) + 月(살)|회의|갓 태어난 아이(𠫓)에게 살(月)을 붙여 기름.\n論|논할 론|言(말) + 侖(차례)|형성|말(言)을 차례대로(侖) 조리 있게 논함.\n食|먹을 식|食|상형|뚜껑 덮인 그릇에 음식이 담긴 모양.\n条|가지 조|夂 + 木(나무)|형성|나무(木)의 가느다란 가지 → 조목, 조건.\n件|물건 건|亻(사람) + 牛(소)|회의|사람(亻)이 소(牛)를 한 마리씩 구분함 → 건, 사항.\n時|때 시|日(해) + 寺|형성|해(日)의 움직임으로 재는 때. 寺(じ)가 음.\n的|과녁 적|白(희다) + 勺|형성|흰(白) 과녁 한가운데 → 목표, '~적'.\n関|관계할 관|門(문) + 关(빗장)|형성|문(門)에 빗장을 거는 곳 → 관문 → 관계.\n与|줄 여|与|상형|두 손이 물건을 주고받는 모양 → 주다, 관여.\n則|법칙 칙|貝(鼎: 솥) + 刂(칼)|회의|솥(鼎)에 칼(刂)로 새긴 법률 → 규칙.\n追|쫓을 추|辶(가다) + 𠂤|형성|뒤를 따라가(辶) 쫓음.\n払|떨칠 불|扌(손) + 厶(弗의 약자)|형성|손(扌)으로 털어냄 → 쫓다, 지불하다.\n妙|묘할 묘|女(여자) + 少(젊다)|회의|젊은(少) 여자(女)의 오묘한 아름다움 → 묘하다.\n不|아닐 불|不|상형|꽃받침(또는 날아가 돌아오지 않는 새) 모양 → 부정.\n議|의논할 의|言(말) + 義(옳음)|형성|말(言)로 옳고(義) 그름을 따짐 → 의논.\n相|서로 상|木(나무) + 目(눈)|회의|나무(木)를 눈(目)으로 마주 살핌 → 서로.\n当|마땅할 당|尚 + 田(밭) → 當의 약자|형성|밭(田)이 서로 맞먹음 → 해당, 마땅함.\n帰|돌아갈 귀|𠂤 + 帚(빗자루)|형성|빗자루(帚)를 든 여자가 집으로 돌아감.\n省|살필 성·덜 생|少(작다) + 目(눈)|회의|눈(目)을 가늘게(少) 뜨고 살핌. 帰省은 '부모를 살피러 감'.\n突|갑자기 돌|穴(구멍) + 犬(개)|회의|개(犬)가 구멍(穴)에서 갑자기 튀어나옴.\n然|그럴 연|月(고기) + 犬 + 灬(불)|회의|개고기를 불에 굽는 모양(燃의 원자) → '그러하다'로 차용.\n潰|무너질 궤|氵(물) + 貴|형성|둑이 물(氵)에 무너짐 → 찌부러뜨리다.\n粗|거칠 조|米(쌀) + 且|형성|찧지 않은 거친 쌀(米) → 조잡함.\n熱|더울 열|埶 + 灬(불)|형성|불(灬)의 뜨거운 기운.\n中|가운데 중|中|지사|깃대를 원의 한가운데 꽂은 모양.\n和|화할 화|禾(벼) + 口(입)|형성|곡식(禾)을 함께 먹으니(口) 화목함.\n愛|사랑 애|旡 + 心 + 夂|형성|마음(心)을 남겨 둔 채 뒤돌아보며 가는 모습 → 사랑.\n着|붙을 착|羊 + 目 (著에서 분화)|형성|著에서 갈라져 나온 글자 → 붙다, 입다, 도착.\n討|칠 토|言(말) + 寸(법도)|회의|말(言)과 법도(寸)로 따져 공격함 → 토론, 토벌.\n争|다툴 쟁|爫(손) + ⺕(손)|회의|위아래 두 손이 한 물건을 서로 잡아당김.\n豊|풍년 풍|豊|상형|제기(豆)에 곡식이 수북이 담긴 모양.\n富|부자 부|宀(집) + 畐(술단지)|형성|집(宀)에 술단지(畐)가 가득 → 넉넉함.\n略|간략할 략|田(밭) + 各|형성|밭(田)의 경계를 대강 정함 → 간략, 생략.\n拡|넓힐 확|扌(손) + 広(넓다)|형성|손(扌)으로 넓게(広) 펼침.\n充|채울 충|𠫓(아이) + 儿(사람)|회의|아이가 자라 어른(儿)으로 가득 참 → 채우다.\n救|구원할 구|求(구하다) + 攵(치다)|형성|손을 써서(攵) 구해냄. 求(きゅう)가 음.\n厚|두터울 후|厂(벼랑) + 㫗|형성|벼랑(厂)처럼 두툼하게 쌓인 모양.\n先|먼저 선|⺧(발) + 儿(사람)|회의|사람(儿)보다 발(止)이 앞서 나감 → 먼저.\n順|순할 순|川(내) + 頁(머리)|회의|물(川)이 흐르듯 머리(頁)를 숙여 따름 → 순서.\n仮|거짓 가|亻(사람) + 反|형성|사람(亻)이 잠시 빌린 것 → 임시, 가짜.\n予|미리 예|予|상형|베틀의 북이 앞으로 밀려 나가는 모양 → 미리.\n約|맺을 약|糸(실) + 勺|형성|실(糸)로 묶어 맺음 → 약속, 요약.\n防|막을 방|阝(언덕) + 方|형성|흙 언덕(阝)을 쌓아 물을 막음.\n飛|날 비|飛|상형|새가 날개를 펴고 나는 모양.\n散|흩을 산|𢻃 + 攵(치다)|회의|두드려(攵) 흩뜨림.\n敏|민첩할 민|每 + 攵(치다)|형성|부지런히 손을 움직임(攵) → 민첩, 민감.\n感|느낄 감|咸(모두) + 心(마음)|형성|마음(心) 전체(咸)가 움직임 → 느끼다.\n裏|속 리|衣(옷) + 里|형성|옷(衣)의 안쪽(里) → 뒤, 속.\n付|줄 부|亻(사람) + 寸(손)|회의|손(寸)으로 사람(亻)에게 건넴 → 붙이다.\n同|한가지 동|冂(덮개) + 口|회의|덮개(冂) 아래 입(口)이 하나로 모임 → 같다.\n題|제목 제|是 + 頁(머리)|형성|머리(頁) 부분 → 표제, 제목.\n用|쓸 용|用|상형|나무통(또는 울타리) 모양 → 쓰다.\n心|마음 심|心|상형|심장의 모양.\n注|부을 주|氵(물) + 主(한곳)|형성|물(氵)을 한곳(主)에 쏟아부음 → 주의 집중.\n休|쉴 휴|亻(사람) + 木(나무)|회의|사람(亻)이 나무(木) 그늘에서 쉼.\n憩|쉴 게|舌 + 息(숨)|회의|숨(息)을 돌리며 쉼.\n進|나아갈 진|辶(가다) + 隹(새)|회의|새(隹)는 뒤로 가지 않고 앞으로만 나아감(辶).\n早|이를 조|日(해) + 十|회의|해(日)가 막 떠오른 이른 아침.\n急|급할 급|刍(及: 따라잡다) + 心|형성|쫓기는(及) 마음(心) → 급함.\n区|구분할 구|匚(상자) + 乂|회의|상자(匚) 안을 칸칸이 나눔.\n切|끊을 절|七 + 刀(칼)|형성|칼(刀)로 자름. 七(しち→せつ)이 음.\n詳|자세할 상|言(말) + 羊|형성|말(言)을 자세하고 꼼꼼히 함.\n細|가늘 세|糸(실) + 田(囟의 변형)|형성|가는 실(糸) → 가늘다, 자세하다.\n分|나눌 분|八(나누다) + 刀(칼)|회의|칼(刀)로 둘로 가름(八).\n析|쪼갤 석|木(나무) + 斤(도끼)|회의|도끼(斤)로 나무(木)를 쪼갬 → 분석.\n絡|이을 락|糸(실) + 各|형성|실(糸)로 얽어 이음 → 얽히다, 연락.\n農|농사 농|曲(밭) + 辰(조개 농기구)|회의|조개껍데기 농기구(辰)로 밭을 가는 모양.\n望|바랄 망|亡 + 月(달) + 𡈼(발돋움한 사람)|형성|발돋움하여 달(月)을 바라봄 → 바라다.\n短|짧을 단|矢(화살) + 豆|회의|화살(矢)로 재어 보니 짧음.\n柔|부드러울 유|矛(창) + 木(나무)|회의|창(矛) 자루로 쓰는 잘 휘는 나무(木).\n疲|피곤할 피|疒(병) + 皮|형성|병(疒)든 것처럼 지침.\n労|일할 로|ツ(불꽃) + 冖(덮다) + 力(힘)|회의|불을 밝히고 밤새 힘(力)써 일함 → 수고.\n主|주인 주|主|상형|등잔 위의 불꽃 → 중심, 주인.\n原|근원 원|厂(벼랑) + 泉(샘)|회의|벼랑(厂) 아래 샘(泉) → 근원, 들판.\n料|헤아릴 료|米(쌀) + 斗(말)|회의|쌀(米)을 말(斗)로 됨 → 재료, 요금.\n書|글 서|聿(붓) + 曰(말하다)|형성|붓(聿)으로 말(曰)을 적음.\n離|떠날 리|离(그물) + 隹(새)|형성|새(隹)가 그물(离)에서 떠나감.\n決|결정할 결|氵(물) + 夬(터지다)|형성|물(氵)이 둑을 터뜨림(夬) → 결단, 결정.\n権|권세 권|木(나무) + 雚|형성|원래 나무 저울추 → 저울질하는 힘 → 권력.\n通|통할 통|辶(가다) + 甬(통)|형성|길(辶)이 뚫려 통함.\n報|알릴 보|幸(수갑) + 𠬝(꿇린 사람)|회의|죄인을 잡아 윗사람에게 알림 → 보고, 보답.\n道|길 도|辶(가다) + 首(머리)|회의|머리(首)를 앞세워 걸어가는(辶) 길.\n多|많을 다|夕 + 夕|회의|고기 조각(夕)이 겹겹이 쌓임 → 많다.\n込|담을 입|辶(가다) + 入(들다)|회의|안으로(入) 들어감(辶). 일본에서 만든 한자(国字).\n体|몸 체|亻(사람) + 本(근본)|회의|사람(亻)의 근본(本) → 몸.\n行|다닐 행|行|상형|네거리 모양 → 가다, 행하다.\n儀|거동 의|亻(사람) + 義(올바름)|형성|사람(亻)의 올바른(義) 몸가짐 → 예의.\n偉|클 위|亻(사람) + 韋|형성|남보다 뛰어난 사람(亻) → 훌륭하다.\n納|들일 납|糸(실) + 内(안)|형성|실(糸)을 안(内)으로 거둬들임 → 수납, 납부.\n平|평평할 평|平|상형|물 위에 평평하게 뜬 수초의 모양.\n文|글월 문|文|상형|사람 가슴에 새긴 무늬(문신) → 무늬, 글.\n句|글귀 구|勹(싸다) + 口(말)|회의|말(口)을 묶은(勹) 단락 → 구절.\n共|한가지 공|廿 + 廾(두 손)|회의|두 손(廾)으로 함께 받쳐 듦.\n有|있을 유|𠂇(손) + 月(고기)|회의|손(又)에 고기(月)를 쥐고 있음.\n鋭|날카로울 예|金(쇠) + 兌|형성|쇠(金) 끝이 뾰족하고 날카로움.\n賞|상줄 상|尚 + 貝(재물)|형성|재물(貝)을 내려 칭찬함 → 상, 감상하다.\n解|풀 해|角(뿔) + 刀(칼) + 牛(소)|회의|칼(刀)로 소(牛)의 뿔(角)을 발라냄 → 풀다.\n節|마디 절|竹(대나무) + 即|형성|대나무(竹)의 마디 → 절약, 계절.\n割|벨 할|害 + 刂(칼)|형성|칼(刂)로 나눔 → 분할.\n詰|물을 힐|言(말) + 吉|형성|말(言)로 따져 물음. 일본어에서는 '가득 채우다'.\n穏|편안할 온|禾(벼) + 㥯|형성|곡식(禾)이 넉넉해 마음이 편안함.\n爽|시원할 상|大(사람) + 爻 ×2(창살)|회의|사람(大) 양옆 창살(爻)로 바람이 통함 → 상쾌.\n希|바랄 희|爻 + 巾(천)|회의|성기게 짠 천(巾) → 드물다 → 바라다.\n去|갈 거|土(大: 사람) + 厶|회의|사람이 떠나가는 모양.\n失|잃을 실|手(손) + 乙|형성|손(手)에서 빠져나감 → 잃다.\n許|허락할 허|言(말) + 午|형성|말(言)로 허락함. 午(ご→きょ)가 음.\n由|말미암을 유|由|상형|술 거르는 통 모양 → 말미암다, 까닭.\n直|곧을 직|十 + 目(눈) + 乚|회의|열(十) 개의 눈(目)으로 봐도 곧음.\n普|넓을 보|並(나란히) + 日(해)|형성|해(日)가 나란히(並) 두루 비춤 → 널리.\n及|미칠 급|人(사람) + 又(손)|회의|앞사람(人)을 손(又)으로 붙잡음 → 미치다.\n伝|전할 전|亻(사람) + 云(말하다)|형성|사람(亻)이 말(云)을 전함.\n言|말씀 언|言|상형|입(口)에서 말이 나오는 모양.\n結|맺을 결|糸(실) + 吉|형성|실(糸)을 단단히 맺음.\n触|닿을 촉|角(뿔) + 虫(벌레)|형성|뿔(角)로 더듬어 닿음.\n合|합할 합|亼(뚜껑) + 口(그릇)|회의|뚜껑(亼)이 그릇(口)에 딱 맞음.\n騒|떠들 소|馬(말) + 蚤(벼룩)|형성|말(馬)이 벼룩(蚤)에 물려 날뜀 → 시끄럽다.\n預|맡길 예|予(미리) + 頁|형성|미리(予) 맡겨 둠.\n談|말씀 담|言(말) + 炎(모닥불)|형성|모닥불(炎) 가에 앉아 나누는 이야기(言).\n運|옮길 운|辶(가다) + 軍(군대)|형성|군대(軍)가 이동함(辶) → 옮기다, 운.\n賃|품삯 임|任(맡기다) + 貝(돈)|형성|일을 맡긴(任) 대가로 주는 돈(貝).\n乱|어지러울 란|舌 + 乚|회의|엉킨 실을 손으로 푸는 모양 → 어지럽다.\n模|본뜰 모|木(나무) + 莫|형성|나무(木)로 만든 틀 → 본뜨다, 모범.\n範|법 범|竹(대나무) + 車 + 㔾|형성|대나무(竹)로 만든 틀 → 본보기.\n険|험할 험|阝(언덕) + 㑒|형성|언덕(阝)이 가파름 → 험하다.\n握|쥘 악|扌(손) + 屋|형성|손(扌)으로 꽉 쥠.\n手|손 수|手|상형|다섯 손가락을 편 손.\n腕|팔 완|月(몸) + 宛(굽다)|형성|몸(月)에서 굽는(宛) 부분 → 팔, 솜씨.\n善|착할 선|羊(양) + 言(말)|회의|양(羊)처럼 온순하고 좋은 말 → 착함.\n幼|어릴 유|幺(작다) + 力(힘)|회의|힘(力)이 아직 작음(幺) → 어리다.\n削|깎을 삭|肖(작아지다) + 刂(칼)|형성|칼(刂)로 조금씩(肖) 깎음.\n除|덜 제|阝(언덕) + 余|형성|계단(阝)의 흙을 걷어냄 → 제거.\n等|무리 등|竹(대나무) + 寺(관청)|회의|관청(寺)에서 죽간(竹)을 가지런히 맞춤 → 같다, 등급.\n福|복 복|礻(신) + 畐(술단지)|형성|신(礻)에게 술단지(畐)를 바치고 받는 복.\n祉|복 지|礻(신) + 止(머물다)|형성|신(礻)이 머무는(止) 곳에 내리는 복.\n機|틀 기|木(나무) + 幾|형성|나무(木)로 짠 베틀 → 기계, 기회.\n嫌|싫어할 혐|女(여자) + 兼|형성|여자(女)가 싫어함. 機嫌은 '기분'.\n損|덜 손|扌(손) + 員|형성|손(扌)으로 덜어냄 → 손해.\n管|대롱 관|竹(대나무) + 官|형성|대나무(竹) 관 → 관리하다.\n理|다스릴 리|王(玉: 옥) + 里|형성|옥(玉)을 결대로 다듬음 → 이치, 다스림.\n研|갈 연|石(돌) + 开|형성|돌(石)에 갊 → 연구.\n修|닦을 수|攸 + 彡(꾸밈)|형성|닦고 꾸밈(彡) → 수양, 연수.\n絶|끊을 절|糸(실) + 色(刀+巴)|회의|칼(刀)로 실(糸)을 끊음.\n投|던질 투|扌(손) + 殳(창)|회의|손(扌)으로 창(殳)을 던짐.\n票|표 표|西(襾) + 示|회의|불똥이 튀어 오르는 모양 → 쪽지, 표.\n抱|안을 포|扌(손) + 包(싸다)|형성|손(扌)으로 감싸 안음(包).\n無|없을 무|無|상형|춤추는 사람의 모양 → '없다'로 차용.\n回|돌 회|回|상형|소용돌이 모양 → 돌다, 횟수.\n答|대답 답|竹(대나무) + 合(맞다)|형성|죽간(竹)에 맞게(合) 답을 씀.\n日|날 일|日|상형|해의 모양.\n本|근본 본|木 + 一|지사|나무(木) 뿌리 부분에 표시 → 근본, 책.\n風|바람 풍|凡 + 虫(벌레)|형성|바람이 불면 벌레(虫)가 깨어남 → 바람, 풍습.\n際|즈음 제|阝(언덕) + 祭|형성|언덕(阝)이 맞닿는 경계 → 가장자리, 즈음.\n対|대할 대|文(丵) + 寸(손)|회의|손(寸)에 든 것을 마주 대함.\n抗|겨룰 항|扌(손) + 亢(목)|형성|손(扌)으로 막아 버팀 → 저항.\n諸|모두 제|言(말) + 者|형성|여러 사람의 말(言) → 모든, 여러.\n続|이을 속|糸(실) + 売|형성|실(糸)을 계속 이음.\n二|두 이|二|지사|선 두 개.\n連|잇닿을 련|辶(가다) + 車(수레)|회의|수레(車)가 줄지어 감(辶) → 잇다, 동반.\n誤|그르칠 오|言(말) + 呉|형성|말(言)을 잘못함 → 오류.\n好|좋을 호|女(여자) + 子(아이)|회의|어머니(女)가 아이(子)를 안고 좋아함.\n頼|의뢰할 뢰|束(묶다) + 頁|형성|단단히 묶어(束) 의지함 → 믿다, 부탁하다.\n求|구할 구|求|상형|털가죽 옷의 모양 → '구하다'로 차용.\n話|말씀 화|言(말) + 舌(혀)|회의|혀(舌)로 하는 말(言) → 이야기.\n後|뒤 후|彳(가다) + 幺(실) + 夂(발)|회의|발이 실에 묶여 뒤처져 걸음.\n悔|뉘우칠 회|忄(마음) + 每|형성|마음(忄)으로 뉘우침.\n盛|성할 성|成 + 皿(그릇)|형성|그릇(皿)에 수북이 담음 → 번성.\n上|위 상|上|지사|기준선 위에 점을 찍어 '위'를 표시.\n惜|아낄 석|忄(마음) + 昔(옛날)|형성|지난(昔) 것을 마음(忄)으로 아까워함.\n速|빠를 속|辶(가다) + 束|형성|빨리 감(辶). 束(そく)이 음.\n油|기름 유|氵(물) + 由|형성|액체(氵) 기름.\n自|스스로 자|自|상형|코 모양 → 자기 자신을 가리킴.\n仕|섬길 사|亻(사람) + 士(선비)|형성|선비(士)가 벼슬하여 섬김 → 일하다.\n深|깊을 심|氵(물) + 罙|형성|물(氵)이 깊음.\n刻|새길 각|亥 + 刂(칼)|형성|칼(刂)로 새김 → 시각, 심각.\n重|무거울 중|重|상형|사람이 무거운 짐을 진 모양.\n期|기약할 기|其 + 月(달)|형성|달(月)이 차고 이지러지는 주기 → 기간.\n印|도장 인|爪(손) + 卩(꿇은 사람)|회의|손(爪)으로 사람(卩)을 눌러 찍음 → 도장, 표시.\n出|날 출|出|상형|발(止)이 움집 밖으로 나가는 모양.\n廃|폐할 폐|广(집) + 発|형성|집(广)이 허물어짐 → 폐지.\n止|그칠 지|止|상형|발 모양 → 멈추다.\n達|통달할 달|辶(가다) + 羍|형성|길(辶)을 끝까지 감 → 도달, 숙달.\n暮|저물 모|莫 + 日(해)|형성|풀숲(莫) 사이로 해(日)가 짐 → 저물다.\n残|남을 잔|歹(뼈) + 戋|형성|뼈(歹)만 남음 → 남다.\n高|높을 고|高|상형|높은 누각의 모양.\n保|지킬 보|亻(사람) + 呆(업힌 아이)|회의|사람(亻)이 아이를 업어 지킴.\n記|기록할 기|言(말) + 己|형성|말(言)을 적어 둠.\n憶|생각할 억|忄(마음) + 意(뜻)|형성|마음(忄)에 뜻(意)을 새겨 둠 → 기억.\n途|길 도|辶(가다) + 余|형성|가는(辶) 길 → 도중.\n端|끝 단|立(서다) + 耑(싹)|형성|바르게 선 끝 → 끝, 단서.\n務|힘쓸 무|敄 + 力(힘)|형성|힘(力)써 일함 → 임무.\n素|본디 소|𠂹 + 糸(실)|회의|늘어뜨린 흰 명주실(糸) → 바탕, 소재.\n材|재목 재|木(나무) + 才|형성|쓸모 있는 나무(木) → 재료.\n警|깨우칠 경|敬(삼가다) + 言(말)|형성|말(言)로 삼가게(敬) 함 → 경고, 경비.\n刺|찌를 자|朿(가시) + 刂(칼)|형성|가시(朿)나 칼(刂)로 찌름.\n激|격할 격|氵(물) + 敫|형성|물(氵)이 부딪쳐 세차게 튐 → 격렬.\n外|바깥 외|夕(저녁) + 卜(점)|회의|저녁(夕)에 치는 점(卜)은 예외 → 바깥.\n世|인간 세|世|지사|十을 세 개 이어 30년 → 한 세대, 세상.\n間|사이 간|門(문) + 日(해)|회의|문(門) 틈으로 햇빛(日)이 들어옴 → 사이.\n勇|날랠 용|甬 + 力(힘)|형성|힘(力)이 솟구침 → 용감.\n昇|오를 승|日(해) + 升(오르다)|형성|해(日)가 떠오름(升).\n垂|드리울 수|垂|상형|초목의 가지가 아래로 늘어진 모양.\n住|살 주|亻(사람) + 主(머물다)|형성|사람(亻)이 한곳에 머물러(主) 삶.\n典|법 전|冊(책) + 丌(받침대)|회의|중요한 책(冊)을 받침대(丌)에 올림 → 규범.\n型|모형 형|刑 + 土(흙)|형성|흙(土)으로 만든 거푸집 → 틀, 유형.\n欲|하고자할 욕|谷(골짜기) + 欠(입 벌림)|형성|빈 골짜기(谷)처럼 입 벌리고(欠) 채우려 함 → 욕심.\n優|넉넉할 우|亻(사람) + 憂|형성|연기하는 사람 → 배우; 넉넉하다, 뛰어나다.\n診|진찰할 진|言(말) + 㐱|형성|말(言)로 묻고 살핌 → 진찰.\n異|다를 이|異|상형|가면을 쓴 사람의 모양 → 다르다.\n野|들 야|里(마을) + 予|형성|마을(里) 밖 들판 → 분야.\n低|낮을 저|亻(사람) + 氐(밑)|형성|사람(亻)이 몸을 낮춤.\n格|격식 격|木(나무) + 各|형성|나무(木) 격자 → 기준, 격식.\n顔|낯 안|彦 + 頁(머리)|형성|머리(頁)의 앞면 → 얼굴.\n写|베낄 사|冖 + 与|형성|옮겨 베낌 → 사진.\n真|참 진|匕 + 県|회의|숟가락(匕)으로 솥의 음식을 떠서 맛봄 → 참됨 (설이 여러 가지).\n現|나타날 현|王(玉: 옥) + 見(보다)|형성|옥(玉)의 빛이 드러나 보임(見).\n度|법도 도|广 + 廿 + 又(손)|형성|손(又)으로 길이를 잼 → 정도, 제도.\n貴|귀할 귀|臾 + 貝(재물)|형성|재물(貝)이 귀함 → 상대를 높이는 말(귀사).\n団|둥글 단|囗(에워쌈) + 寸|형성|둥글게 모임 → 단체.\n交|사귈 교|交|상형|사람이 다리를 꼬고 선 모양 → 엇갈리다, 사귀다.\n渉|건널 섭|氵(물) + 歩(걷다)|회의|물(氵)을 걸어서(歩) 건넘 → 교섭.\n劣|못할 렬|少(적다) + 力(힘)|회의|힘(力)이 적음(少) → 뒤떨어지다.\n劇|심할 극|豦 + 刂(칼)|형성|칼(刂)을 든 격렬한 싸움 → 심하다, 연극.\n接|이을 접|扌(손) + 妾|형성|손(扌)으로 맞닿게 함 → 접속.\n締|맺을 체|糸(실) + 帝|형성|실(糸)로 단단히 맺음 → 마감하다(締め切る).\n違|어긋날 위|辶(가다) + 韋(엇갈림)|형성|서로 엇갈려(韋) 감(辶) → 다르다, 위반.\n苦|쓸 고|艹(풀) + 古|형성|쓴 풀(艹) → 괴롭다.\n情|뜻 정|忄(마음) + 青|형성|마음(忄)의 순수한(青) 움직임 → 감정, 사정.\n衝|찌를 충|行(길) + 重(무겁다)|형성|길(行)에서 무겁게(重) 부딪침 → 충돌.\n再|두 재|再|상형|같은 것을 두 번 겹친 모양.\n三|석 삼|三|지사|선 세 개.\n勘|헤아릴 감|甚 + 力(힘)|형성|힘써 깊이(甚) 헤아림 → 계산.\n会|모일 회|会|상형|뚜껑 덮인 그릇 → 모이다.\n計|셀 계|言(말) + 十(열)|회의|말(言)로 열(十)까지 셈 → 계산.\n術|재주 술|行(길) + 朮|형성|길(行) → 방법, 기술.\n籍|문서 적|竹(대나무) + 耤|형성|대나무(竹) 죽간에 쓴 문서 → 서적, 호적.\n転|구를 전|車(수레) + 云|형성|수레(車)바퀴가 구름 → 바뀌다.\n変|변할 변|亦 + 夂|형성|모습이 바뀜.\n値|값 치|亻(사람) + 直|형성|사람(亻)이 매기는 값어치.\n温|따뜻할 온|氵(물) + 昷|형성|따뜻한 물(氵) → 온화.\n濁|흐릴 탁|氵(물) + 蜀|형성|물(氵)이 흐림.\n代|대신할 대|亻(사람) + 弋|형성|사람(亻)이 번갈아 대신함 → 세대, 대금.\n頑|완고할 완|元(둥근 머리) + 頁(머리)|형성|둥글고 단단한 머리(頁) → 고집이 셈.\n固|굳을 고|囗(에워쌈) + 古|형성|사방이 막혀(囗) 오래(古) 굳음.\n荒|거칠 황|艹(풀) + 㠩|형성|풀(艹)이 제멋대로 자란 황무지 → 거칠다.\n著|나타날 저|艹 + 者|형성|뚜렷이 드러남 → 현저, 저자.\n声|소리 성|声|상형|매단 경쇠를 쳐서 나는 소리.\n援|도울 원|扌(손) + 爰(끌어당기다)|형성|손(扌)을 뻗어 끌어당겨 도움.\n破|깨뜨릴 파|石(돌) + 皮|형성|돌(石)이 깨짐.\n片|조각 편|片|상형|나무를 세로로 쪼갠 오른쪽 조각.\n暴|사나울 폭|日(해) + 共(두 손) + 氺(米)|회의|햇볕(日)에 곡식(米)을 두 손으로 내어 말림 → 드러내다, 난폭.\n返|돌이킬 반|辶(가다) + 反(되돌리다)|형성|되돌아감(辶) → 돌려주다.\n品|물건 품|口 ×3|회의|여러 개의 물건(口) → 물품.\n弱|약할 약|弓 ×2(활)|회의|휘어진 활(弓) 두 개 → 약하다.\n状|형상 상|爿 + 犬(개)|형성|개(犬)의 모양 → 형상, 상태.\n別|다를 별|另(뼈) + 刂(칼)|회의|칼(刂)로 뼈와 살을 발라 나눔 → 따로.\n場|마당 장|土(흙) + 昜(볕)|형성|햇볕(昜) 드는 땅(土) → 장소.\n社|모일 사|礻(신) + 土(땅)|회의|토지신(土)을 모신 곳 → 모임, 회사.\n長|길 장|長|상형|긴 머리털의 노인 → 길다, 우두머리.\n軽|가벼울 경|車(수레) + 圣|형성|가볍고 빠른 수레(車).\n添|더할 첨|氵 + 忝|형성|곁에 덧붙임 → 첨부.\n柄|자루 병|木(나무) + 丙|형성|나무(木) 손잡이 → 자루; 일본어로 '인품, 무늬'(가라).\n性|성품 성|忄(마음) + 生(나다)|형성|타고난(生) 마음(忄) → 성격.\n案|책상 안|安 + 木(나무)|형성|나무(木) 책상 → 책상에서 짜는 생각, 안건.\n包|쌀 포|勹(감싸다) + 巳(태아)|상형|태아(巳)를 감싼(勹) 모양.\n引|끌 인|弓(활) + 丨|회의|활(弓) 시위를 당김.\n開|열 개|門(문) + 开(두 손)|회의|두 손(开)으로 문(門) 빗장을 엶.\n妥|온당할 타|爫(손) + 女(여자)|회의|손(爫)으로 여자(女)를 다독여 편안하게 함 → 타당.\n景|볕 경|日(해) + 京|형성|햇빛(日) → 경치.\n乏|모자랄 핍|乏|지사|正을 뒤집은 모양 → 모자라다.\n介|끼일 개|人(사람) + 八|회의|사람(人)이 사이(八)에 끼어 있음 → 중개, 개호.\n護|도울 호|言(말) + 蒦|형성|말(言)로 감싸 지킴 → 보호.\n焦|탈 초|隹(새) + 灬(불)|회의|새(隹)를 불(灬)에 그을림 → 타다, 애태우다.\n賛|도울 찬|兟(나아가다) + 貝(재물)|형성|재물(貝)을 들고 나아가 도움 → 찬성.\n否|아닐 부|不(아니다) + 口(입)|회의|입(口)으로 아니(不)라고 함.\n任|맡길 임|亻(사람) + 壬(짐)|형성|사람(亻)이 짐(壬)을 짊어짐 → 맡기다.\n勧|권할 권|雚 + 力(힘)|형성|힘(力)써 권함.\n誘|꾈 유|言(말) + 秀|형성|말(言)로 꾀어냄 → 권유.\n積|쌓을 적|禾(벼) + 責|형성|곡식(禾)을 쌓아 올림.\n永|길 영|永|상형|물줄기가 길게 갈라져 흐르는 모양 → 영원.\n久|오랠 구|久|지사|사람 뒤에서 잡아당겨 오래 머물게 함.\n見|볼 견|目(눈) + 儿(사람)|회의|사람(儿) 위에 큰 눈(目) → 보다.\n頃|잠깐 경|匕 + 頁(머리)|회의|머리(頁)를 기울임 → 무렵, 때(頃).\n登|오를 등|癶(두 발) + 豆(제기)|회의|두 발(癶)로 제기(豆)를 들고 오름.\n録|기록할 록|金(쇠) + 彔|형성|쇠(金)에 새겨 기록함.\n容|얼굴 용|宀(집) + 谷(골짜기)|회의|집(宀)과 골짜기(谷)처럼 담는 것 → 담다, 모습.\n姿|모양 자|次 + 女(여자)|형성|여자(女)의 맵시 → 자태.\n最|가장 최|冃(모자) + 取(취하다)|회의|무릅쓰고(冃) 취함(取) → 가장.\n寄|부칠 기|宀(집) + 奇|형성|남의 집(宀)에 몸을 맡김 → 다가가다.\n借|빌릴 차|亻(사람) + 昔|형성|남(亻)에게서 빌림.\n指|가리킬 지|扌(손) + 旨|형성|손(扌)가락으로 가리킴.\n図|그림 도|囗(테두리) + 㕣|회의|테두리(囗) 안에 그린 지도.\n命|목숨 명|口(입) + 令(명령)|회의|입(口)으로 명령(令)함 → 명령, 목숨.\n令|하여금 령|亼(모이다) + 卩(꿇은 사람)|회의|꿇어앉은 사람(卩)에게 명령을 내림.\n欠|하품 흠|欠|상형|사람이 입을 크게 벌리고 하품하는 모양 → 모자라다.\n依|의지할 의|亻(사람) + 衣(옷)|형성|사람(亻)이 옷(衣)에 기댐 → 의지하다.\n栽|심을 재|木(나무) + 𢦏|형성|나무(木)를 심음.\n培|북돋울 배|土(흙) + 咅|형성|흙(土)을 북돋움 → 재배.\n製|지을 제|制(마름질하다) + 衣(옷)|형성|옷감(衣)을 마름질(制)해 옷을 지음 → 만들다, 제품.\n作|지을 작|亻(사람) + 乍|형성|사람(亻)이 무언가를 만듦. 乍(さ)가 음.\n流|흐를 류|氵(물) + 㐬(물에 떠내려가는 아이)|회의|아이가 물(氵)에 떠내려가는 모양 → 흐르다, 유행.\n部|떼 부|咅 + 阝(고을)|형성|고을(阝)을 나눈 구역 → 부분, 부서.\n全|온전할 전|入 + 王(玉)|회의|흠 없는 옥(玉)을 거두어들임(入) → 온전함, 전부.\n想|생각 상|相(살피다) + 心(마음)|형성|마음(心)으로 대상을 그려 봄(相) → 생각하다, 예상.\n戻|어그러질 려|戸(문) + 大(犬의 변형)|회의|개(犬)가 문(戸) 아래로 빠져나가는 모양 → 거스르다; 일본어로 '되돌아가다'.\n発|필 발|癶(두 발) + 弓 + 殳 → 發의 약자|형성|활(弓)을 쏘아 내보냄 → 출발, 발생.\n内|안 내|冂(집) + 入(들다)|회의|집(冂) 안으로 들어감(入) → 안, 내용.\n成|이룰 성|戊(도끼) + 丁|형성|도끼(戊)로 다듬어 완성함 → 이루다.\n完|완전할 완|宀(집) + 元(으뜸)|형성|집(宀)이 빠짐없이 갖춰짐 → 완전, 완성.\n下|아래 하|下|지사|기준선 아래에 점을 찍어 '아래'를 표시.\n何|어찌 하|亻(사람) + 可|형성|원래 사람이 짐을 멘 모양(荷) → '무엇'으로 차용.\n始|비로소 시|女(여자) + 台|형성|여자(女)의 태(胎)에서 생명이 시작됨 → 시작하다.\n番|차례 번|釆(짐승 발자국) + 田(밭)|상형|밭(田)에 찍힌 발자국이 차례로 이어짐 → 차례, 번호.\n近|가까울 근|辶(가다) + 斤|형성|조금만 가면(辶) 닿는 거리 → 가깝다.\n困|곤할 곤|囗(울타리) + 木(나무)|회의|나무(木)가 울타리(囗)에 갇혀 자라지 못함 → 곤란하다.\n隔|사이 뜰 격|阝(언덕) + 鬲(솥)|형성|언덕(阝)이 가로막아 사이를 띄움 → 사이, 간격. 鬲(かく)이 음.\n願|원할 원|原 + 頁(머리)|형성|머리(頁)를 숙여 바람 → 원하다, 소원. 原(げん→がん)이 음.\n害|해할 해|宀(집) + 丯 + 口(입)|형성|집(宀) 안에서 말(口)로 남을 헐뜯어 해침 → 해치다, 손해.\n企|꾀할 기|人(사람) + 止(발)|회의|사람(人)이 발돋움(止)해 멀리 바라봄 → 계획하다, 꾀하다.\n画|그림 화/그을 획|聿(붓) + 田 + 凵의 변형|회의|붓으로 밭(田)의 경계를 그음 → 긋다, 그림, 계획(企画).\n却|물리칠 각|去(가다) + 卩(무릎 꿇은 사람)|형성|무릎 꿇은 사람(卩)이 물러감(去) → 물리치다, 되돌리다(返却).\n継|이을 계|糸(실) + 㡭(끊어진 실)|형성|끊어진 실(㡭)을 실(糸)로 이음 → 잇다, 계속.\n検|검사할 검|木(나무) + 僉(모두)|형성|나무(木) 표찰을 모두(僉) 대조해 살핌 → 검사하다.\n証|증거 증|言(말) + 正(바르다)|형성|말(言)로 바른(正) 것을 밝힘 → 증명, 증거.\n減|덜 감|氵(물) + 咸|형성|물(氵)이 줄어듦 → 덜다, 감소. 咸(かん→げん)이 음.\n少|적을 소|小(작다) + 丿|지사|작은(小) 것에서 또 한 획을 떼어 냄 → 적다, 조금.\n倉|곳집 창|食의 변형 + 口(문)|상형|곡식을 넣어 두는 창고의 모양 → 곳간, 창고.\n庫|곳간 고|广(집) + 車(수레)|회의|수레(車)를 넣어 두는 건물(广) → 창고.\n冷|찰 랭|冫(얼음) + 令|형성|얼음(冫)처럼 차가움 → 차다, 식다. 令(れい)이 음.\n蔵|감출 장|艹(풀) + 臧|형성|풀(艹)로 덮어 감춤 → 감추다, 저장하다, 창고.\n互|서로 호|二 + 彑(실 감는 도구)|상형|실을 엇갈려 감는 도구의 모양 → 서로 엇갈림, 상호.\n混|섞을 혼|氵(물) + 昆(여럿)|형성|물(氵)과 여러 것(昆)이 뒤섞임 → 섞다, 혼잡.\n象|코끼리 상|象|상형|코끼리의 모양 → 코끼리; 모양을 본뜬다는 뜻에서 '형상, 현상'.\n勢|기세 세|埶(심다) + 力(힘)|형성|힘(力)차게 자라나는(埶) 기운 → 기세, 세력.\n瞬|눈 깜짝일 순|目(눈) + 舜|형성|눈(目)을 깜박이는 짧은 동안 → 순간.\n障|막을 장|阝(언덕) + 章|형성|언덕(阝)이 가로막음 → 막다, 장애.\n抽|뽑을 추|扌(손) + 由|형성|손(扌)으로 잡아 뽑아냄 → 뽑다, 추상(抽象).\n寿|목숨 수|壽의 약자 (老의 변형 + 𠷎)|형성|노인(老)이 오래 사는 것 → 목숨, 장수.\n香|향기 향|禾(벼) + 日(甘의 변형)|회의|곡식(禾)을 익힐 때 나는 달콤한(甘) 냄새 → 향기.\n水|물 수|水|상형|흐르는 물줄기의 모양.\n洪|넓을 홍|氵(물) + 共(함께)|형성|물(氵)이 한꺼번에(共) 넘쳐 흐름 → 큰물, 홍수.\n選|가릴 선|辶(가다) + 巽(가지런히 놓다)|형성|여럿을 가지런히 놓고(巽) 골라 보냄(辶) → 고르다, 선거.\n推|밀 추|扌(손) + 隹(새)|형성|손(扌)으로 밀어 냄 → 밀다, 추측하다, 추천.\n薦|천거할 천|艹(풀) + 廌(해태)|회의|해태(廌)가 먹는 좋은 풀(艹)을 바침 → 바치다, 추천하다.\n精|정할 정|米(쌀) + 青(맑다)|형성|쌀(米)을 찧어 맑고(青) 깨끗하게 함 → 정밀함, 정신, 정산.\n算|셈 산|竹(대나무) + 具(갖추다)|회의|대나무(竹) 산가지를 갖추어(具) 셈함 → 계산.\n空|빌 공|穴(구멍) + 工|형성|속이 뚫린 구멍(穴) → 비다, 하늘.\n幻|헛보일 환|予를 뒤집은 모양|지사|베틀 북(予)을 거꾸로 하여 속인다는 뜻 → 헛것, 환상.\n像|모양 상|亻(사람) + 象(형상)|형성|사람(亻)의 모습을 본뜬 형상(象) → 모양, 영상.\n臓|오장 장|月(몸) + 蔵(감추다)|형성|몸(月) 안에 감추어진(蔵) 기관 → 내장, 장기.\n器|그릇 기|口 ×4 + 犬(개)|회의|개(犬)가 여러 그릇(口)을 지키는 모습 → 그릇, 기관.\n極|다할 극|木(나무) + 亟(끝까지)|형성|집의 가장 높은 곳에 놓는 나무(木), 용마루 → 끝, 다하다, 극단.\n個|낱 개|亻(사람) + 固|형성|사람(亻) 하나하나 → 낱개, 개인. 固(こ)가 음.\n辞|말씀 사|舌(혀) + 辛(죄)|회의|혀(舌)로 죄(辛)를 따져 말함 → 말, 사퇴하다(辞める).\n退|물러날 퇴|辶(가다) + 艮(뒤돌아봄)|회의|뒤돌아보며(艮) 물러감(辶) → 물러나다.\n広|넓을 광|广(집) + 厶(黄의 변형)|형성|벽 없이 탁 트인 큰 집(广) → 넓다.\n脱|벗을 탈|月(몸) + 兌(빠지다)|형성|몸(月)에서 허물이 빠져나감(兌) → 벗다, 탈락.\n落|떨어질 락|艹(풀) + 洛|형성|풀(艹)잎이 떨어짐 → 떨어지다. 洛(らく)이 음.\n鈍|둔할 둔|金(쇠) + 屯|형성|쇠(金) 날이 무딤 → 둔하다.\n土|흙 토|土|상형|땅 위에 흙을 쌓아 놓은 모양.\n裁|마를 재|衣(옷) + 𢦏(자르다)|형성|옷감(衣)을 자름 → 마름질하다, 재판(가려서 판단함).\n批|비평할 비|扌(손) + 比(견주다)|형성|손(扌)으로 쳐서 견주어(比) 따짐 → 비평, 비판.\n比|견줄 비|匕 ×2|회의|두 사람(匕匕)이 나란히 선 모양 → 견주다, 비교.\n例|법식 례|亻(사람) + 列(줄)|형성|사람(亻)들이 늘어선 줄(列)처럼 같은 종류 → 예, 보기.\n奉|받들 봉|丰 + 廾(두 손) + 手|형성|두 손(廾)으로 받들어 올림 → 받들다, 봉사.\n貿|무역할 무|卯 + 貝(돈)|형성|돈(貝)으로 물건을 바꿈 → 무역.\n易|바꿀 역/쉬울 이|日 + 勿(도마뱀)|상형|색이 잘 바뀌는 도마뱀의 모양 → 바꾸다(역), 쉽다(이).\n災|재앙 재|巛(물) + 火(불)|회의|홍수(巛)와 불(火) → 재앙.\n搬|옮길 반|扌(손) + 般(옮기다)|형성|손(扌)으로 날라 옮김 → 운반.\n復|회복할 복/다시 부|彳(가다) + 复(돌아오다)|형성|갔던 길(彳)을 되돌아옴(复) → 회복, 반복.\n至|이를 지|至|지사|화살이 땅(一)에 꽂힌 모양 → 이르다, 지극히.\n拒|막을 거|扌(손) + 巨|형성|손(扌)으로 막아 물리침 → 거부.\n距|떨어질 거|足(발) + 巨(크다)|형성|발(足) 사이가 크게(巨) 벌어짐 → 거리.\n免|면할 면|免|상형|사람이 투구를 벗는 모양 → 벗어나다, 면하다, 면허.\n協|화합할 협|十(많다) + 劦(힘을 합하다)|회의|많은(十) 사람이 힘을 합함(劦) → 협력.\n力|힘 력|力|상형|팔에 힘줄이 불거진 모양(또는 쟁기) → 힘.\n故|연고 고|攵(치다) + 古(옛)|형성|옛(古) 일이 원인이 됨 → 까닭, 사고, 고장.\n誇|자랑할 과|言(말) + 夸(크다)|형성|말(言)을 크게(夸) 부풀림 → 자랑하다, 과장.\n張|베풀 장|弓(활) + 長(길다)|형성|활(弓)시위를 길게(長) 당김 → 펼치다, 주장.\n拠|근거 거|扌(손) + 処(곳)|형성|손(扌)으로 짚고 의지하는 곳(処) → 근거, 증거.\n項|항목 항|工 + 頁(머리)|형성|머리(頁) 뒤쪽 목덜미 → 조목, 항목.\n殊|다를 수|歹(죽음) + 朱|형성|목을 베어 죽임(歹)이 본뜻 → 특별히, 다르다.\n軟|연할 연|車(수레) + 欠|형성|수레(車) 바퀴를 부드러운 것으로 감쌈 → 부드럽다, 유연.\n処|곳 처|夂(발) + 几(걸상)|회의|걸상(几)에 발(夂)을 멈추고 머무름 → 곳, 처리하다.\n傷|다칠 상|亻(사람) + 昜의 변형|형성|사람(亻)이 다침 → 상처.\n症|증세 증|疒(병) + 正|형성|병(疒)이 겉으로 드러난 모습 → 증상.\n助|도울 조|且 + 力(힘)|형성|힘(力)을 보태 줌 → 돕다.\n徐|천천히 서|彳(가다) + 余|형성|천천히 걸어감(彳) → 천천히, 서행.\n秩|차례 질|禾(벼) + 失|형성|벼(禾)를 차례대로 쌓음 → 차례, 질서.\n序|차례 서|广(집) + 予|형성|집(广)의 동서쪽 담 → 차례, 순서.\n実|열매 실|宀(집) + 貫(꿴 돈)의 변형|회의|집(宀) 안에 재물이 가득함 → 열매, 실제.\n装|꾸밀 장|壮(씩씩하다) + 衣(옷)|형성|옷(衣)을 차려입음 → 꾸미다, 장치.\n置|둘 치|罒(그물) + 直(곧다)|형성|그물(罒)을 곧게(直) 쳐 둠 → 두다, 설치.\n夢|꿈 몽|艹 + 罒(눈) + 冖 + 夕(밤)|회의|밤(夕)에 눈(罒)이 가려져 흐릿하게 보이는 것 → 꿈.\n者|놈 자|耂 + 日|상형|솥에 장작을 모아 태우는 모양에서 가차 → 사람, ~하는 자.\n挑|돋울 도|扌(손) + 兆|형성|손(扌)으로 집적거려 싸움을 걺 → 도전.\n戦|싸움 전|単 + 戈(창)|형성|창(戈)을 들고 싸움 → 싸우다, 전쟁.\n戸|지게 호|戸|상형|외짝 문의 모양 → 문, 집.\n棚|시렁 붕|木(나무) + 朋(나란히)|형성|나무(木)를 나란히(朋) 걸쳐 만든 시렁 → 선반.\n逃|도망할 도|辶(가다) + 兆|형성|갈라져(兆) 달아남(辶) → 도망치다.\n亡|망할 망|亡|회의|사람(入)이 담(乚) 뒤로 숨는 모양 → 달아나다, 죽다, 망하다.\n病|병 병|疒(병) + 丙|형성|병상(疒)에 누운 상태 → 병.\n棟|마룻대 동|木(나무) + 東|형성|지붕 꼭대기에 가로 얹는 나무(木) → 용마루, 동(건물).\n負|질 부|⺈(사람) + 貝(돈)|회의|사람이 돈(貝)을 짊어짐 → 지다, 부담, 패하다.\n担|멜 담|扌(손) + 旦|형성|손(扌)으로 어깨에 멤 → 짊어지다, 담당.\n封|봉할 봉|圭(흙을 쌓음) + 寸(손)|회의|손(寸)으로 흙(圭)을 쌓아 경계를 지음 → 봉하다, 봉투.\n工|장인 공|工|상형|목수가 쓰는 곱자(자)의 모양 → 만들다, 장인.\n夫|지아비 부|夫|상형|비녀(一)를 꽂은 어른(大)의 모양 → 남편, 사내.\n様|모양 양|木(나무) + 羕|형성|상수리나무(木)가 본뜻 → 모양, 양식, ~님(様).\n耗|소모할 모|耒(쟁기) + 毛|형성|쟁기(耒)가 닳아 짐 → 줄다, 소모.\n快|쾌할 쾌|忄(마음) + 夬(터놓다)|형성|마음(忄)이 확 트임(夬) → 상쾌하다, 기분 좋다.\n癒|병 나을 유|疒(병) + 愈(낫다)|형성|병(疒)이 나음(愈) → 낫다, 치유.\n益|더할 익|水 + 皿(그릇)|회의|그릇(皿)에 물(水)이 넘침 → 더하다, 이익.\n名|이름 명|夕(저녁) + 口(입)|회의|어두운 저녁(夕)에 입(口)으로 자기를 알림 → 이름.\n惑|미혹할 혹|或(혹시) + 心(마음)|형성|마음(心)이 혹시(或) 하며 흔들림 → 헷갈리다, 미혹.\n歌|노래 가|哥(노래) + 欠(입 벌림)|형성|입을 벌려(欠) 노래함(哥) → 노래.\n謡|노래 요|言(말) + 䍃|형성|말(言)에 가락을 붙여 부름 → 노래, 가요.\n稚|어릴 치|禾(벼) + 隹|형성|어린 벼(禾) → 어리다, 유치.\n圧|누를 압|厂(언덕) + 土(흙)|형성|흙(土)으로 위에서 누름 → 누르다, 압력.\n勝|이길 승|朕 + 力(힘)|형성|힘(力)을 들여 견뎌 냄 → 이기다.\n倒|넘어질 도|亻(사람) + 到(이르다)|형성|사람(亻)이 땅에 닿음(到) → 넘어지다, 압도.\n活|살 활|氵(물) + 舌|형성|물(氵)이 콸콸 흐르는 소리 → 살다, 활발.\n学|배울 학| 어지는 마음(心) → 부끄러움.\n噂|소문 준|口(입) + 尊|형성|입(口)에서 입으로 전해지는 말 → 소문 (일본 뜻).\n煙|연기 연|火(불) + 垔(막다)|형성|불(火)이 탈 때 막혀(垔) 피어오르는 것 → 연기.\n粉|가루 분|米(쌀) + 分(나누다)|형성|쌀(米)을 잘게 나눈(分) 것 → 가루.\n汁|즙 즙|氵(물) + 十|형성|짜낸 물(氵) → 즙, 국물.\n束|묶을 속|木(나무) + 口(끈)|회의|나무(木)를 끈(口)으로 묶은 모양 → 묶다, 다발.\n火|불 화|火|상형|타오르는 불꽃의 모양.\n身|몸 신|身|상형|배가 불룩한 사람의 모양 → 몸.\n箸|젓가락 저|竹(대나무) + 者|형성|대나무(竹)로 만든 젓가락.\n蓋|덮을 개|艹(풀) + 盍(덮다)|형성|풀(艹)로 엮어 덮는(盍) 것 → 덮개, 뚜껑.\n湯|끓을 탕|氵(물) + 昜(볕)|형성|햇볕(昜)처럼 뜨거운 물(氵) → 끓는 물, 목욕탕.\n元|으뜸 원|二 + 儿(사람)|지사|사람(儿)의 머리(二) → 으뜸, 근원.\n家|집 가|宀(집) + 豕(돼지)|회의|지붕(宀) 아래 돼지(豕)를 기르는 곳 → 집.\n鍵|열쇠 건|金(쇠) + 建|형성|쇠(金)로 만든 열쇠.\n針|바늘 침|金(쇠) + 十|형성|쇠(金)로 만든 바늘.\n扱|거둘 급|扌(손) + 及(미치다)|형성|손(扌)이 닿게(及) 함 → 다루다(扱う).\n祝|빌 축|礻(제단) + 兄|회의|제단(礻) 앞에서 맏이(兄)가 축문을 읽음 → 빌다, 축하.\n敬|공경 경|苟(삼가다) + 攵|형성|삼가며(苟) 스스로를 다잡음(攵) → 공경하다.\n占|점칠 점|卜(점) + 口(입)|회의|점괘(卜)를 입(口)으로 풀어 말함 → 점치다, 차지하다.\n覆|뒤집힐 복/덮을 부|襾(덮다) + 復|형성|덮고(襾) 뒤집음(復) → 덮다, 뒤집다.\n叶|화합할 협|口(입) + 十|형성|여러(十) 입(口)이 맞음 → 맞다; 일본에서는 '이루어지다(叶う)'.\n従|좇을 종|彳(가다) + 从(따라감)|형성|앞사람을 따라(从) 감(彳) → 따르다.\n伴|짝 반|亻(사람) + 半(반)|형성|자신의 반쪽(半)인 사람(亻) → 짝, 동반하다.\n養|기를 양|羊(양) + 食(먹이다)|형성|양(羊)을 먹여(食) 기름 → 기르다.\n雇|품 팔 고|戸 + 隹(새)|형성|본래 철새 이름 → 품을 사다, 고용.\n数|셈 수|婁 + 攵(치다)|형성|하나하나 쳐 가며(攵) 셈 → 수, 세다.\n考|생각할 고|耂(늙다) + 丂|형성|노인(耂)이 깊이 헤아림 → 생각하다.\n支|지탱할 지|十(가지) + 又(손)|회의|손(又)에 대나무 가지(十)를 쥔 모양 → 가지, 버티다.\n蓄|모을 축|艹(풀) + 畜(쌓다)|형성|풀(艹)을 쌓아(畜) 둠 → 모으다, 저축.\n震|우레 진|雨(비) + 辰|형성|비(雨)와 함께 땅을 흔드는 우레 → 떨다, 지진.\n吼|울부짖을 후|口(입) + 孔|형성|입(口)을 크게 벌려 울부짖음 → 짖다.\n迎|맞을 영|辶(가다) + 卬(우러러봄)|형성|나가서(辶) 우러러(卬) 맞이함 → 맞이하다.\n描|그릴 묘|扌(손) + 苗(모종)|형성|손(扌)으로 모종(苗)처럼 가늘게 그림 → 그리다.\n驚|놀랄 경|敬 + 馬(말)|형성|말(馬)이 놀라 날뜀 → 놀라다.\n輝|빛날 휘|光(빛) + 軍|형성|빛(光)이 둘레(軍)로 퍼짐 → 빛나다.\n乾|하늘 건/마를 간|倝(해 뜸) + 乞|형성|해(倝)가 떠올라 말림 → 마르다, 하늘.\n効|본받을 효|交 + 力(힘)|형성|힘(力)을 들인 보람 → 효과, 효력.\n叩|두드릴 고|口 + 卩|형성|무릎 꿇고(卩) 머리를 조아림 → 두드리다.\n嘆|탄식할 탄|口(입) + 𦰩(가뭄)|형성|가뭄(𦰩)에 입(口)으로 한숨 쉼 → 탄식하다.\n隠|숨을 은|阝(언덕) + 㥯|형성|언덕(阝) 뒤에 숨음 → 숨다, 감추다.\n越|넘을 월|走(달리다) + 戉|형성|달려서(走) 넘어감 → 넘다.\n耕|밭 갈 경|耒(쟁기) + 井(밭)|형성|쟁기(耒)로 밭(井)을 갊 → 경작.\n浸|잠길 침|氵(물) + 㝮|형성|물(氵)에 잠김 → 담그다.\n催|재촉할 최|亻(사람) + 崔|형성|사람(亻)을 재촉함 → 재촉하다, 개최.\n汚|더러울 오|氵(물) + 亏|형성|고인 물(氵)이 더러움 → 더럽다.\n叫|부르짖을 규|口(입) + 丩|형성|입(口)으로 크게 외침 → 외치다.\n恨|한 한|忄(마음) + 艮|형성|마음(忄)에 맺혀 풀리지 않음 → 원망하다.\n囲|에워쌀 위|囗(둘레) + 井|형성|둘레(囗)를 둘러쌈 → 에워싸다, 범위.\n噛|씹을 교|口(입) + 歯(이)|회의|입(口) 속 이(歯)로 씹음 → 씹다, 물다.\n憎|미울 증|忄(마음) + 曽|형성|마음(忄)에 쌓인 미움 → 미워하다.\n恵|은혜 혜|叀 + 心(마음)|회의|어진 마음(心)으로 베풂 → 은혜.\n暖|따뜻할 난|日(해) + 爰|형성|햇볕(日)이 따뜻함 → 따뜻하다.\n薄|엷을 박|艹(풀) + 溥|형성|풀(艹)이 얇게 덮임 → 얇다, 엷다.\n覚|깨달을 각|學의 윗부분 + 見(보다)|형성|보고(見) 배워 깨달음 → 깨닫다, 깨다, 기억하다.\n攻|칠 공|工 + 攵(치다)|형성|쳐서(攵) 공격함 → 치다.\n責|꾸짖을 책|朿(가시) + 貝(돈)|형성|빚(貝)을 가시(朿)처럼 독촉함 → 꾸짖다, 책임.\n染|물들 염|氵(물) + 九 + 木(나무)|회의|나무(木) 즙을 물(氵)에 여러 번(九) 담금 → 물들이다.\n努|힘쓸 노|奴(종) + 力(힘)|형성|종(奴)처럼 힘(力)써 일함 → 힘쓰다.\n眺|바라볼 조|目(눈) + 兆|형성|눈(目)으로 멀리 바라봄 → 바라보다.\n含|머금을 함|今 + 口(입)|형성|입(口)에 머금음 → 포함하다.\n褒|기릴 포|衣(옷) + 保|형성|넓은 옷(衣)을 내려 칭찬함 → 칭찬하다.\n認|알 인|言(말) + 忍|형성|말(言)을 참고(忍) 받아들임 → 인정하다.\n怒|성낼 노|奴(종) + 心(마음)|형성|종(奴)처럼 짓눌린 마음(心)이 터짐 → 성내다.\n祈|빌 기|礻(제단) + 斤|형성|제단(礻)에 바람을 빎 → 빌다.\n映|비칠 영|日(해) + 央|형성|햇빛(日)이 비침 → 비치다, 영화.\n凍|얼 동|冫(얼음) + 東|형성|얼음(冫)이 얼어붙음 → 얼다.\n探|찾을 탐|扌(손) + 罙(깊다)|형성|손(扌)을 깊이(罙) 넣어 더듬음 → 찾다.\n縛|얽을 박|糸(실) + 尃|형성|실(糸)로 꽁꽁 묶음 → 묶다.\n迫|핍박할 박|辶(가다) + 白|형성|가까이(辶) 다가옴 → 닥치다, 강요하다.\n光|빛 광|火(불) + 儿(사람)|회의|사람(儿)이 머리에 불(火)을 이고 있는 모양 → 빛.\n憧|동경할 동|忄(마음) + 童|형성|마음(忄)이 들뜸 → 동경하다.\n溢|넘칠 일|氵(물) + 益(넘치다)|형성|물(氵)이 넘침(益) → 넘치다.\n恐|두려울 공|巩 + 心(마음)|형성|마음(心)이 떨림 → 두려워하다.\n訪|찾을 방|言(말) + 方|형성|말(言)로 물으며 찾아감 → 방문하다.\n枯|마를 고|木(나무) + 古(오래다)|형성|오래된(古) 나무(木)가 마름 → 시들다.\n崩|무너질 붕|山(산) + 朋|형성|산(山)이 무너짐 → 무너지다.\n壊|무너질 괴|土(흙) + 褱|형성|흙(土)담이 허물어짐 → 부서지다.\n敗|패할 패|貝(돈) + 攵(치다)|회의|조개(貝)를 쳐서(攵) 깨뜨림 → 지다, 실패.\n淡|맑을 담|氵(물) + 炎|형성|물(氵)이 엷고 싱거움 → 엷다, 담담하다.\n可|옳을 가|口(입) + 丁|형성|입(口)으로 '좋다'고 함 → 옳다, 가능.\n怖|두려워할 포|忄(마음) + 布|형성|마음(忄)이 떨림 → 무서워하다.\n渋|떫을 삽|氵(물) + 歮|형성|물(氵)길이 막혀 잘 흐르지 않음 → 떫다, 정체.\n狡|교활할 교|犭(짐승) + 交|형성|짐승(犭)처럼 꾀가 많음 → 교활하다.\n酷|심할 혹|酉(술) + 告|형성|술(酉)맛이 독함 → 심하다, 가혹하다.\n古|옛 고|十 + 口(입)|회의|열(十) 대에 걸쳐 입(口)으로 전해 옴 → 옛날, 오래되다.\n醜|추할 추|酉(술) + 鬼(귀신)|형성|술(酉)에 취한 귀신(鬼) 같은 모습 → 추하다.\n若|같을 약|艹 + 右|상형|무릎 꿇고 머리를 빗는 젊은 여자의 모양 → 젊다, 만약.\n怪|괴이할 괴|忄(마음) + 圣|형성|마음(忄)에 이상하게 여김 → 괴이하다, 수상하다.\n嬉|즐길 희|女(여자) + 喜(기쁘다)|형성|여자(女)가 기뻐함(喜) → 즐겁다, 기쁘다.\n笑|웃음 소|竹(대나무) + 夭|형성|대나무(竹)가 바람에 흔들리듯 몸을 굽혀 웃음 → 웃다.\n悲|슬플 비|非(어긋나다) + 心(마음)|형성|마음(心)이 찢어짐(非) → 슬프다.\n寂|고요할 적|宀(집) + 叔|형성|집(宀) 안이 조용함 → 쓸쓸하다.\n親|친할 친|亲 + 見(보다)|형성|가까이서(亲) 늘 돌봄(見) → 어버이, 친하다.\n馬|말 마|馬|상형|갈기와 네 다리가 있는 말의 모양.\n鹿|사슴 록|鹿|상형|뿔이 있는 사슴의 모양.\n貧|가난할 빈|分(나누다) + 貝(돈)|형성|재물(貝)이 나뉘어(分) 줄어듦 → 가난하다.\n眩|어지러울 현|目(눈) + 玄(검다)|형성|눈(目) 앞이 캄캄함(玄) → 눈부시다, 어지럽다.\n目|눈 목|目|상형|사람의 눈 모양.\n珍|보배 진|王(玉) + 㐱|형성|귀한 옥(玉) → 보배, 드물다.\n喧|떠들썩할 훤|口(입) + 宣|형성|여러 입(口)이 떠듦 → 시끄럽다.\n羨|부러워할 선|羊(양) + 次(침 흘림)|회의|맛있는 양(羊)고기를 보고 침을 흘림(次) → 부러워하다.\n賑|구휼할 진|貝(돈) + 辰|형성|재물(貝)을 풀어 넉넉하게 함 → 북적이다(賑やか).\n貸|빌릴 대|代(대신) + 貝(돈)|형성|돈(貝)을 대신(代) 내어 줌 → 빌려주다.\n房|방 방|戸(문) + 方|형성|문(戸)이 달린 곁방 → 방.\n緩|느릴 완|糸(실) + 爰|형성|실(糸)이 느슨함 → 느슨하다, 완화.\n組|짤 조|糸(실) + 且|형성|실(糸)을 엮어 짬 → 짜다, 조직.\n織|짤 직|糸(실) + 戠|형성|실(糸)로 베를 짬 → 짜다.\n祖|할아비 조|礻(제단) + 且(위패)|형성|제단(礻)에 모신 위패(且) → 조상.\n父|아비 부|父|상형|손에 돌도끼를 든 모양 → 아버지.\n年|해 년|禾(벼) + 人(사람)|형성|사람(人)이 벼(禾)를 지고 가는 모양, 벼가 한 번 익는 기간 → 해.\n慕|그릴 모|莫 + 忄(마음)|형성|마음(⺗)으로 그리워함 → 사모하다.\n応|응할 응|广 + 心(마음)|형성|마음(心)으로 받아 대답함 → 응하다.\n募|모을 모|莫 + 力(힘)|형성|힘(力)써 널리 구함 → 모집하다.\n公|공평할 공|八(나누다) + 厶(사사로움)|회의|사사로움(厶)을 갈라(八) 버림 → 공평, 공적.\n義|옳을 의|羊(양) + 我(나)|회의|나(我)를 양(羊)처럼 착하고 바르게 함 → 옳다, 의리.\n式|법 식|工(도구) + 弋(말뚝)|형성|도구(工)를 쓰는 일정한 법 → 법식, 의식.\n礼|예도 례|礻(제단) + 乚|형성|제단(礻)에 바치는 예절 → 예의.\n仏|부처 불|亻(사람) + 厶|형성|佛의 약자, 깨달은 사람(亻) → 부처.\n徴|부를 징|彳(가다) + 微의 생략 + 王|형성|숨은 인재를 불러냄 → 징조, 특징.\n微|작을 미|彳(가다) + 𢼸(작다)|형성|몰래 살금살금 감(彳) → 작다, 미묘하다.\n限|한할 한|阝(언덕) + 艮(멈추다)|형성|언덕(阝)에 막혀 멈춤(艮) → 한계, 제한.\n校|학교 교|木(나무) + 交(엇갈리다)|형성|나무(木)를 엇갈려(交) 만든 울타리 → 학교, 교정.\n音|소리 음|言 + 一|지사|입(言)에서 나오는 소리를 한 획(一)으로 표시 → 소리.\n緑|푸를 록|糸(실) + 彔|형성|푸르게 물들인 실(糸) → 초록.\n陰|그늘 음|阝(언덕) + 侌(구름)|형성|언덕(阝)에 구름(侌)이 져 어둑함 → 그늘.\n明|밝을 명|日(해) + 月(달)|회의|해(日)와 달(月) → 밝다.\n訂|바로잡을 정|言(말) + 丁|형성|말(言)을 바로잡음 → 정정하다.\n招|부를 초|扌(손) + 召(부르다)|형성|손(扌)짓하여 부름(召) → 초대하다.\n待|기다릴 대|彳(가다) + 寺|형성|길(彳)에서 기다림 → 기다리다, 대우.\n召|부를 소|口(입) + 刀|형성|입(口)으로 부름 → 부르다; 召し上がる(드시다).\n促|재촉할 촉|亻(사람) + 足(발)|형성|사람(亻)의 발걸음(足)을 재촉함 → 재촉하다.\n腹|배 복|月(몸) + 复|형성|몸(月)의 불룩한 부분 → 배.\n奇|기이할 기|大 + 可|형성|사람(大)이 한 발로 서 있는 모양 → 기이하다, 홀수.\n遠|멀 원|辶(가다) + 袁|형성|멀리 감(辶) → 멀다.\n講|외울 강|言(말) + 冓(짜 맞추다)|형성|말(言)을 짜임새 있게(冓) 풂 → 강의.\n晴|갤 청|日(해) + 青(푸르다)|형성|해(日)가 나고 하늘이 푸름(青) → 개다.\n位|자리 위|亻(사람) + 立(서다)|회의|사람(亻)이 서는(立) 자리 → 위치, 지위.\n訓|가르칠 훈|言(말) + 川(내)|형성|말(言)로 물 흐르듯(川) 이끌어 가르침 → 가르치다, 훈독.\n練|익힐 련|糸(실) + 柬(가리다)|형성|실(糸)을 삶아 부드럽게 함 → 익히다, 훈련.\n抵|막을 저|扌(손) + 氐(밑)|형성|손(扌)으로 밑(氐)에서 버팀 → 막다, 저항.\n航|배 항|舟(배) + 亢|형성|배(舟)로 물을 건넘 → 항해.\n拾|주울 습|扌(손) + 合(합하다)|형성|손(扌)으로 주워 모음(合) → 줍다.\n得|얻을 득|彳(가다) + 㝵(손에 조개)|회의|길을 가다(彳) 재물을 손에 넣음 → 얻다.\n爆|터질 폭|火(불) + 暴(사납다)|형성|불(火)이 사납게(暴) 터짐 → 폭발.\n弾|탄알 탄|弓(활) + 単|형성|활(弓)로 튕겨 쏘는 알 → 탄환, 튕기다.\n較|견줄 교|車(수레) + 交|형성|수레(車)의 높낮이를 맞대어 봄 → 비교하다.\n幸|다행 행|幸|상형|수갑의 모양 → 형벌을 면함 → 다행, 행복.\n副|버금 부|畐 + 刂(칼)|형성|칼(刂)로 둘로 나눈 한쪽 → 버금, 부(副).\n業|업 업|業|상형|악기를 거는 틀의 모양 → 일, 사업.\n詞|말 사|言(말) + 司|형성|말(言)을 맡아 다룸 → 말, 품사.\n面|낯 면|面|상형|얼굴의 윤곽과 눈 → 얼굴, 면.\n産|낳을 산|彦의 생략 + 生(나다)|형성|아이가 태어남(生) → 낳다, 생산.\n到|이를 도|至(이르다) + 刂|형성|목적지에 이름(至) → 도착.\n太|클 태|大 + 丶|지사|큰(大) 것에 점을 더해 더 큼 → 크다, 굵다.\n陽|볕 양|阝(언덕) + 昜(볕)|형성|햇볕(昜)이 드는 언덕(阝) → 볕, 양지.\n揚|날릴 양|扌(손) + 昜(오르다)|형성|손(扌)으로 높이 올림(昜) → 올리다, 튀기다(揚げる).\n浮|뜰 부|氵(물) + 孚|형성|물(氵) 위에 뜸 → 뜨다.\n次|버금 차|冫 + 欠(하품)|형성|하품(欠)하며 쉬어 감 → 다음, 차례.\n如|같을 여|女(여자) + 口(입)|회의|여자(女)가 말(口)을 따름 → 같다; 欠如(결여).\n適|맞을 적|辶(가다) + 啇|형성|알맞은 곳으로 감(辶) → 알맞다, 적당.\n摘|딸 적|扌(손) + 啇|형성|손(扌) 끝으로 땀 → 따다, 지적하다.\n滴|물방울 적|氵(물) + 啇|형성|물(氵)방울.\n敵|원수 적|啇 + 攵(치다)|형성|맞서 치는(攵) 상대 → 적.\n匹|짝 필|匚 + 儿|회의|베 두 필을 맞춘 모양 → 짝, 필적하다.\n観|볼 관|雚(황새) + 見(보다)|형성|황새(雚)처럼 자세히 봄(見) → 보다, 관점.\n測|헤아릴 측|氵(물) + 則(법)|형성|물(氵)의 깊이를 기준(則)대로 잼 → 재다.\n側|곁 측|亻(사람) + 則|형성|사람(亻)의 옆 → 곁, 쪽.\n両|두 량|兩의 약자|상형|저울 양쪽 추의 모양 → 둘, 양쪽.\n客|손 객|宀(집) + 各|형성|집(宀)에 찾아온 사람 → 손님.\n棄|버릴 기|𠫓(아이) + 卄 + 木|회의|아이(𠫓)를 삼태기에 담아 버림 → 버리다.\n告|고할 고|牛(소) + 口(입)|회의|소(牛)를 바치고 입(口)으로 아뢰는 모습 → 알리다.\n沿|물 따라갈 연|氵(물) + 㕣|형성|물(氵)길을 따라감 → 따르다, 연안.\n岸|언덕 안|山 + 厂 + 干|형성|물가의 높은 낭떠러지(厂) → 기슭, 해안.\n査|조사할 사|木(나무) + 且|형성|나무(木) 울타리를 살핌 → 조사하다.\n冒|무릅쓸 모|冃(쓰개) + 目(눈)|회의|눈(目)을 가리고(冃) 나아감 → 무릅쓰다, 모험.\n在|있을 재|才 + 土(흙)|형성|땅(土) 위에 있음 → 있다.\n滞|막힐 체|氵(물) + 帯|형성|물(氵)이 막혀 고임 → 머물다, 체재.\n存|있을 존|才 + 子(아이)|형성|아이(子)를 살펴 보살핌 → 있다, 보존.\n児|아이 아|旧 + 儿(사람)|상형|정수리가 덜 굳은 아이의 모양 → 아이.\n増|더할 증|土(흙) + 曽(겹치다)|형성|흙(土)을 겹쳐(曽) 쌓음 → 늘다.\n加|더할 가|力(힘) + 口(입)|회의|힘(力)에 말(口)까지 보탬 → 더하다.\n功|공 공|工 + 力(힘)|형성|힘(力)을 써 이룬 일 → 공로.\n績|길쌈할 적|糸(실) + 責|형성|실(糸)을 자아 쌓아 감 → 이룬 결과, 성적.\n撲|칠 박|扌(손) + 菐|형성|손(扌)으로 침 → 치다; 相撲(스모).\n逮|잡을 체|辶(가다) + 隶(붙잡다)|형성|뒤쫓아 가(辶) 붙잡음(隶) → 체포.\n捕|잡을 포|扌(손) + 甫|형성|손(扌)으로 붙잡음 → 잡다.\n獲|얻을 획|犭(짐승) + 蒦|형성|사냥해 짐승(犭)을 얻음 → 획득.\n給|줄 급|糸(실) + 合|형성|실(糸)을 이어 모자람을 채움 → 주다, 급여.\n郊|들 교|交 + 阝(고을)|형성|고을(阝) 밖 → 교외.\n跡|발자취 적|足(발) + 亦|형성|발(足)이 지나간 흔적 → 자취.\n受|받을 수|爫(손) + 冖 + 又(손)|회의|위아래 손(爫·又)으로 물건을 주고받음 → 받다.\n輸|보낼 수|車(수레) + 兪|형성|수레(車)로 실어 보냄 → 수송, 수출입.\n入|들 입|入|상형|안으로 들어가는 모양.\n愉|즐거울 유|忄(마음) + 兪|형성|마음(忄)이 즐거움 → 유쾌.\n悦|기쁠 열|忄(마음) + 兌(기쁘다)|형성|마음(忄)이 기쁨(兌) → 기쁘다.\n勤|부지런할 근|堇 + 力(힘)|형성|힘(力)써 부지런히 일함 → 근무.\n演|펼 연|氵(물) + 寅|형성|물(氵)이 길게 흘러 퍼짐 → 펼치다, 연기.\n園|동산 원|囗(울타리) + 袁|형성|울타리(囗)를 친 뜰 → 동산, 정원.\n芸|재주 예|艹(풀) + 云|형성|藝의 약자, 초목(艹)을 심어 가꾸는 재주 → 예능, 원예.\n師|스승 사|𠂤(언덕) + 帀(두르다)|회의|많은 사람이 둘러싼 우두머리 → 스승, 군대.\n牧|칠 목|牛(소) + 攵(치다)|회의|소(牛)를 막대로 몰아(攵) 기름 → 기르다, 목사.\n紳|큰 띠 신|糸(실) + 申|형성|벼슬아치가 매는 큰 띠(糸) → 신사.\n士|선비 사|士|상형|도끼(또는 서 있는 사내)의 모양 → 선비, 사내.\n武|호반 무|止(발) + 戈(창)|회의|창(戈)을 들고 나아감(止) → 무사, 무기.\n難|어려울 난|堇 + 隹(새)|형성|새(隹) 이름에서 가차 → 어렵다.\n血|피 혈|皿(그릇) + 丿|지사|제사 그릇(皿)에 담은 피 → 피.\n影|그림자 영|景(볕) + 彡(무늬)|형성|빛(景)이 만든 무늬(彡) → 그림자.\n撮|모을 촬|扌(손) + 最|형성|손(扌) 끝으로 집음 → 집다, 촬영.\n営|경영할 영|𤇾(불빛) + 呂|형성|불빛을 둘러친 진영 → 짓다, 경영.\n栄|영화 영|𤇾 + 木(나무)|형성|나무(木)에 꽃이 활짝 핌 → 번영, 영광.\n繁|번성할 번|敏 + 糸(실)|형성|실(糸)이 많이 얽힘 → 많다, 번성.\n紀|벼리 기|糸(실) + 己|형성|실(糸) 끝을 정리하는 벼리 → 기록, 기원.\n剣|칼 검|僉 + 刂(칼)|형성|양날 칼(刂) → 칼, 검.\n健|굳셀 건|亻(사람) + 建(세우다)|형성|사람(亻)이 꿋꿋이 섬(建) → 튼튼하다.\n康|편안 강|庚 + 米|형성|곡식(米)이 넉넉해 편안함 → 편안하다.\n賢|어질 현|臤(굳다) + 貝(재물)|형성|재물(貝)을 잘 다루는 굳은(臤) 사람 → 어질다, 현명.\n金|쇠 금|金|형성|흙(土) 속에 묻힌 광석(丷) → 쇠, 금, 돈.\n属|붙을 속|尸 + 禹(벌레)|형성|꼬리(尸)가 이어 붙음 → 딸리다, 소속.\n所|바 소|戸(문) + 斤(도끼)|형성|도끼(斤)로 다듬은 집(戸) 자리 → 곳, ~하는 바.\n即|곧 즉|皀(밥) + 卩(무릎 꿇은 사람)|회의|밥상(皀)에 곧바로 다가앉음(卩) → 곧.\n座|자리 좌|广(집) + 坐(앉다)|형성|집(广) 안에 앉는(坐) 자리 → 자리.\n参|참여할 참|厶 + 大 + 彡|상형|비녀를 꽂은 사람 위에 별 셋 → 셋, 참여하다.\n照|비출 조|昭(밝다) + 灬(불)|형성|불(灬)로 밝게(昭) 비춤 → 비추다, 참조.\n称|일컬을 칭|禾(벼) + 尓|형성|벼(禾)를 저울질함 → 일컫다, 칭찬.\n安|편안 안|宀(집) + 女(여자)|회의|집(宀) 안에 여자(女)가 있어 편안함 → 편안하다, 싸다.\n未|아닐 미|未|상형|나무(木) 끝에 가지가 덜 자란 모양 → 아직 ~아니다.\n就|나아갈 취|京(높은 언덕) + 尤|회의|높은 곳(京)으로 나아감 → 나아가다, 취업.\n司|맡을 사|司|회의|손(⺆)과 입(口)으로 일을 맡아 다스림 → 맡다.\n汗|땀 한|氵(물) + 干|형성|몸에서 나는 물(氵) → 땀.\n泡|거품 포|氵(물) + 包(싸다)|형성|물(氵)이 공기를 싸서(包) 생긴 것 → 거품.\n露|이슬 로|雨(비) + 路|형성|비(雨)처럼 맺힌 물방울 → 이슬, 드러나다.\n喜|기쁠 희|壴(북) + 口(입)|회의|북(壴)을 치며 입(口)으로 노래함 → 기쁘다.\n堂|집 당|尚(높다) + 土(흙)|형성|흙(土)을 높이(尚) 쌓은 위의 큰 집 → 집, 당당하다.\n犯|범할 범|犭(개) + 㔾(사람)|형성|개(犭)가 사람(㔾)을 덮침 → 범하다.\n導|인도할 도|道(길) + 寸(손)|형성|손(寸)으로 길(道)을 이끎 → 이끌다, 지도.\n総|다 총|糸(실) + 忩|형성|실(糸)을 한데 묶음 → 모두, 총.\n売|팔 매|士 + 冖 + 儿|형성|賣의 약자, 물건을 내놓아(出) 팖 → 팔다.\n額|이마 액|客 + 頁(머리)|형성|머리(頁)의 앞쪽 → 이마, 액자, 금액.\n系|맬 계|丿 + 糸(실)|회의|실(糸)을 손(丿)으로 이음 → 잇다, 계통.\n縮|줄일 축|糸(실) + 宿|형성|실(糸)이 오그라듦 → 줄다, 축소.\n稿|원고 고|禾(벼) + 高|형성|벼(禾)의 줄기, 볏짚 → 초안, 원고.\n物|물건 물|牛(소) + 勿|형성|여러 색의 소(牛)에서 온갖 것 → 물건.\n紹|이을 소|糸(실) + 召(부르다)|형성|실(糸)로 이어 불러옴(召) → 잇다, 소개.\n看|볼 간|手(손) + 目(눈)|회의|손(手)을 눈(目) 위에 대고 봄 → 보다, 간호.\n板|널 판|木(나무) + 反|형성|나무(木)를 얇게 켠 것 → 널빤지, 판.\n硬|굳을 경|石(돌) + 更|형성|돌(石)처럼 단단함 → 단단하다.\n興|일 흥|舁(마주 든 손) + 同|회의|여럿이 손을 맞잡고 들어 올림 → 일으키다, 흥미.\n味|맛 미|口(입) + 未|형성|입(口)으로 느끼는 것 → 맛.\n趣|뜻 취|走(달리다) + 取|형성|뜻한 바를 취하러(取) 달려감(走) → 뜻, 취미.\n旨|뜻 지|匕(숟가락) + 日(甘의 변형)|회의|숟가락(匕)으로 맛봄(甘) → 맛있다, 뜻.\n危|위태할 위|⺈(사람) + 厄(벼랑)|회의|사람이 벼랑(厄) 위에 서 있음 → 위태롭다.\n請|청할 청|言(말) + 青|형성|말(言)로 청함 → 청하다, 신청.\n申|납 신|申|상형|번개가 치는 모양 → 펴다, 아뢰다(申す).\n来|올 래|來의 약자|상형|보리 이삭의 모양 → 하늘이 내려 준 것 → 오다.\n貨|재물 화|化(되다) + 貝(돈)|형성|돈(貝)으로 바뀔(化) 수 있는 것 → 재화, 화물.\n新|새 신|亲 + 斤(도끼)|형성|도끼(斤)로 갓 벤 나무 → 새롭다.\n換|바꿀 환|扌(손) + 奐|형성|손(扌)으로 주고받아 바꿈 → 바꾸다.\n替|바꿀 체|㚘(두 사람) + 曰(말하다)|회의|두 사람이 번갈아 말함 → 바꾸다, 갈아입다(着替える).\n験|시험 험|馬(말) + 僉|형성|말(馬)의 좋고 나쁨을 살펴봄 → 시험, 경험.\n了|마칠 료|了|상형|팔이 없는 아이의 모양에서 가차 → 마치다, 완료.\n路|길 로|足(발) + 各|형성|발(足)로 각자(各) 다니는 길 → 길.\n沢|못 택|氵(물) + 尺|형성|물(氵)이 괸 못 → 윤택, 광택; 贅沢(사치).\n贅|혹 췌|敖 + 貝(돈)|형성|돈(貝)을 군더더기로 씀 → 혹, 사치(贅沢).\n国|나라 국|囗(국경) + 玉(구슬)|회의|국경(囗) 안에 보배(玉)를 지킴 → 나라.\n問|물을 문|門(문) + 口(입)|형성|문(門) 앞에서 입(口)으로 물음 → 묻다, 문제.\n因|인할 인|囗 + 大(사람)|회의|사람(大)이 깔개(囗) 위에 누운 모양 → 의지하다, 원인.\n臣|신하 신|臣|상형|고개 숙여 올려다보는 눈의 모양 → 신하.\n準|준할 준|氵(물) + 隼|형성|물(氵)의 수평을 기준으로 삼음 → 기준, 준하다.\n透|사무칠 투|辶(가다) + 秀|형성|뚫고 지나감(辶) → 통하다, 투명.\n採|캘 채|扌(손) + 采(따다)|형성|손(扌)으로 따서(采) 가림 → 캐다, 채용.\n非|아닐 비|非|상형|새의 두 날개가 서로 등진 모양 → 아니다, 어긋나다.\n常|항상 상|尚 + 巾(천)|형성|길게 늘어뜨린 천(巾) → 늘, 보통.\n識|알 식|言(말) + 戠|형성|말(言)로 표시해 알아봄 → 알다, 지식.\n使|하여금 사|亻(사람) + 吏(관리)|형성|사람(亻)에게 일을 맡김(吏) → 부리다, 쓰다.\n供|이바지할 공|亻(사람) + 共(두 손)|형성|사람(亻)이 두 손(共)으로 받들어 바침 → 바치다, 제공.\n響|울릴 향|郷 + 音(소리)|형성|소리(音)가 마을(郷)에 울려 퍼짐 → 울림, 영향.\n歴|지날 력|厤 + 止(발)|형성|발(止)로 차례차례 지나감 → 지나다, 경력.\n暗|어두울 암|日(해) + 音|형성|해(日)가 없어 어두움 → 어둡다, 암기.\n町|밭두둑 정|田(밭) + 丁|형성|밭(田) 사이 길 → 동네, 마을.\n初|처음 초|衤(옷) + 刀(칼)|회의|옷(衤)을 지으려 처음 칼(刀)질을 함 → 처음.\n段|층계 단|𠀐 + 殳(치다)|회의|돌을 쳐서(殳) 계단을 만듦 → 단계.\n階|섬돌 계|阝(언덕) + 皆|형성|언덕(阝)을 오르는 계단 → 층, 계단.\n冬|겨울 동|夂 + 冫(얼음)|회의|얼음(冫)이 어는 계절 → 겨울.\n夜|밤 야|亠 + 亻 + 夕(저녁)|형성|사람이 저녁(夕) 이후 쉬는 때 → 밤.\n放|놓을 방|方 + 攵(치다)|형성|쳐서(攵) 멀리 쫓아냄 → 놓다, 방송.\n送|보낼 송|辶(가다) + 关|회의|물건을 받들어 가서(辶) 전함 → 보내다.\n形|모양 형|幵 + 彡(무늬)|형성|무늬(彡)로 나타낸 꼴 → 모양.\n態|모습 태|能(능하다) + 心(마음)|형성|마음(心)이 드러나는 모습 → 태도, 상태.\n化|될 화|亻(사람) + 匕(거꾸로 된 사람)|회의|바로 선 사람(亻)이 거꾸로(匕) 바뀜 → 되다, 변화.\n旧|예 구|丨 + 日|형성|舊의 약자 → 옛날, 오래됨.\n舎|집 사|人 + 舌의 변형|상형|지붕 아래 쉬는 집의 모양 → 집, 숙사.\n医|의원 의|匚(상자) + 矢(화살)|회의|화살(矢)촉을 상자(匚)에 넣음, 醫의 약자 → 의사, 의학.\n界|지경 계|田(밭) + 介(끼다)|형성|밭(田) 사이에 끼어(介) 있는 경계 → 경계, 세계.\n婚|혼인할 혼|女(여자) + 昏(저녁)|형성|옛날 저녁(昏)에 신부(女)를 맞던 혼례 → 결혼.\n職|직분 직|耳(귀) + 戠|형성|귀(耳)로 듣고 맡은 일 → 직업.\n集|모을 집|隹(새) + 木(나무)|회의|새(隹)들이 나무(木) 위에 모임 → 모이다.\n立|설 립|立|상형|사람이 땅 위에 서 있는 모양.\n員|인원 원|口 + 貝(솥)|상형|둥근 솥의 아가리 → 수효, 인원.\n派|갈래 파|氵(물) + 𠂢(갈라짐)|형성|물(氵)줄기가 갈라짐 → 갈래, 파벌.\n慎|삼갈 신|忄(마음) + 真|형성|마음(忄)을 참되게(真) 다잡음 → 삼가다, 신중.\n宅|집 택|宀(집) + 乇|형성|몸을 맡겨 사는 집(宀) → 집, 주택.\n街|거리 가|行(길) + 圭|형성|사방으로 통하는 길(行) → 거리.\n商|장사 상|商|형성|물건을 헤아려 사고팖 → 장사.\n店|가게 점|广(집) + 占(차지하다)|형성|자리를 차지한(占) 건물(广) → 가게.\n球|공 구|王(玉) + 求|형성|둥근 옥(玉) → 공, 구.\n緊|긴할 긴|臤(굳다) + 糸(실)|형성|실(糸)을 굳게(臤) 감음 → 팽팽하다, 긴장.\n液|진 액|氵(물) + 夜|형성|물(氵)처럼 흐르는 것 → 액체.\n賀|하례할 하|加(더하다) + 貝(재물)|형성|재물(貝)을 더하여(加) 축하함 → 축하.\n誌|기록할 지|言(말) + 志|형성|말(言)로 적어 둠 → 기록, 잡지.\n類|무리 류|米 + 犬 + 頁|형성|서로 비슷한 것끼리 모음 → 무리, 종류.\n専|오로지 전|叀 + 寸(손)|형성|손(寸)으로 실패(叀)를 오로지 돌림 → 오로지, 전문.\n門|문 문|門|상형|두 짝 문의 모양.\n電|번개 전|雨(비) + 申(번개)|형성|비(雨) 올 때 치는 번개(申) → 전기.\n車|수레 차|車|상형|수레를 위에서 본 모양.\n奨|장려할 장|将 + 大|형성|크게(大) 이끌어 줌 → 권하다, 장학금.\n宿|잘 숙|宀(집) + 佰|회의|집(宀)에서 사람이 자리에 누움 → 묵다, 숙박.\n泊|배 댈 박|氵(물) + 白|형성|물(氵)가에 배를 댐 → 묵다.\n降|내릴 강/항복할 항|阝(언덕) + 夅(내려오는 발)|형성|언덕(阝)에서 내려옴 → 내리다.\n穫|거둘 확|禾(벼) + 蒦|형성|벼(禾)를 거두어들임 → 수확.\n署|관청 서|罒(그물) + 者|형성|그물(罒)처럼 나눈 부서 → 관청, 서명.\n税|세금 세|禾(벼) + 兌|형성|벼(禾)를 거두어 바침 → 세금.\n版|판목 판|片(조각) + 反|형성|나뭇조각(片)에 새긴 판 → 판, 출판.\n語|말씀 어|言(말) + 吾(나)|형성|내(吾)가 하는 말(言) → 말, 언어.\n東|동녘 동|木(나무) + 日(해)|회의|해(日)가 나무(木) 사이로 떠오르는 쪽 → 동쪽.\n京|서울 경|京|상형|높은 언덕 위의 큰 집 → 서울.\n駅|역 역|馬(말) + 尺|형성|말(馬)을 갈아타던 역참 → 역.\n具|갖출 구|目(貝) + 廾(두 손)|회의|두 손(廾)으로 재물(貝)을 갖춤 → 갖추다, 도구.\n建|세울 건|聿(붓) + 廴(걷다)|회의|붓(聿)으로 계획을 세워 나아감(廴) → 세우다.\n築|쌓을 축|筑 + 木(나무)|형성|나무(木) 공이로 다져 쌓음 → 쌓다, 건축.\n遅|늦을 지|辶(가다) + 犀|형성|느릿느릿 감(辶) → 늦다.\n皮|가죽 피|皮|상형|손으로 짐승 가죽을 벗기는 모양 → 가죽, 껍질.\n族|겨레 족|㫃(깃발) + 矢(화살)|회의|같은 깃발(㫃) 아래 화살(矢)을 든 무리 → 겨레, 가족.\n焼|사를 소|火(불) + 尭|형성|불(火)로 태움 → 굽다, 타다.\n川|내 천|川|상형|물이 흘러가는 모양 → 내, 강.\n朝|아침 조|𠦝(풀 사이 해) + 月(달)|회의|해가 풀 사이로 뜨고 달(月)이 남아 있는 때 → 아침.\n醤|젓갈 장|将 + 酉(술 단지)|형성|단지(酉)에 담가 삭힌 것 → 장, 간장.\n漬|담글 지|氵(물) + 責|형성|물(氵)에 담금 → 절이다.\n済|건널 제|氵(물) + 斉|형성|물(氵)을 건넘 → 건너다, 끝내다(済む).\n楽|즐길 락/노래 악|白 + 幺 + 木|상형|나무(木) 받침 위 악기 → 음악, 즐겁다.\n般|일반 반|舟(배) + 殳|회의|배(舟)를 돌림 → 옮기다, 일반.\n邪|간사할 사|牙 + 阝(고을)|형성|어긋난(牙) 것 → 간사하다; 風邪(감기), 邪魔(방해).\n方|모 방|方|상형|쟁기(또는 두 배를 나란히 묶은) 모양 → 방향, 방법.\n死|죽을 사|歹(뼈) + 匕(사람)|회의|사람(匕)이 앙상한 뼈(歹)가 됨 → 죽다.\n夏|여름 하|頁(머리) + 夂(발)|상형|머리와 발을 드러낸 사람의 모습 → 여름.\n取|가질 취|耳(귀) + 又(손)|회의|싸움에서 손(又)으로 적의 귀(耳)를 벰 → 취하다.\n掛|걸 괘|扌(손) + 卦|형성|손(扌)으로 걸어 놓음 → 걸다.\n留|머무를 류|卯 + 田(밭)|형성|밭(田)에 머무름 → 머무르다.\n持|가질 지|扌(손) + 寺|형성|손(扌)에 쥠 → 가지다.\n乗|탈 승|乘의 약자|회의|사람이 나무(木) 위에 올라탄 모양 → 타다.\n慣|익숙할 관|忄(마음) + 貫(꿰다)|형성|마음(忄)에 꿰어진(貫) 듯 익숙함 → 익숙하다, 습관.\n買|살 매|罒(그물) + 貝(돈)|회의|그물(罒)로 재물(貝)을 거둬들임 → 사다.\n忘|잊을 망|亡(없다) + 心(마음)|형성|마음(心)에서 없어짐(亡) → 잊다.\n呼|부를 호|口(입) + 乎|형성|입(口)으로 소리 내 부름 → 부르다.\n差|다를 차|左 + 𠂹|형성|손(左)으로 비교해 어긋남을 봄 → 차이.\n泣|울 읍|氵(물) + 立|형성|눈물(氵)을 흘리며 섬 → 울다.\n走|달릴 주|夭(팔 흔드는 사람) + 止(발)|회의|팔을 흔들며 발(止)로 달림 → 달리다.\n働|일할 동|亻(사람) + 動(움직이다)|회의|사람(亻)이 움직여(動) 일함 → 일하다 (일본에서 만든 글자).\n振|떨칠 진|扌(손) + 辰|형성|손(扌)을 흔듦 → 흔들다, 떨치다.\n犬|개 견|犬|상형|개의 옆모습.\n蒸|찔 증|艹(풀) + 烝(김 오름)|형성|김(烝)으로 찜 → 찌다, 무덥다.\n暑|더울 서|日(해) + 者|형성|해(日)가 뜨거움 → 덥다.\n悟|깨달을 오|忄(마음) + 吾(나)|형성|나(吾)의 마음(忄)으로 깨침 → 깨닫다, 각오.\n躍|뛸 약|足(발) + 翟(꿩)|형성|꿩(翟)처럼 발(足)로 뛰어오름 → 뛰다, 활약.\n契|맺을 계|㓞(새기다) + 大|형성|칼로 새겨(㓞) 약속을 맺음 → 맺다, 계기.\n魔|마귀 마|麻 + 鬼(귀신)|형성|사람을 홀리는 귀신(鬼) → 마귀; 邪魔(방해).\n操|잡을 조|扌(손) + 喿|형성|손(扌)으로 잡고 다룸 → 다루다, 조작.\n訳|번역할 역|言(말) + 尺|형성|말(言)을 옮김 → 번역, 이유(訳).\n根|뿌리 근|木(나무) + 艮|형성|나무(木)의 밑동 → 뿌리.\n埋|묻을 매|土(흙) + 里|형성|흙(土)으로 묻음 → 묻다.\n衰|쇠할 쇠|衣(옷) + 冄|상형|도롱이(衣)가 해어진 모양 → 쇠하다.\n稼|심을 가|禾(벼) + 家|형성|벼(禾)를 심어 거둠 → 일하다, (돈을) 벌다.\n沈|잠길 침|氵(물) + 冘|형성|물(氵) 속에 잠김 → 가라앉다.\n塞|막힐 색|宀 + 共 + 土(흙)|형성|흙(土)으로 틈을 막음 → 막다.\n習|익힐 습|羽(날개) + 白|회의|어린 새가 날개(羽)를 퍼덕이며 나는 법을 익힘 → 익히다.\n潜|잠길 잠|氵(물) + 替|형성|물(氵) 속으로 숨어 들어감 → 잠기다, 잠수.\n甚|심할 심|甘(달다) + 匹|회의|단(甘) 것에 지나치게 빠짐 → 심하다.\n質|바탕 질|斦(도끼 둘) + 貝(재물)|회의|재물(貝)과 맞바꾸는 저당 → 바탕, 질.\n独|홀로 독|犭(짐승) + 虫|형성|무리 짓지 않는 짐승(犭) → 홀로, 독특.\n膨|부풀 팽|月(몸) + 彭(북소리)|형성|몸(月)이 북(彭)처럼 부풂 → 부풀다.\n惨|참혹할 참|忄(마음) + 参|형성|마음(忄)이 아픔 → 참혹하다, 비참.\n静|고요할 정|青 + 争(다투다)|형성|다툼(争)이 그쳐 맑고(青) 조용함 → 고요하다.\n釈|풀 석|釆(가리다) + 尺|형성|하나하나 가려(釆) 풀어냄 → 풀다, 해석; 会釈(가벼운 인사).\n抜|뽑을 발|扌(손) + 犮|형성|손(扌)으로 뽑아냄 → 뽑다, 빼다.\n以|써 이|以|상형|쟁기의 모양 → ~로써, 이전·이후의 기준.\n果|실과 과|田(열매) + 木(나무)|상형|나무(木)에 열매(田)가 달린 모양 → 열매, 결과.\n試|시험 시|言(말) + 式(법)|형성|말(言)로 법식(式)에 맞는지 해 봄 → 시험하다.\n揃|자를 전|扌(손) + 前|형성|손(扌)으로 가지런히 자름 → 갖추다(揃える).\n昼|낮 주|尺 + 旦(해 뜸)|회의|해가 떠서(旦) 지기 전까지 → 낮.\n服|옷 복|月(배) + 𠬝|형성|몸(月)에 붙여 입는 것 → 옷, 복종.\n軍|군사 군|冖(덮다) + 車(수레)|회의|수레(車)를 둘러싼(冖) 군대 → 군사.\n慌|어리둥절할 황|忄(마음) + 荒(거칠다)|형성|마음(忄)이 거칠게(荒) 흔들림 → 허둥대다.\n慮|생각할 려|虍 + 思(생각)|형성|깊이 생각함(思) → 생각하다, 염려.\n抑|누를 억|扌(손) + 卬|형성|손(扌)으로 내리누름 → 누르다, 억제.\n我|나 아|我|상형|톱니 날이 달린 창의 모양에서 가차 → 나.\n慢|거만할 만|忄(마음) + 曼(길다)|형성|마음(忄)이 늘어짐(曼) → 게으르다, 거만; 我慢(참음).\n臆|가슴 억|月(몸) + 意(뜻)|형성|생각(意)이 깃든 가슴(月) → 가슴, 겁(臆病).\n舞|춤출 무|無 + 舛(두 발)|형성|두 발(舛)을 엇갈리며 춤춤 →  접속하는 문형","ex":[{"s":"さっき夕食を食べ[たところで]、お腹がいっぱいです。","k":"방금 막 저녁을 먹은 참이라, 배가 불러요."}]},{"day":27,"p":"～たとたん","m":"~한 순간","g":"동사 뒤에 접속하는 문형","ex":[{"s":"泥棒は警察を見[たとたん]、びっくりして逃げ出した。","k":"도둑은 경찰을 본 순간, 깜짝 놀라 도망쳤다."}]},{"day":27,"p":"～ている","m":"~하고 있다(계속), ~해 있다(결과), ~하고 있다(반복), ~했다(경험), ~해 있다(완료), ~해 있다(상태)","g":"동사 뒤에 접속하는 문형","ex":[{"s":"政府は今、少子高齢化の対策を考え[ている]。","k":"정부는 지금, 저출산 고령화 대책을 생각하고 있다."}]},{"day":27,"p":"～てから","m":"~하고 나서","g":"동사 뒤에 접속하는 문형","ex":[{"s":"集合時間を決め[てから]自由行動をしましょう。","k":"집합 시간을 정하고 나서 자유행동을 합시다."}]},{"day":27,"p":"～てからでないと","m":"~한 후가 아니면, ~하지 않으면","g":"동사 뒤에 접속하는 문형","ex":[{"s":"身分を確認し[てからでないと]入場できません。","k":"신분을 확인한 후가 아니면 입장할 수 없습니다."}]},{"day":27,"p":"～てからにする","m":"~하고 나서 하다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"出発は全員揃っ[てからにします]ので、もうしばらく待機しましょう。","k":"출발은 전원 모이고 나서 하겠으니, 잠시 대기합시다."}]},{"day":27,"p":"～てしまう","m":"~해 버리다, ~하고 말다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼は長時間の労働による過労のせいか急に倒れ[てしまった]。","k":"그는 장시간 노동에 의한 과로 탓인지 갑자기 쓰러져 버렸다."}]},{"day":27,"p":"～てほしい","m":"~했으면 한다, ~하면 좋겠다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"これは重要事項なので何回もチェックし[てほしい]です。","k":"이건 중요사항이니까 몇 번이고 체크했으면 합니다."}]},{"day":27,"p":"～てみる","m":"~해 보다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"たとえ失敗するとしても一度挑戦し[てみた]方がいい。","k":"설령 실패한다고 해도 한번 도전해보는 편이 좋아."}]},{"day":27,"p":"～ても～なくても","m":"~해도 ~하지 않아도","g":"동사 뒤에 접속하는 문형","ex":[{"s":"今更準備し[てもしなくても]たぶん結果は同じだと思う。","k":"이제 와서 준비해도 하지 않아도 아마 결과는 같다고 생각한다."}]},{"day":27,"p":"～てもいい","m":"~해도 괜찮다, ~해도 좋다, ~해도 된다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"すみません、この本をちょっと借り[てもいい]でしょうか。","k":"실례합니다, 이 책을 잠깐 빌려도 괜찮을까요?"}]},{"day":27,"p":"～てはじめて","m":"~하고 나서야 비로소","g":"동사 뒤에 접속하는 문형","ex":[{"s":"実家を離れ[てはじめて]親のありがたさが分かった。","k":"집을 떠나고 나서야 비로소 부모님의 고마움을 알았다."}]},{"day":27,"p":"～あまり","m":"~한 나머지","g":"동사 뒤에 접속하는 문형","ex":[{"s":"時間がなくて急いだ[あまり]、財布を忘れてしまった。","k":"시간이 없어서 서두른 나머지, 지갑을 잊고 말았다."}]},{"day":27,"p":"～一方だ","m":"~하기만 하다, ~할 뿐이다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"アプリ業界の技術競争が激しくなる[一方だ]。","k":"어플리케이션 업계의 기술 경쟁이 격해지기만 한다."}]},{"day":27,"p":"～上は","m":"~하는 이상에는, ~한 바에는","g":"동사 뒤에 접속하는 문형","ex":[{"s":"会社を立ち上げる[上は]、相当な準備が必要だ。","k":"회사를 세우는 이상에는, 상당한 준비가 필요하다."}]},{"day":27,"p":"～ことはない/～こともない","m":"~할 필요는 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"それほど怖い人ではないから緊張する[ことはない]よ。","k":"그렇게 무서운사람이아니니까긴장할필요는없어."}]},{"day":27,"p":"～ことなく","m":"~하지 않고","g":"동사 뒤에 접속하는 문형","ex":[{"s":"お父さんは家族のために、週末も休む[ことなく]働いている。","k":"아빠는가족을위해서, 주말도쉬지않고일하고있다."}]},{"day":27,"p":"～しかない/～しかあるまい","m":"~하는 수밖에 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"電車が延着したので、家まで歩いて帰る[しかない]。","k":"전철이연착되었기때문에, 집까지걸어서 돌아갈수밖에없다."}]},{"day":27,"p":"～よりほかない","m":"~할 수밖에 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"正しくない規則でも従う[よりほかない]です。","k":"옳지않은규칙이라도따를수밖에없습니다."}]},{"day":27,"p":"～までもない","m":"~할 것도 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼女が世界一の選手であることは言う[までもない]。","k":"그녀가세계제일의선수인 건말할것도없다."}]},{"day":27,"p":"～まま(に)","m":"~하는 대로","g":"동사 뒤에 접속하는 문형","ex":[{"s":"旅行中は足の向く[まま気の向くまま]歩き回った。","k":"여행 동안은발길닿는대로마음가는대로걸어다녔다."}]},{"day":27,"p":"～わけにはいかない","m":"~할 수 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"決勝進出のため、この試合は負ける[わけにはいかない]。","k":"결승진출을위해, 이시합은질수없다."}]},{"day":27,"p":"～か～ないかのうちに","m":"~하자마자","g":"동사 뒤에 접속하는 문형","ex":[{"s":"演劇が終わる[か終わらないかのうちに]立ち上がって拍手をした。","k":"연극이끝나자마자일어서서박수를쳤다."}]},{"day":27,"p":"～かのようだ","m":"~인 것 같다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼は靴の紐を結ぶ[かのように]その場にしゃがみこんだ。","k":"그는신발끈을묶는것같이그자리에웅크리고앉았다."}]},{"day":27,"p":"～からには/～からは","m":"~하는 이상에는, ~한 바에는","g":"동사 뒤에 접속하는 문형","ex":[{"s":"留学する[からには]、その国の文化を体験したほうがいい。","k":"유학하는이상에는, 그나라의문화를체험하는편이좋다."}]},{"day":27,"p":"～ことがある","m":"1. ~하는 경우가 있다 2. ~한 적이 있다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"たまに顔も洗わないで寝る[ことがあります]。","k":"가끔 얼굴도 씻지 않고 자는 경우가 있습니다."}]},{"day":27,"p":"～ことにする","m":"~하기로 하다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"外国人の友達を作るため、交流会に参加する[ことにした]。","k":"외국인 친구를 만들기 위해, 교류회에 참가하기로 했다."}]},{"day":27,"p":"～とおりに","m":"~하는 대로","g":"동사 뒤에 접속하는 문형","ex":[{"s":"今は親の言う[とおりに]することにした。","k":"지금은 부모님이 말하는 대로 하기로 했다."}]},{"day":27,"p":"～べきだ","m":"~해야 한다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"親に物を拾ったら持ち主に返す[べきだ]と言われた。","k":"부모님은 물건을 주우면 주인에게 돌려줘야 한다고 했다."}]},{"day":27,"p":"～ほうがよかった","m":"~하는 편이 좋았다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼女にとっては今の仕事を続けるよりも転職する[ほうがよかった]。","k":"그녀에게 있어서는 지금의 일을 계속하는 것보다도 이직하는 편이 좋았다."}]},{"day":27,"p":"～ようにする","m":"~하도록 하다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"課題を明日までには提出する[ようにして]ください。","k":"과제를 내일까지는 제출하도록 해주세요."}]},{"day":27,"p":"～得る/得る","m":"~할 수 있다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"どんなに気を付けていたとしても事故は起こり[得る]。","k":"아무리 조심하고 있었다고 해도 사고는 일어날 수 있다."}]},{"day":27,"p":"～かけの","m":"~하다 만","g":"동사 뒤에 접속하는 문형","ex":[{"s":"食べ[かけの]パンを置いたまま出かけて、母に怒られた。","k":"먹다 만 빵을 둔 채로 외출해서, 엄마에게 혼났다."}]},{"day":27,"p":"～がたい","m":"~하기 어렵다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼はいつも怒ったような顔をしていて、近寄り[がたい]。","k":"그는 언제나 화난 것 같은 얼굴을 하고 있어서, 다가가기 어려워."}]},{"day":27,"p":"～かねる","m":"~하기 어렵다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"課長の意見ですが、私としては賛成し[かねます]。","k":"과장님의 의견 말인데요, 저로서는 찬성하기 어렵습니다."}]},{"day":28,"p":"～かねない","m":"~할 수도 있다, ~할지도 모른다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼女のあいまいな言い方は誤解を招き[かねない]。","k":"그녀의 애매한 말투는 오해를 부를 수도 있다."}]},{"day":28,"p":"～そうもない/～そうにない","m":"~할 것 같지 않다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"こんな給料では、20年働いても自分の家を買え[そうもない]。","k":"이런 급료로는, 20년 일해도 내 집을 살 수 있을 것 같지 않다."}]},{"day":28,"p":"～つつ","m":"~하면서","g":"동사 뒤에 접속하는 문형","ex":[{"s":"彼女はダイエットするといい[つつ]、運動は絶対しない。","k":"그녀는 다이어트 하겠다고 말하면서, 운동은 절대 하지 않는다."}]},{"day":28,"p":"～つつある","m":"~하는 중이다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"手術が成功した後、おじいさんの病気は回復し[つつある]。","k":"수술이 성공한 후, 할아버지의 병은 회복되는 중이다."}]},{"day":28,"p":"～っこない","m":"~할 리 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"一人で10人前を食べるなんて、でき[っこない]よ。","k":"혼자서 10인분을 먹는다니, 가능할 리 없어."}]},{"day":28,"p":"～次第","m":"~대로","g":"동사 뒤에 접속하는 문형","ex":[{"s":"連絡が入り[次第]、すぐにお伝えします。","k":"연락이 들어오는 대로, 바로 전달하겠습니다."}]},{"day":28,"p":"～ようがない/～ようもない","m":"~할 방도가 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"いくら考えてみても顧客を納得させ[ようがない]。","k":"아무리 생각해봐도 고객을 납득시킬 방도가 없다."}]},{"day":28,"p":"～ざるを得ない","m":"~하지 않을 수 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"論理的な彼の話を聞いて、私が間違っていたと認め[ざるを得なかった]。","k":"논리적인 그의 말을 듣고, 내가 틀렸다고 인정하지 않을 수 없었다."}]},{"day":28,"p":"～ないかぎり","m":"~하지 않는 한","g":"동사 뒤에 접속하는 문형","ex":[{"s":"努力し[ないかぎり]、志望大学には合格できない。","k":"노력하지 않는 한, 지망 대학에는 합격할 수 없다."}]},{"day":28,"p":"～ないかな","m":"~하지 않으려나, ~하지 않을까?","g":"동사 뒤에 접속하는 문형","ex":[{"s":"今年の誕生日にはお兄さんがカバンを買ってくれ[ないかな]。","k":"올해 생일에는 형이 가방을 사주지 않으려나."}]},{"day":28,"p":"～ないことには","m":"~하지 않고서는","g":"동사 뒤에 접속하는 문형","ex":[{"s":"自分で体験してみ[ないことには]何も身につかない。","k":"스스로 체험해보지 않고서는 아무것도 몸에 익지 않는다."}]},{"day":28,"p":"～ないではいられない/～ずにはいられない","m":"~하지 않을 수 없다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"すごく寒くて、暖房をつけ[ないではいられなかった]。","k":"매우 추워서, 난방을 켜지 않을 수 없었다."}]},{"day":28,"p":"～ないでもない","m":"~않는 것도 아니다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"気持は理解でき[ないでもない]が、さっきは君が悪かったと思う。","k":"마음은 이해할 수 없는 것도 아니지만, 아까는 네가 나빴다고 생각해."}]},{"day":28,"p":"～ないように","m":"~하지 않도록","g":"동사 뒤에 접속하는 문형","ex":[{"s":"公共の場では人に迷惑をかけ[ないように]注意しなさい。","k":"공공장소에서는 다른 사람에게 민폐를 끼치지 않도록 주의하세요."}]},{"day":28,"p":"～ずに","m":"~하지 않고","g":"동사 뒤에 접속하는 문형","ex":[{"s":"医者は何も食べ[ずに]薬を飲んではいけないと言った。","k":"의사는 아무것도 먹지 않고 약을 먹으면 안 된다고 했다."}]},{"day":28,"p":"～も…ば","m":"~만…이면","g":"동사 뒤에 접속하는 문형","ex":[{"s":"この本の厚さなら１日[もあれば]余裕で読み終える。","k":"이 책의 두께라면 하루만 있으면 여유롭게 다 읽는다."}]},{"day":28,"p":"～(よ)うとする","m":"(곧) ~하려고 하다","g":"동사 뒤에 접속하는 문형","ex":[{"s":"寝[ようとしたら]友達が遊びに来て全然眠れなかった。","k":"자려고 했는데 친구가 놀러 와서 전혀 잘 수 없었다."}]},{"day":28,"p":"～(よ)うものなら","m":"~했다가는","g":"동사 뒤에 접속하는 문형","ex":[{"s":"また失敗をし[ようものなら]、首になってしまうよ。","k":"또 실수를 했다가는, 해고당해 버릴 거야."}]},{"day":28,"p":"～以来","m":"~이래로","g":"명사와 동사 모두에 접속하는 문형","ex":[{"s":"事故[以来]、車に乗ることが怖くなってしまった。","k":"사고 이래로, 차에 타는 것이 무서워져버렸다."},{"s":"東京に来[て以来]、地元には一度も帰っていません。","k":"도쿄에 온 이래로, 고향에는 한 번도 돌아가지 않고 있습니다."}]},{"day":28,"p":"～うえで","m":"1. ~로 2. ~하는 데있어서 3. ~한뒤에","g":"명사와 동사 모두에 접속하는 문형","ex":[{"s":"夫婦は同じ姓を使用することが法律の[うえで]決められている。","k":"부부는 같은 성을 사용하는 것이 법률로 정해져 있다."},{"s":"学校生活を送る[うえで]友達と喧嘩しないことは重要である。","k":"학교생활을 보내는 데 있어서 친구와 싸우지 않는 것은 중요하다."},{"s":"安全だと判断し[たうえで]許可を出しています。","k":"안전하다고 판단한 뒤에 허가를 내어주고 있습니다."}]},{"day":28,"p":"～おそれがある","m":"~할우려가있다","g":"명사와 동사 모두에 접속하는 문형","ex":[{"s":"そのビルは崩壊の[おそれがある]ので、ただいま立ち入り禁止です。","k":"그 빌딩은 붕괴의 우려가 있으므로, 현재 출입 금지입니다."},{"s":"売上の減少が続くと、倒産する[おそれがある]。","k":"매상의 감소가 계속 ":"명사와 동사 모두에 접속하는 문형","ex":[{"s":"地球温暖化[にともなって]、世界各地で火災が増えている。","k":"지구온난화에 따라, 세계 각지에서 화재가 증가하고 있다."},{"s":"オリンピックを開催する[にともなって]競技場を改修した。","k":"올림픽을 개최함에 따라 경기장을 수리했다."}]},{"day":29,"p":"～うえに","m":"~인 데다가","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"そのデータは誤りである[うえに]測定方法も間違っていた。","k":"그 데이터는 잘못된 데다가 측정 방법도 틀렸다."},{"s":"彼はハンサムな[うえに]成績も優秀である。","k":"그는 잘생긴 데다가 성적도 우수하다."},{"s":"低気圧のせいで頭が痛い[うえに]吐き気までする。","k":"저기압 탓에 머리가 아픈 데다가 속까지 울렁거린다."},{"s":"ネットで調べた[うえに]、関連書籍も数冊読んでおきました。","k":"인터넷에서 조사한 데다가, 관련 서적도 몇 권 읽어뒀습니다."}]},{"day":29,"p":"～うちに","m":"~하는 동안에, ~사이에, ~내에, ~전에","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"世界の平均気温が21世紀の[うちに]５度も上昇するそうだ。","k":"세계 평균 기온이 21세기 동안에 5도나 상승한다고 한다."},{"s":"状況がこちらに有利な[うちに]少しでも多く得点を獲得しよう。","k":"상황이 이쪽에 유리한 사이에 조금이라도 많이 득점을 획득하자."},{"s":"早い[うちに]問題を解決するためにみんなで意見を出しましょう。","k":"빠른 시일 내에 문제를 해결하기 위해 모두 함께 의견을 냅시다."},{"s":"普段からパスワードは忘れない[うちに]メモに書いています。","k":"평소에 비밀번호는 잊기 전에 메모에 적어 둡니다."}]},{"day":29,"p":"～おかげで","m":"~덕분에","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"不登校だった私は、いい先生の[おかげで]無事卒業できた。","k":"등교거부하던 나는, 좋은 선생님 덕분에 무사히 졸업할 수 있었다."},{"s":"部屋が静かだった[おかげで]よい睡眠がとれて疲れが吹き飛んだ。","k":"방이 조용했던 덕분에 좋은 수면을 취할 수 있어서 피로가 날아갔다."},{"s":"校長の話が短かった[おかげで]早く集会が終わった。","k":"교장의 말이 짧았던 덕분에 일찍 집회가 끝났다."},{"s":"虫歯を抜いた[おかげで]痛みがなくなり快適な生活を手に入れた。","k":"충치를 뽑은 덕분에 아픔이 사라져 쾌적한 생활을 손에 넣었다."}]},{"day":29,"p":"～かぎり","m":"~하는 한","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"あの性格の[かぎり]秘密を隠しておくことはできなさそうだ。","k":"저 성격인 한 비밀을 숨겨두는 건 못 할 것 같다."},{"s":"実現可能である[かぎり]、私は夢を追いかけ続ける。","k":"실현 가능한 한, 나는 꿈을 계속 좇을 것이다."},{"s":"確実な証拠がない[かぎり]犯人として逮捕することは難しい。","k":"확실한 증거가 없는 한 범인으로서 체포하는 것은 어렵다."},{"s":"交通規制をする[かぎり]違反者の数は今後も増えないだろう。","k":"교통규제를 하는 한 위반자의 수는 앞으로도 늘지 않을 것이다."}]},{"day":29,"p":"～かというと/～かといえば","m":"~인가 하면, ~이냐 하면","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"深刻な悩み[かというと]そうでもないので、心配しないでください。","k":"심각한 고민인가 하면 그렇지도 않기 때문에, 걱정하지 말아주세요."},{"s":"家事が得意[かといえば]正直得意な方ではありません。","k":"집안일을 잘 하는가 하면 솔직히 잘하는 편은 아니에요."},{"s":"暇だから見ているだけで面白い[かといえば]特別面白くはない。","k":"한가하니까 보고 있는 것뿐으로 재미있냐 하면 특별히 재미있지는 않다."},{"s":"なんで約束に遅刻した[かというと]30分寝坊したからです。","k": だけのことはある]。","k":"그녀의 통역을 보면, 유학한 만큼의 가치는 있다."}]},{"day":29,"p":"～てしょうがない","m":"매우 ~하다, ~해서 어쩔 수가 없다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"手続きに必要な書類が複雑すぎて厄介[でしょうがない]。","k":"수속에 필요한 서류가 너무 복잡해서 매우 번거롭다."},{"s":"おばあさんが亡くなったことが悲しく[てしょうがない]。","k":"할머니가 돌아가시게 된 것이 매우 슬프다."},{"s":"テレビ番組のクイズの正解が気になっ[てしょうがない]。","k":"텔레비전 프로그램 퀴즈의 정답이 궁금해서 어쩔 수가 없다."}]},{"day":29,"p":"～てたまらない","m":"~해서 견딜 수 없다, 너무 ~하다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"来月行われる大会の予選のことを考えると不安[でたまらない]。","k":"다음 달에 실시되는 대회 예선을 생각하면 너무 불안해서 견딜 수 없다."},{"s":"私の手をぎゅっと握る赤ちゃんがかわいく[てたまらない]。","k":"나의 손을 꼭 쥐는 아기가 너무 귀엽다."},{"s":"人の悪口ばかり言う彼を見ていると、腹が立っ[てたまらない]。","k":"다른 사람의 흉만 보는 그를 보고 있으면, 화가 나서 견딜 수 없다."}]},{"day":29,"p":"～てならない","m":"너무 ~하다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"息子がちゃんと一人暮らしできるかどうか心配[でならない]。","k":"아들이 제대로 혼자 살 수 있을지 너무 걱정이다."},{"s":"大学のサークル勧誘があまりにもしつこく[てならない]。","k":"대학의 동아리 권유가 너무 집요하다."},{"s":"うちの犬は注射が苦手で、動物病院に行くのを嫌がっ[てならない]。","k":"우리 개는 주사를 싫어해서, 동물 병원에 가는 것을 너무 싫어한다."}]},{"day":29,"p":"～というから","m":"~라고 하니까","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"何事も初めが肝心[というから]、さっそく元旦に新年の計画を立てた。","k":"어떤 일도 처음이 중요하다고 하니까, 즉시 설날에 신년의 계획을 세웠다."},{"s":"彼女は甘いものが好きだ[というから]、ケーキを作ってプロポーズした。","k":"그녀는 단 것을 좋아한다고 하니까, 케이크를 만들어 프러포즈 했다."},{"s":"お弁当だけでは物足りない[というから]おにぎりも持たせた。","k":"도시락만으로는 뭔가 부족하다고 하니까 주먹밥도 가지고 가게 했다."},{"s":"いつかは機会が訪れる[というから]気長に待つことにしました。","k":"언젠가는 기회가 찾아온다고 하니까 찬찬히 기다리기로 했습니다."}]},{"day":29,"p":"～というのは","m":"~라는 것은","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"パソコン[というのは]パーソナルコンピューターのことである。","k":"PC라는 것은 퍼스널 컴퓨터를 말한다."},{"s":"彼がたいくつだった[というのは]その表情からすぐにわかりました。","k":"그가 지루해 했다는 것은 그 표정에서 바로 알았습니다."},{"s":"騒がしい[というのは]まさにあの人のことを指す言葉だ。","k":"소란스럽다라는 것은 정말로 저 사람을 가리키는 말이다."},{"s":"自分の過ちを認める[というのは]そう簡単にできることではない。","k":"자신의 과오를 인정한다는 것은 그렇게 간단하게 할 수 있는 것은 아니다."}]},{"day":29,"p":"～というものだ","m":"~라는 것이다, ~인 법이다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"何があっても子供を一番に考えるのが親[というものだ]。","k":"무슨 일이 있어도 아이를 제일로 생각하는 것이 부모라는 것이다."},{"s":"困っている人がいれば助けるのが人として当たり前[というものだ]。","k":"곤란해하고 있는 사람이 있으면 돕는 것이 사람으로서 당연한 것이다."},{"s":"気持ちを正直に話すことは大人でも難しい[というものだ]。","k":"기분을 정직하게 말하는 것은 어른이라도 어려운 법이다."},{"s":"経験したことも時間が経てばやがては忘れる[というものだ]。","k":"경험한 것도 시간이 지나면 얼마 안 있어 잊어버리는 법이다."}]},{"day":29,"p":"～というように","m":"~라는 식으로, ~라는 것처럼","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"一つ仕上げるのに５時間[というように]時間を定めて仕事をしている。","k":"하나를 완성하는 데 5시간이라는 식으로 시간을 정해서 일을 하고 있다."},{"s":"友達は何かが心配だ[というように]ため息ばかりついている。","k":"친구는 뭔가가 걱정인 것처럼 한숨만 쉬고 있다."},{"s":"女の子は嬉しい[というように]にっこりと微笑んでいた。","k":"여자아이는 기쁜 것처럼 방긋 미소 짓고 있었다."},{"s":"部下は納得いかない[というように]不満そうな表情をしていた。","k":"부하는 납득이 되지 않는다는 것처럼 불만인듯한 표정을 하고 있었다."}]},{"day":30,"p":"～というより","m":"~라기 보다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"彼の人生話を聞いて、共感[というより]憧れを抱いた。","k":"그의 인생 이야기를 듣고, 공감이라기보단 동경을 품었다."},{"s":"文字を読むのが面倒だ[というより]興味がないので本は読まない。","k":"글을 읽는 것이 귀찮다기보다 흥미가 없어서 책은 읽지 않는다."},{"s":"この味噌汁は塩辛い[というより]むしろ水っぽい。","k":"이 된장국은 짜다기보다 오히려 싱겁다."},{"s":"先週の議会は話し合う[というより]もはや喧嘩に近かった。","k":"지난주 의회는 의논한다기보다 어느새 싸움에 가까웠다."}]},{"day":30,"p":"～というわけだ","m":"~인 셈이다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"その単語がなぞを解くキーワードだ[というわけだ]。","k":"그 단어가 수수께끼를 풀 키워드인 셈이다."},{"s":"首相が大阪を訪問中だから警備が厳重だ[というわけだ]。","k":"수상이 오사카를 방문 중이니까 경비가 엄중한 셈이다."},{"s":"この品質とサービスから見ると安い[というわけだ]。","k":"이 품질과 서비스로 보면 저렴한 셈이다."},{"s":"実家が近いから他支店に転勤を希望していた[というわけだ]。","k":"집이 가깝기 때문에 타 지점으로 전근을 희망하고 있었던 셈이다."}]},{"day":30,"p":"～どころか","m":"~는커녕","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"私はゲームの操作[どころか]電源のつけ方すら分からない。","k":"나는 게임의 조작은커녕 전원을 켜는 방법조차 모른다."},{"s":"あの日の記憶は曖昧な[どころか]何ひとつ覚えていません。","k":"그 날의 기억은 모호하기는커녕 아무것도 기억나지 않아요."},{"s":"彼は足が遅い[どころか]、学年で一番速いことで有名です。","k":"그는 다리가 느리기는커녕, 학년에서 가장 빠르기로 유명합니다."},{"s":"彼は手伝う[どころか]、妨害しようとだけしている。","k":"그는 돕기는커녕, 방해하려고만 하고 있다."}]},{"day":30,"p":"～としたら","m":"~라고 한다면","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"もしこの気持ちが恋だ[としたら]、どきどきするのも説明がつく。","k":"만약 이 마음이 사랑이라고 한다면, 두근두근 하는 것도 설명이 된다."},{"s":"この犬が利口だ[としたら]、飼い主が倒れたら助けを呼ぶだろう。","k":"이 개가 영리하다고 한다면, 주인이 쓰러지면 도움을 요청할 것이다."},{"s":"その仮説が正しい[としたら]、日本の経済は今後さらに低迷する。","k":"그 가설이 옳다고 한다면, 일본의 경제는 앞으로 더 침체된다."},{"s":"一年に20パーセントずつ成長する[としたら]、５年で２倍になる。","k":"1년에 20퍼센트씩 성장한다고 한다면, 5년이면 2배가 된다."}]},{"day":30,"p":"～とする","m":"~라고하다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"財布を落としたのが駅だ[として]駅に届いているかはわからない。","k":"지갑을 잃어버린 것이 역이라고 해서 역에 있을지는 모른다."},{"s":"その記事が本当だ[とする]と人類はもうすぐ月に行けるようになる。","k":"그 기사가 진짜라고 하면 인류는 이제 곧 달에 갈 수 있게 된다."},{"s":"目的地までの道のりが遠い[とする]と、ここで一度休んでおくべきだ。","k":"목적지까지 길이 멀다고 하면, 여기서 한번 쉬어둬야 한다."},{"s":"息子のお小遣いを増やす[とする]と、家計を見直す必要がある。","k":"아들의 용돈을 늘린다고 하면, 가계를 다시 볼 필요가 있다."}]},{"day":30,"p":"～とは言うものの","m":"~라고는하지만","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"週末[とは言うものの]、仕事がたくさんあって休めなかった。","k":"주말이라고는 하지만, 일이 많이 있어서 쉴 수 없었다."},{"s":"気の毒[とは言うものの]、誰もその青年に手を差し伸べはしない。","k":"안쓰럽다고는 하지만, 아무도 그 청년에게 손을 내밀지는 않는다."},{"s":"怖い[とは言うものの]、同時に興味があるというのも事実だ。","k":"무섭다고는 하지만, 동시에 흥미가 있다는 것도 사실이다."},{"s":"予算を増やす[とは言うものの]、どこから資金を補うかは不明だ。","k":"예산을 늘린다고는 하지만, 어디에서 자금을 보충할지는 분명치 않다."}]},{"day":30,"p":"～とは限らない","m":"() ~꼭하다고는할수없다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"誰も進まない道だとしても、それが間違いだ[とは限らない]。","k":"아무도 가지 않는 길이라고 해도, 그것이 틀렸다고는 할 수 없다."},{"s":"国民の総所得が高いからといって全国民が豊かだ[とは限らない]。","k":"국민의 종합소득이 높다고 해서 전 국민이 풍족하다고는 할 수 없다."},{"s":"一人でいることが必ずしも寂しい[とは限らない]。","k":"혼자서 있는 것이 반드시 외롭다고는 할 수 없다."},{"s":"医者とは言え、すべての病気が分かる[とは限らない]。","k":"의사라고는 해도, 모든 병을 안다고는 할 수 없다."}]},{"day":30,"p":"～ながらも","m":"~이지만","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"私の宿題[ながらも]、友人がほとんどの問題を解いてくれた。","k":"나의 숙제지만, 친구가 대부분의 문제를 풀어주었다."},{"s":"不器用[ながらも]心の優しい兄は私の自慢です。","k":"서투르지만 마음씨가 상냥한 오빠는 나의 자랑이다."},{"s":"苦しい[ながらも]1キロを泳ぎきったことは彼の自信になった。","k":"힘들지만 1킬로미터를 다 헤엄친 것은 그의 자신감이 되었다."},{"s":"あのサッカー選手は怪我し[ながらも]最後まで走った。","k":"저 축구 선수는 부상당했지만 마지막까지 뛰었다."}]},{"day":30,"p":"～なければいけない/～なければならない","m":"~해야 한다, ~하지 않으면 안 된다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"気持ちを伝えるにはメールじゃなく手紙で[なければいけない]。","k":"마음을 전달할 때는 메일이 아니라 편지로 해야 한다."},{"s":"教師になりたければ教育に対して熱心じゃ[なければいけない]。","k":"교사가 되고 싶으면 교육에 대해 열심이지 않으면 안 된다."},{"s":"地元で一番の進学校に行くためには賢く[なければならない]。","k":"이 지역에서 제일인 학교에 가기 위해서는 똑똑해야 한다."},{"s":"どうにかしてみんなで彼女を慰める方法を考え[なければならない]。","k":"어떻게 해서라도 다 같이 그녀를 위로할 방법을 생각해야 한다."}]},{"day":30,"p":"～なりに","m":"~나름대로, ~대로","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"結果はついてこなかったけど、彼[なりに]頑張ったと思う。","k":"결과는 따라주지 않았지만, 그 나름대로 열심히 했다고 생각한다."},{"s":"テニスは下手だが下手[なりに]人一倍練習を積み重ねてきた。","k":"테니스는 서투르지만 서투른 대로 남보다 배로 연습을 거듭해왔다."},{"s":"所得が低い[なりに]節約をしながら生活をしている。","k":"소득이 낮은 대로 절약하면서 생활을 하고 있다."},{"s":"検定試験を受けるなら受ける[なりに]対策をしないといけない。","k":"검정시험을 친다면 치는 나름대로 대책을 세우지 않으면 안 된다."}]},{"day":30,"p":"～に決まっている","m":"~임에 틀림없다, ~인 것이 당연하다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"初めての給料で買うものといえば、両親へのプレゼント[に決まっている]。","k":"첫 월급으로 사는 거라고 하면, 부모님 선물임에 틀림없다."},{"s":"昨夜から何も口にしていないのだからぺこぺこ[に決まっている]。","k":"어제 밤부터 아무것도 먹지 않고 있으니 배고픈 것이 당연하다."},{"s":"10キロもあるお米を持っているんだから重い[に決まっている]。","k":"10킬로그램이나 되는 쌀을 들고 있으니까 무거운 것이 당연하다."},{"s":"夫は動物が大嫌いで、犬を飼いたいと言ったら反対する[に決まっている]。","k":"남편은 동물을 매우 싫어해서, 개를 키우고 싶다고 하면 반대할 것임이 틀림없다."}]},{"day":30,"p":"～に越したことはない","m":"~더 좋은 것은 없다, ~해서 나쁠 건 없다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"絶対ではないが、依頼するのが専門家である[に越したことはない]。","k":"절대는 아니지만, 의뢰하는 것이 전문가여서 나쁠 건 없다."},{"s":"手術後の経過が順調であるの[に越したことはない]。","k":"수술 후의 경과가 순조로운 것보다 더 좋은 것은 없다."},{"s":"参考資料が足りないのは困るが、多い[に越したことはない]。","k":"참고 자료가 부족한 것은 곤란하지만, 많은 건 나쁠 게 없다."},{"s":"健康になるためには運動する[に越したことはない]。","k":"건강해지기 위해서는 운동하는 것보다 더 좋은 것은 없다."}]},{"day":30,"p":"～にしては","m":"~치고는","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"アメリカ人[にしては]日本語の発音がいい。","k":"미국인 치고는 일본어 발음이 좋다."},{"s":"でたらめ[にしては]あまりにも話に真実味があるように思う。","k":"엉터리 치고는 너무나 이야기에 진실성이 있는 것처럼 생각된다."},{"s":"遅くまでコーヒーを飲んでいた[にしては]すぐに眠りにつけた。","k":"늦게까지 커피를 마신 거 치고는 바로 잠이 들었다."}]},{"day":30,"p":"～にしても","m":"(가령) ~라고 해도","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"彼[にしても]こんなに難しいとは思わなかったはずだ。","k":"그라고 해도 이렇게 어려울 거라고는 생각하지 않았을 것이다."},{"s":"いくらかばんが邪魔[にしても]、手ぶらで行くわけにはいかない。","k":"아무리 가방이 방해라고 해도, 맨손으로 갈 수는 없다."},{"s":"眠いのは仕方ない[にしても]やるべきことは先に終わらせないと。","k":"졸린 것은 어쩔 수 없다고 해도 해야 할 것은 먼저 끝내야 한다."},{"s":"仮にデータが消えてしまっていた[にしても]、保存してあるので問題ありません。","k":"만약 데이터가 사라져버렸다고 해도, 보존되어 있으니까 문제없어요."}]},{"day":30,"p":"～にすぎない","m":"~에 불과하다, ~에 지나지 않는다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"19世紀に10億[にすぎなかった]人口は今や60億を超えた。","k":"19세기에 10억에 불과했던 인구는 이제는 60억을 넘었다."},{"s":"信号無視による事故でないことのみが明らかである[にすぎない]。","k":"신호 무시에 의한 사고가 아닌 것만이 분명함에 지나지 않는다."},{"s":"実力不足というより、ただ相手が私たちより上手かった[にすぎない]。","k":"실력 부족이라기보다, 그냥 상대가 우리보다 잘했던 것에 불과하다."},{"s":"企業の戦略の一環として、一部人員を削減した[にすぎない]。","k":"기업 전략의 일환으로써, 일부 인원을 삭감한 것에 지나지 않는다."}]},{"day":30,"p":"～にせよ/～にもせよ","m":"~라고 해도","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"たとえ嘘[にせよ]、人を傷つけるような発言は控えるべきだ。","k":"설령 거짓말이라고 해도, 사람을 상처 주는 듯한 발언은 삼가 해야 한다."},{"s":"どれほど心配[にせよ]、われわれにできることは残されていません。","k":"아무리 걱정이라 해도, 우리가 할 수 있는 일은 남아있지 않아요."},{"s":"どれほど若々しい[にせよ]、実際の年齢をあざむくことはできない。","k":"아무리 풋풋하다고 해도, 실제 나이를 속일 수는 없다."},{"s":"手術は終わった[にせよ]、しばらく安静が必要です。","k":"수술이 끝났다고 해도, 당분간 안정이 필요합니다."}]},{"day":30,"p":"～にちがいない","m":"~임에 틀림없다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"あの人は筋肉がすごい。きっと運動選手[にちがいない]。","k":"저 사람은 근육이 엄청나다. 분명 운동선수임에 틀림없다."},{"s":"臭いも受け付けないのをみると、彼女は納豆が苦手[にちがいない]。","k":"냄새도 받아들이지 않는 것을 보면, 그녀는 낫토를 꺼려함에 틀림없다."},{"s":"あの人はいつも何かを心配しているので、用心深い[にちがいない]。","k":"저 사람은 항상 뭔가를 걱정하고 있으니까, 조심성이 많음에 틀림없다."},{"s":"上司は朝から顔色が悪かったから、早退する[にちがいない]。","k":"상사는 아침부터 얼굴색이 나빴기 때문에, 조퇴할 것임에 틀림없다."}]},{"day":30,"p":"～にとどまらず","m":"~에 그치지 않고","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"火事の被害は火元の１階[にとどまらず]、建物全体に及んでいる。","k":"화재 피해는 발화지점인 1층에 그치지 않고, 건물 전체에 미쳤다."},{"s":"情報源が不確かなだけ[にとどまらず]、真実かどうかすらも不明だ。","k":"정보원이 불확실함에 그치지 않고, 진실인지 어떤지조차 불명하다."},{"s":"後輩はそそっかしいだけ[にとどまらず]、やかましいところもある。","k":"후배는 경솔한 것에 그치지 않고, 요란한 구석도 있다."},{"s":"問題点を追求する[にとどまらず]、解決へと導く姿勢が必要だ。","k":"문제점을 추구하는 것에 그치지 않고, 해결로 이끄는 자세가 필요하다."}]},{"day":30,"p":"～にもかかわらず","m":"~에도 불구하고","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"多数の反対[にもかかわらず]、法案は通過してしまった。","k":"다수의 반대에도 불구하고, 법안은 통과되어 버렸다."},{"s":"定期券はまだ有効[にもかかわらず]、改札を通れなかった。","k":"정기권은 아직 유효함에도 불구하고, 개찰구를 통과할 수 없었다."},{"s":"締め切り間近で忙しい[にもかかわらず]余裕そうに見える。","k":"마감 직전에 바쁨에도 불구하고 여유로워 보인다."},{"s":"独特な髪色で目立っている[にもかかわらず]一切気に留めない。","k":"독특한 머리 색으로 눈에 띄고 있음에도 불구하고 일절 개의치 않는다."}]},{"day":30,"p":"～のみならず","m":"~뿐만 아니라","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"コンサート会場[のみならず]周辺までもファンで覆いつくされた。","k":"콘서트 회장 뿐만 아니라 주변까지도 팬으로 덮였다."},{"s":"実用的[のみならず]経済的な製品は主婦に好まれる傾向がある。","k":"실용적일 뿐만 아니라 경제적인 제품은 주부에게 선호 받는 경향이 있다."},{"s":"その大学は入試が難しい[のみならず]学費が高いことで有名だ。","k":"그 대학은 입시가 어려울 뿐만 아니라 학비도 비싼 걸로 유명하다."},{"s":"犯人を取り逃がす[のみならず]、証拠資料も紛失してしまった。","k":"범인을 놓쳤을 뿐만 아니라, 증거 자료도 분실해 버렸다."}]},{"day":30,"p":"～ばかりに","m":"~탓에, ~바람에","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"想像以上に快適な入院生活である[ばかりに]退院する気がなくなった。","k":"상상이상으로 쾌적한 입원생활인 바람에 퇴원할 마음이 없어졌다."},{"s":"便利な[ばかりに]現代人はスマートフォンに依存しがちである。","k":"편리한 탓에 현대인은 스마트폰에 의존하기 십상이다."},{"s":"彼は言葉が足りない[ばかりに]人に誤解されやすい。","k":"그는 말이 부족한 탓에 다른 사람에게 오해받기 쉽다."},{"s":"彼を信じてしまった[ばかりに]裏切られて悲しい思いをした。","k":"그를 믿어버린 탓에 배신당해서 슬픔을 느꼈다."}]},{"day":30,"p":"～はずだ","m":"(당연히) ~일 것이다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"あんなにしっかりした性格だから、彼はきっと長男の[はずだ]。","k":"저렇게 똑 부러지는 성격이니까, 그는 반드시 장남일 것이다."},{"s":"ご褒美があるとすればもっと一生懸命な[はずだ]。","k":"보상이 있다고 하면 더 열심일 것이다."},{"s":"もし排水溝に生ごみが溜まっていたらたぶん生臭い[はずだ]。","k":"만약 배수구에 음식물 쓰레기가 남아 있으면 아마 비린내가 날 것이다."},{"s":"彼は意地でもその株式を売ろうとはしない[はずだ]。","k":"그는 오기로라도 그 주식을 팔려고 하지 않을 것이다."}]},{"day":30,"p":"～はずがない/～はずもない","m":"~리가 없다","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"昼間から遊んでいるところからして彼が会社員の[はずがない]。","k":"낮부터 놀고 있는 점으로 봐서 그는 회사원일 리가 없다."},{"s":"いつも部屋が汚いのをみると親友は片づけが得意な[はずがない]。","k":"항상 방이 더러운 것을 보면 친구는 정리를 잘할 리가 없다."},{"s":"焼いてから１日経ってしまったおもちが柔らかい[はずもない]。","k":"굽고 나서 하루 지나버린 떡이 부드러울 리가 없다."},{"s":"まじめな山田さんにそんなことができる[はずもない]。","k":"성실한 야마다 씨에게 그런 일이 가능할 리 없어."}]},{"day":30,"p":"～ままで","m":"~인 채로, ~한 채로","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"大人になんかならずに、いつまでも子供の[ままで]いたいと願う。","k":"어른이 되지 않고, 언제까지나 어린아이인 채로 있고 싶다고 바란다."},{"s":"公衆トイレを常に清潔な[ままで]保つのは容易ではありません。","k":"공중 화장실을 항상 청결한 채로 유지하는 것은 쉽지 않습니다."},{"s":"あの子は昔から可愛い[ままで]何ひとつ変わっていない。","k":"저 아이는 옛날부터 귀여운 채로 하나도 변하지 않았다."},{"s":"クーラーをつけた[ままで]出かけて、お母さんに怒られた。","k":"에어컨을 켠 채로 나가서, 엄마에게 혼났다."}]},{"day":30,"p":"～もかまわず","m":"~도 개의치 않고","g":"여러 품사 뒤에 접속하는 문형","ex":[{"s":"お母さんは人目[もかまわず]、スーパーで子供をしかっている。","k":"엄마는 사람 눈도 개의치 않고, 슈퍼에서 아이를 야단치고 있다."},{"s":"若者は親が反対なの[もかわまず]アメリカへの留学を決めた。","k":"젊은이는 부모가 반대하는 것도 개의치 않고 미국으로의 유학을 결정했다."},{"s":"周りがうるさいの[もかまわず]必死に試験範囲を復習していた。","k":"주위가 시끄러운 것도 개의치 않고 필사적으로 시험 범위를 복습하고 있었다."},{"s":"服に汚れがつくの[もかまわず]、一生懸命に掃除を手伝っている。","k":"옷에 때가 묻는 것도 개의치 않고, 열심히 청소를 돕고 있다."}]},{"day":30,"p":"～ものだ","m":"~인 법이다","g":"여러 function romaToHira(input){
  let s = input.toLowerCase(), out = '', i = 0;
  while (i < s.length) {
    const c = s[i];

const DAKU = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};

function mutations(r){

  [...h].forEach((c, idx) => {
    if (DAKU[c]) out.add(h.slice(0, idx) + DAKU[c] + h.slice(idx+1));

  h.replace(/っ/g, (m, idx) => { out.add(h.slice(0, idx) + 'つ' + h.slice(idx+1)); out.add(h.slice(0, idx) + h.slice(idx+1)); return m; });

  const others = shuffle(WORDS.filter(w => w.id !== word.id && w.w !== word.w && Math.abs(w.r.length - word.r.length) <= 2)).map(w => w.r);
  for (const o of others) { if (pool.size >= 3) break; if (o !== ans) pool.add(o); }

// ---------- 음성(TTS) 공통 모듈: よん·れん 빌드 시 주입 ----------
// iOS 사파리 주의점
//  1) speak()는 사용자 터치 처리 중에 "동기적으로" 호출해야 함. Promise/setTimeout을 거치면 무음이 될 수 있음.
//  2) getVoices()는 처음엔 빈 배열일 수 있고, OS 업데이트 직후엔 한참 뒤에 채워지기도 함 → 매번 새로 읽고 voiceschanged를 계속 구독.
//  3) 저장해 둔 음성이 사라졌거나(업데이트로 URI 변경) 재생에 실패하면 기본 음성(lang만 지정)으로 자동 재시도.
// 고품질(Premium/Enhanced/Siri) 음성이 웹에 노출되는지는 iOS 버전에 따라 다름 → 목록에서 직접 고를 수 있게 함.
function makeTTS(opt){
  // opt: {lang:'ja-JP', store, T:{...문구}}
  const prefix = opt.lang.slice(0, 2).toLowerCase();
  const T = opt.T;
  const has = () => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch(e) { return false; } };
  let all = [], voices = [];
  const norm = l => String(l || '').replace('_', '-').toLowerCase();
  function refresh(){
    try { all = has() ? (speechSynthesis.getVoices() || []) : []; } catch(e) { all = []; }
    voices = all.filter(v => norm(v.lang).startsWith(prefix));
    return voices;
  }
  const listeners = new Set();
  if (has()) {
    const onChange = () => { refresh(); listeners.forEach(f => { try { f(); } catch(e) {} }); };
    try { speechSynthesis.addEventListener('voiceschanged', onChange); } catch(e) { try { speechSynthesis.onvoiceschanged = onChange; } catch(_) {} }
  }
  // 첫 목록 로딩 대기(최대 3초, 0.25초 간격 재확인)
  const ready = new Promise(res => {
    if (!has()) return res([]);
    if (refresh().length) return res(voices);
    let n = 0;
    const iv = setInterval(() => { if (refresh().length || ++n >= 12) { clearInterval(iv); res(voices); } }, 250);
  });

  // 장난감 음성(Eloquence 등)은 감점
  const NOVELTY = /(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox)/i;
  const idOf = v => ((v.voiceURI || '') + ' ' + (v.name || '')).toLowerCase();
  function score(v){
    const id = idOf(v);
    let s = 0;
    if (/siri/.test(id)) s += 35;
    if (/premium|プレミアム|프리미엄/.test(id)) s += 30;
    if (/enhanced|拡張|고품질|향상/.test(id)) s += 20;
    if (/google|microsoft|natural|neural/.test(id)) s += 12;
    if (/compact/.test(id)) s -= 5;
    if (NOVELTY.test(id)) s -= 40;
    if (v.localService) s += 1;
    if (norm(v.lang) === norm(opt.lang)) s += 2;
    return s;
  }
  const ranked = () => voices.slice().sort((a, b) => score(b) - score(a));
  const savedURI = () => { try { return opt.store.get('voiceURI', null); } catch(e) { return null; } };
  const savedMissing = () => { const u = savedURI(); return !!(u && voices.length && !voices.some(v => v.voiceURI === u)); };

    refresh();
    const uri = savedURI();

  }

  let seq = 0;

    if (!has() || !text) return;
    const my = ++seq;
    try {
      const ss = speechSynthesis;
      if (ss.speaking || ss.pending) ss.cancel();
      try { ss.resume(); } catch(e) {}           // iOS에서 일시정지 상태로 멈춰 있는 경우 대비

      u.lang = (voice && voice.lang) || opt.lang;
      u.rate = rate();
      if (voice) { try { u.voice = voice; } catch(e) { u.lang = opt.lang; } }   // 깨진 음성 객체면 기본 음성으로
      let started = false, retried = false;
      const retry = () => {
        if (retried || isRetry || my !== seq) return;   // 그사이 다른 재생을 눌렀으면 재시도 안 함   // 기본 음성으로 한 번만 재시도
        retried = true;
        try { speechSynthesis.cancel(); } catch(e) {}
        speakNow(text, null, true);
      };
      u.onstart = () => { started = true; };
      u.onerror = e => { const er = e && e.error; if (!started && er !== 'interrupted' && er !== 'canceled') retry(); };
      ss.speak(u);
