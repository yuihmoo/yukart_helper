  current:'今の学習記録(よん・れん 全体)', lastBackup:'前回のバックアップ', manual:'ファイルに書き出し・読み込み', exportBtn:'⬇︎ 書き出す', importBtn:'⬆︎ 読み込む',
  manualNote:'よん・れんの暗記チェック、間違いノート、復習スケジュール、最高点、設定が1つのファイルに保存されます。iPhoneでは共有画面の<b>「ファイルに保存」</b>を選んでください。別の端末で読み込めば記録を移せます。',
  undo:'↺ 読み込む前に戻す', auto:'自動バックアップ', autoOn:'オン — 記録が変わるたびに指定したファイルへ自動保存', lastAuto:'前回の自動保存', changeFile:'保存先を変更', stopAuto:'自動バックアップをオフ',
  autoPausedMsg:'ブラウザを開き直すと、安全のため一度だけ許可が必要です。下のボタンを押すと自動保存を続けます。',
  autoNote:'パソコンのChrome・Edgeでは、バックアップファイルを一度指定すれば、勉強するたびにそのファイルが自動で更新されます。(Googleドライブ・OneDriveの同期フォルダに置けばクラウドにも自動保管)', chooseFile:'自動バックアップ先を指定',
  autoUnsupported:'このブラウザ(iPhone・Safariなど)は安全のためファイルを自動保存できません。代わりに前回のバックアップから{n}日経つとホームにお知らせを出します。', confirmStop:'自動バックアップをオフにしますか?(保存済みのファイルはそのまま残ります)', syncTitle:'自宅PCと同期', syncNote:'自宅PCで同期サーバー(kotoba_sync)を動かしておくと、学習記録がPCのSQLiteファイルに自動保存され、iPhone・PCどちらで開いても同じ記録が続きます。サーバーのアドレスとユーザートークンを入力してください。',
  syncUrl:'サーバーのアドレス(例: https://PC名.xxxx.ts.net)', syncToken:'ユーザートークン', syncSave:'接続を確認して保存', syncNow:'今すぐ同期', syncOff:'接続を解除', syncOn:'接続中', syncUser:'ユーザー',
  syncLast:'前回の同期', syncErr:'エラー', syncBadUrl:'https:// で始まるアドレスを入力してください。(PC内でのテストのみ http://localhost 可)', syncFail:'サーバーに接続できませんでした。PCとサーバーが起動しているか、Tailscaleが接続されているか確認してください。',
  syncAuth:'トークンが正しくありません。', syncOk:'接続しました。これから自動で同期します。', confirmSyncOff:'同期を解除しますか?(この端末とPCの記録はそのまま残ります)', bannerSync:'自宅PCと{n}日間同期できていません。', syncOpen:'確認'}
};
function makeBackup(opt){
  const T = opt.T, esc = opt.esc;
  const KEY_RE = /^(n2|n2m|ren):[\w.-]+$/;           // 백업에 포함할 키 (bk:는 백업 자체 상태라 제외)
  const APPS = {'n2m': 'よん', 'n2': 'よん 기출', 'ren': 'れん'};
  const REMIND_DAYS = 7, DAY = 864e5;
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e) { return false; } },
    del(k){ try { localStorage.removeItem(k); } catch(e) {} },
    keys(){ try { return Object.keys(localStorage); } catch(e) { return []; } }
  };
  const now = () => Date.now();
  const fmt = t => { if (!t) return T.never; const d = new Date(+t); const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

  function collect(){
    const data = {};
    for (const k of ls.keys()) if (KEY_RE.test(k)) { const v = ls.get(k); if (v != null) data[k] = v; }
    return data;
  }
  // 실제 학습 기록이 있는지(테마·음성 설정만 있는 경우는 백업 알림 대상 아님)
  const hasLearning = data => Object.keys(data).some(k => /:(memo|wrong|srs|best|gbest)$/.test(k) && data[k] && data[k].length > 4);
  function summary(data){
    const c = {};
    for (const k of Object.keys(data)) { const app = k.split(':')[0]; c[app] = (c[app] || 0) + 1; }
    const memo = k => { try { return (JSON.parse(data[k] || '[]') || []).length; } catch(e) { return 0; } };
    return Object.keys(APPS).filter(a => c[a]).map(a => `${APPS[a]}: ${T.memo} ${memo(a + ':memo')} · ${T.wrong} ${memo(a + ':wrong')}`).join('\n') || T.empty;
  }
  function payload(){
    return JSON.stringify({app: 'kotoba-backup', version: 1, savedAt: new Date().toISOString(), data: collect()}, null, 1);
  }
  const fileName = () => { const d = new Date(), p = n => String(n).padStart(2, '0');
    return `kotoba-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; };

  // ---------- 내보내기 ----------
  async function exportFile(){
    const text = payload(), name = fileName();
    const blob = new Blob([text], {type: 'application/json'});
    try {
      const file = new File([blob], name, {type: 'application/json'});
      // 아이폰(홈 화면 앱)은 다운로드가 막히는 경우가 있어 공유 시트(파일에 저장)를 우선 사용
      if (/iP(hone|ad|od)/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file], title: name});
        ls.set('bk:lastExport', String(now())); return true;
      }
    } catch(e) { if (e && e.name === 'AbortError') return false; }   // 사용자가 공유 창을 닫음
    try {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      ls.set('bk:lastExport', String(now())); return true;
    } catch(e) { alert(T.exportFail); return false; }
  }

  // ---------- 불러오기 ----------
  function parse(text){
    let j; try { j = JSON.parse(text); } catch(e) { throw new Error(T.badFile); }
    if (!j || j.app !== 'kotoba-backup' || typeof j.data !== 'object' || Array.isArray(j.data)) throw new Error(T.badFile);
    const data = {};
    for (const [k, v] of Object.entries(j.data)) {
      if (!KEY_RE.test(k) || typeof v !== 'string' || v.length > 2e6) continue;   // 모르는 키·이상한 값은 무시
      try { JSON.parse(v); } catch(e) { continue; }
      data[k] = v;
    }
    if (!Object.keys(data).length) throw new Error(T.badFile);
    return {data, savedAt: j.savedAt};
  }
  function apply(data){
    ls.set('bk:undo', JSON.stringify(collect()));        // 실수로 덮어써도 되돌릴 수 있게 직전 상태 보관
    for (const k of ls.keys()) if (KEY_RE.test(k)) ls.del(k);
    let fail = 0;
    for (const [k, v] of Object.entries(data)) if (!ls.set(k, v)) fail++;
    return fail;
  }
  function importFile(file){
    return new Promise(res => {
      if (!file) return res(false);
      if (file.size > 10 * 1024 * 1024) { alert(T.badFile); return res(false); }
      const r = new FileReader();
      r.onerror = () => { alert(T.badFile); res(false); };
      r.onload = () => {
        try {
          const {data, savedAt} = parse(String(r.result));
          if (!confirm(`${T.confirmImport}\n\n${T.backupDate}: ${savedAt ? fmt(Date.parse(savedAt)) : '?'}\n${summary(data)}`)) return res(false);
          const fail = apply(data);
          alert(fail ? T.importPartial : T.importDone);
          res(true); location.reload();
        } catch(e) { alert(e.message || T.badFile); res(false); }
      };
      r.readAsText(file);
    });
  }
  function undo(){
    const v = ls.get('bk:undo'); if (!v) return;
    let data; try { data = JSON.parse(v); } catch(e) { return; }
    if (!confirm(T.confirmUndo)) return;
    for (const k of ls.keys()) if (KEY_RE.test(k)) ls.del(k);
    for (const [k, val] of Object.entries(data || {})) if (KEY_RE.test(k) && typeof val === 'string') ls.set(k, val);
    ls.del('bk:undo'); location.reload();
  }

  // ---------- 자동 저장 (File System Access API: 크롬·엣지 PC) ----------
  const FS_OK = typeof window.showSaveFilePicker === 'function';
  const idb = (() => {
    let p = null;
    const open = () => p || (p = new Promise((res, rej) => {
      try { const q = indexedDB.open('kotoba-backup', 1);
        q.onupgradeneeded = () => q.result.createObjectStore('kv');
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      } catch(e) { rej(e); }
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('kv', mode), s = t.objectStore('kv'), r = fn(s);
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    }));
    return {get: k => tx('readonly', s => s.get(k)).catch(() => null),
            set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => null),
            del: k => tx('readwrite', s => s.delete(k)).catch(() => null)};
  })();
  let handle = null, perm = 'none', timer = null, writing = false, dirty = false;
  const listeners = new Set();
  const notify = () => listeners.forEach(f => { try { f(); } catch(e) {} });
  async function loadHandle(){
    if (!FS_OK) return;
    handle = await idb.get('handle');
    if (!handle) { perm = 'none'; return notify(); }
    try { perm = await handle.queryPermission({mode: 'readwrite'}); } catch(e) { perm = 'prompt'; }
    notify();
    if (perm === 'granted') schedule(500);
  }
  async function writeNow(){
    if (!handle || perm !== 'granted') return;
    if (writing) { dirty = true; return; }
    writing = true; dirty = false;
    try {
      const w = await handle.createWritable(); await w.write(payload()); await w.close();
      ls.set('bk:lastAuto', String(now())); ls.set('bk:autoError', '');
    } catch(e) {
      perm = 'prompt'; ls.set('bk:autoError', String((e && e.name) || 'error')); notify();
    } finally { writing = false; if (dirty) schedule(1000); }
  }
  function schedule(ms){ clearTimeout(timer); timer = setTimeout(writeNow, ms == null ? 3000 : ms); }
  async function chooseFile(){
    try {
      const h = await window.showSaveFilePicker({suggestedName: 'kotoba-autobackup.json', types: [{description: 'JSON', accept: {'application/json': ['.json']}}]});
      handle = h; await idb.set('handle', h); perm = 'granted'; notify(); await writeNow(); return true;
    } catch(e) { return false; }   // 사용자가 취소
  }
  async function resume(){
    if (!handle) return chooseFile();
    try { perm = await handle.requestPermission({mode: 'readwrite'}); } catch(e) { perm = 'prompt'; }
    notify(); if (perm === 'granted') await writeNow();
    return perm === 'granted';
  }
  async function stopAuto(){ handle = null; perm = 'none'; await idb.del('handle'); notify(); }
  // 앱이 기록을 저장할 때마다 자동 저장 예약 (모든 앱의 store.set이 결국 localStorage.setItem을 거침)
  // ---------- 집 PC 동기화 (kotoba_sync 서버 + SQLite) ----------
  // 키마다 마지막 변경 시각(sync:meta)을 기록하고, 서버와 주고받아 더 최근 값을 남긴다(last-write-wins).
  let origSet = null, metaCache = null, syncTimer = null, syncing = null;
  const getMeta = () => { if (!metaCache) { try { metaCache = JSON.parse(ls.get('sync:meta') || '{}') || {}; } catch(e) { metaCache = {}; } } return metaCache; };
  const rawSet = (k, v) => { try { (origSet || Storage.prototype.setItem).call(localStorage, k, v); return true; } catch(e) { return false; } };
  const saveMeta = () => rawSet('sync:meta', JSON.stringify(getMeta()));
  const syncConf = () => { try { const c = JSON.parse(ls.get('sync:conf') || 'null'); return c && c.url && c.token ? c : null; } catch(e) { return null; } };
  const validUrl = u => /^https:\/\/[^\s/]+/i.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(u);
  async function api(conf, path, body, keepalive){
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const to = setTimeout(() => ctl && ctl.abort(), 15000);   // 서버가 꺼져 있으면 오래 기다리지 않음
    try {
      const r = await fetch(conf.url.replace(/\/+$/, '') + path, {method: body ? 'POST' : 'GET', keepalive: !!keepalive,
        headers: Object.assign({'Authorization': 'Bearer ' + conf.token}, body ? {'Content-Type': 'application/json'} : {}),
        body: body ? JSON.stringify(body) : undefined, signal: ctl ? ctl.signal : undefined, cache: 'no-store'});
      if (r.status === 401) throw new Error('auth');
      if (!r.ok) throw new Error('http ' + r.status);
      return await r.json();
    } finally { clearTimeout(to); }
  }
  // 반환: 서버에서 받아 바뀐 키 개수 (실패 시 -1)
  function syncNow(keepalive){
    const conf = syncConf(); if (!conf) return Promise.resolve(0);
    if (syncing) return syncing;
    syncing = (async () => {
      const meta = getMeta(), items = {};
      for (const [k, v] of Object.entries(collect())) items[k] = {v, t: meta[k] || 0};
      try {
        const res = await api(conf, '/api/sync', {items}, keepalive);
        let changed = 0;
        for (const [k, it] of Object.entries((res && res.items) || {})) {
          if (!KEY_RE.test(k) || !it || typeof it.v !== 'string') continue;
          const cur = ls.get(k);
          if ((it.t || 0) > (meta[k] || 0) || cur == null) {
            if (cur !== it.v) { rawSet(k, it.v); changed++; }
            meta[k] = it.t || 0;
          }
        }
        saveMeta(); rawSet('sync:last', String(now())); rawSet('sync:err', '');
        notify(); return changed;
      } catch(e) {
        rawSet('sync:err', e && e.message === 'auth' ? 'auth' : 'net'); notify(); return -1;
      } finally { syncing = null; }
    })();
    return syncing;
  }
  const scheduleSync = ms => { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), ms == null ? 4000 : ms); };
  // 다른 기기의 기록을 받아오면 화면 상태(메모리)와 맞추기 위해 한 번 새로고침
  async function pullAndRefresh(){
    const n = await syncNow();
    if (n > 0) {
      let last = 0; try { last = +sessionStorage.getItem('sync:reload') || 0; } catch(e) {}
      if (now() - last > 10000) { try { sessionStorage.setItem('sync:reload', String(now())); } catch(e) {} location.reload(); }
    }
  }
  async function connectSync(url, token){
    url = String(url || '').trim().replace(/\/+$/, ''); token = String(token || '').trim();
    if (!validUrl(url)) { alert(T.syncBadUrl); return false; }
    try {
      const r = await api({url, token}, '/api/ping');
      if (!r || !r.ok) throw new Error('auth');
      rawSet('sync:conf', JSON.stringify({url, token, user: r.user}));
      alert(T.syncOk); await pullAndRefresh(); notify(); return true;
    } catch(e) { alert(e && e.message === 'auth' ? T.syncAuth : T.syncFail); return false; }
  }
  function disconnectSync(){ if (!confirm(T.confirmSyncOff)) return; ls.del('sync:conf'); ls.del('sync:err'); notify(); }

  try {
    const orig = origSet = Storage.prototype.setItem;
    Storage.prototype.setItem = function(k, v){
      orig.call(this, k, v);
      if (this === window.localStorage && KEY_RE.test(k)) {
        if (handle && perm === 'granted') schedule();
        try { const m = getMeta(); m[k] = Date.now(); orig.call(this, 'sync:meta', JSON.stringify(m)); } catch(e) {}
        if (syncConf()) scheduleSync();
      }
    };
  } catch(e) {}
  if (syncConf()) {
    pullAndRefresh();
    document.addEventListener('visibilitychange', () => {
      if (!syncConf()) return;
      if (document.visibilityState === 'hidden') { if (syncTimer) { clearTimeout(syncTimer); syncNow(true); } }
      else pullAndRefresh();
    });
    window.addEventListener('online', () => scheduleSync(500));
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && timer) { clearTimeout(timer); writeNow(); } });
  loadHandle();

  // ---------- 상태·알림 ----------
  function status(){
    const last = Math.max(+ls.get('bk:lastExport') || 0, +ls.get('bk:lastAuto') || 0);
    const data = collect();
    const autoOn = !!handle && perm === 'granted';
    const days = last ? Math.floor((now() - last) / DAY) : null;
    const sc = syncConf(), sLast = +ls.get('sync:last') || 0, sDays = sLast ? Math.floor((now() - sLast) / DAY) : null;
    const syncFresh = !!sc && sDays != null && sDays < REMIND_DAYS;
    return {last, days, autoOn, autoPaused: !!handle && perm !== 'granted', fs: FS_OK,
      sync: sc, syncLast: sLast, syncErr: ls.get('sync:err') || '', syncStale: !!sc && hasLearning(data) && (sDays == null ? false : sDays >= 3),
      syncDays: sDays, need: hasLearning(data) && !autoOn && !syncFresh && (days == null || days >= REMIND_DAYS)};
  }
  // 홈 화면 상단 알림: 백업이 오래됐거나 자동 백업이 멈췄을 때만 표시
  function banner(el, onOpen){
    if (!el) return;
    const draw = () => {
      const s = status();
      let msg = '';
      if (s.autoPaused) msg = T.bannerPaused;
      else if (s.syncStale) msg = T.bannerSync.replace('{n}', s.syncDays);
      else if (s.need) msg = s.days == null ? T.bannerNever : T.bannerDays.replace('{n}', s.days);
      el.innerHTML = msg ? `<div class="bk-banner"><span>${esc(msg)}</span><button type="button" class="bk-go">${esc(s.autoPaused ? T.resume : s.syncStale ? T.syncOpen : T.backupNow)}</button></div>` : '';
      const b = el.querySelector('.bk-go');
      if (b) b.onclick = async () => { if (s.autoPaused) { await resume(); draw(); } else if (s.syncStale && onOpen) onOpen(); else if (onOpen) onOpen(); else { await exportFile(); draw(); } };
    };
    listeners.add(draw); draw();
  }

  // ---------- 백업 화면 ----------
  function screen(view){
    const draw = () => {
      const s = status(), data = collect();
      const sc = s.sync;
      view.innerHTML = `

// ---------- SRS (간격 반복, SM-2 간소화) ----------
// key: 'w<단어id>' | 'g<문형id>' → {r: 연속 정답 수, i: 간격(일), e: 난이도 계수, d: 다음 복습일(자정 ms)}
const DAY_MS = 864e5;
const srs = (() => { const v = store.get('srs', {}); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; })();
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
function srsGrade(key, ok){
  const t = today0();
  const c = srs[key] || {r: 0, i: 0, e: 2.5, d: t};
  if (ok) {
    // 아직 복습일이 안 된 카드를 미리 맞힌 경우 간격을 늘리지 않음 (같은 날 반복 풀이로 간격이 폭주하는 것 방지)
    if (c.r > 0 && c.d > t) return;
    c.r += 1;
    c.i = c.r === 1 ? 1 : c.r === 2 ? 3 : Math.min(180, Math.round(c.i * c.e));
    c.e = Math.min(3.0, c.e + 0.1);
  } else {
    c.r = 0; c.i = 0; c.e = Math.max(1.3, c.e - 0.2);
  }
  c.d = t + c.i * DAY_MS;   // 틀리면 i=0 → 오늘 다시 복습 대상
  srs[key] = c; store.set('srs', srs);
}
function dueList(prefix, arr){
  const t = today0();
  return Object.keys(srs)
    .filter(k => k[0] === prefix && srs[k] && srs[k].d <= t && arr[+k.slice(1)])
    .sort((a, b) => srs[a].d - srs[b].d)
    .map(k => arr[+k.slice(1)]);
}
const REVIEW_MAX = 30;
function srsLabel(key){
  const c = srs[key]; if (!c) return '미학습';
  const days = Math.round((c.d - today0()) / DAY_MS);
  return days <= 0 ? '복습 필요' : `${days}일 후 복습`;
}

function highlight(sentence, word){
  // 활용형 대응: 기본형 → する/だ 제거 → 끝 가나 제거 → 앞쪽 한자 순서로 문장 속 위치를 찾음
  const stem = word.replace(/だ$/, '');
  const cands = [stem, word.replace(/する$/, ''), word.length > 2 ? word.slice(0, -1) : '', (word.match(/^[^぀-ゟ]+/) || [''])[0]];
  const key = cands.find(k => k && sentence.includes(k));
  if (!key) return esc(sentence);
  const i = sentence.indexOf(key);
  return esc(sentence.slice(0, i)) + '<mark>' + esc(key) + '</mark>' + esc(sentence.slice(i + key.length));
}

// 한자의 음독/훈독 목록 + 이 단어에서 쓰인 읽기 강조 + 단어장 속 다른 단어
function readingBlock(c, w){
  const items = READ[c] || [];
  const segs = (w.seg || []).filter(s => s[0] === c);
  const usedKeys = new Set(segs.map(s => s[2]).filter(Boolean));
  const usedKana = [...new Set(segs.map(s => s[1]))];
  const fmtKey = it => it.kind === 'kun' && it.key.includes('.')
    ? esc(it.key.split('.')[0]) + '<span class="oku">' + esc(it.key.split('.').slice(1).join('')) + '</span>'
    : esc(it.key);
  const chips = kind => items.filter(it => it.kind === kind).map(it => `
    <span class="rchip ${usedKeys.has(it.key) ? 'hit' : ''}"><b class="jp">${fmtKey(it)}</b>${it.ex ? `<small class="jp">${esc(it.ex)}<i>${esc(it.exr)}</i></small>` : ''}</span>`).join('');
  const onC = chips('on'), kunC = chips('kun');
  const special = segs.some(s => !s[2]);
  const others = WORDS.filter(x => x.id !== w.id && x.w.includes(c)).slice(0, 8);
  return `
    <div class="rd">
      ${usedKana.length ? `<div class="use">이 단어에서는 <b class="jp">${usedKana.map(esc).join('·')}</b>${special ? ' (특수 읽기)' : ''}</div>` : ''}
      ${onC ? `<div class="rrow"><span class="lbl">음</span><div class="chips">${onC}</div></div>` : ''}
      ${kunC ? `<div class="rrow"><span class="lbl">훈</span><div class="chips">${kunC}</div></div>` : ''}
      ${others.length ? `<div class="rrow"><span class="lbl">단어장</span><div class="chips">${others.map(x => {
        const s = (x.seg || []).find(s => s[0] === c);
        return `<button class="rchip link" data-go="${x.id}"><b class="jp">${esc(x.w)}</b><small class="jp"><i>${esc(s ? s[1] : x.r)}</i></small></button>`; }).join('')}</div></div>` : ''}
    </div>`;
}

      </div>

      <div class="nav2">

        <button class="btn ${memorized.has(id)?'':'primary'}" id="memo">${memorized.has(id) ? '암기 취소' : '외웠어요 ✓'}</button>

function Quiz(list, title, day){
  const qs = shuffle(list);
  let idx = 0, score = 0; const wrong = [];
  let st;
  setHeader(title, true);
  function render(){
    const w = qs[idx];
    const hasK = uniqKanji(w.w).length > 0;   // 가나만으로 된 단어는 읽기 = 표기 → 뜻 문제만
    st = {w, step: hasK ? 1 : 2, readOK: hasK ? null : true, rc: hasK && quizMode === 'choice' ? readingChoices(w) : null, mc: meaningChoices(w), locked: false};
    draw();
  }
  function draw(){
    const {w, step} = st;
    view.innerHTML = `
      <div class="qtop"><span>${idx+1} / ${qs.length}</span><div class="bar"><i style="width:${idx/qs.length*100}%"></i></div><span>정답 ${score}</span></div>
      <div class="card qcard">
        <div class="step">${step === 1 ? '① 읽는 법은?' : '② 뜻은?'}</div>
        <div class="word jp">${esc(w.w)}</div>
        <div class="revealed">${step === 2 && w.r !== w.w ? esc(w.r) : ''}</div>
      </div>
      <div id="ans"></div>
      <div id="fb"></div>`;
    const ans = document.getElementById('ans');
    if (step === 1 && quizMode === 'type') {
      ans.innerHTML = `<form class="inp" id="f" autocomplete="off">
          <input id="in" lang="ja" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ひらがな 또는 romaji">
          <button class="btn primary" style="flex:0 0 auto">확인</button></form>
        <div class="hint" id="hint"></div>
        <button class="btn" id="giveup" style="width:100%;margin-top:6px">모르겠어요</button>`;
      const inp = document.getElementById('in'), hint = document.getElementById('hint');
      inp.oninput = () => { const v = inp.value.trim(); hint.textContent = /[a-z]/i.test(v) ? '→ ' + normReading(v) : ''; };
      document.getElementById('f').onsubmit = e => { e.preventDefault(); if (!inp.value.trim()) { inp.focus(); return; } answerReading(readingMatches(inp.value, w.r), inp.value); };
      document.getElementById('giveup').onclick = () => answerReading(false, '');
      setTimeout(() => { try { inp.focus(); } catch(e){} }, 50);
    } else {
      const opts = step === 1 ? st.rc : st.mc;
      ans.innerHTML = `<div class="choices">${opts.map((o, i) => `<button class="choice ${step===1?'jp':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      ans.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        if (st.locked) return;
        const o = opts[+b.dataset.i];
        if (step === 1) answerReading(o === w.r, o, b);
        else answerMeaning(o === w.m, b);
      });
    }
  }
  function mark(btn, ok, correctText){
    const all = view.querySelectorAll('.choice');
    all.forEach(x => { if (x.textContent === correctText) x.classList.add('ok'); });
    if (btn && !ok) btn.classList.add('ng');
  }
  function answerReading(ok, given, btn){
    if (st.locked) return; st.locked = true;
    st.readOK = ok;
    const fb = document.getElementById('fb');
    if (quizMode === 'choice') mark(btn, ok, st.w.r);
    else { const f = document.getElementById('f'); if (f) f.querySelector('input').disabled = true; const g = document.getElementById('giveup'); if (g) g.remove(); }
    fb.innerHTML = `<div class="fb ${ok?'ok':'ng'}">${ok ? '⭕ 정답' : '❌ 오답'} — <b class="jp">${esc(st.w.r)}</b>${!ok && given && quizMode==='type' ? ` <span style="color:var(--sub)">(입력: ${esc(normReading(given))})</span>` : ''}</div>`;
    setTimeout(() => { st.step = 2; st.locked = false; draw(); }, ok ? 650 : 1300);
  }
  function answerMeaning(ok, btn){
    if (st.locked) return; st.locked = true; st.done = true;
    mark(btn, ok, st.w.m);
    const both = ok && st.readOK;
    if (both) { score++; wrongSet.delete(st.w.id); } else { wrong.push(st.w); wrongSet.add(st.w.id); }
    srsGrade('w' + st.w.id, both);
    saveWrong();
    const ex = EX[st.w.w];
    const fb = document.getElementById('fb');
    fb.innerHTML = `<div class="fb ${both?'ok':'ng'}">${both ? '⭕ 완벽!' : (ok ? '뜻은 맞았지만 읽기가 틀렸어요' : '❌ 뜻: ' + esc(st.w.m))}
      ${ex ? `<div class="jp" style="margin-top:6px">${highlight(ex.s, st.w.w)}</div><div style="color:var(--sub);font-size:13px">${esc(ex.k)}</div>` : ''}</div>
      <div class="nav2"><button class="btn" id="info">한자 풀이</button><button class="btn primary" id="nx">${idx < qs.length-1 ? '다음 ›' : '결과 보기'}</button></div>`;
    document.getElementById('nx').onclick = next;
    document.getElementById('info').onclick = () => go(Detail, [st.w.id, null]);
    speak(st.w.r);
  }
  function next(){
    idx++;
    if (idx < qs.length) { render(); window.scrollTo(0, 0); return; }
    if (day) { const prev = best[day]; if (!prev || score > prev.score) { best[day] = {score, total: qs.length}; store.set('best', best); } }
    showResult();
  }
  function showResult(){
    view.innerHTML = `
      <div class="card result"><div style="color:var(--sub)">${esc(title)}</div>
        <div class="score">${score} / ${qs.length}</div>
        <div style="color:var(--sub)">${score === qs.length ? '만점! 🎉' : `틀린 단어 ${wrong.length}개는 오답노트에 저장됨`}</div></div>
      ${wrong.length ? `<h2 class="sub">틀린 단어</h2><div class="list wrongs">${wrong.map(w => `
        <button class="card row" data-id="${w.id}"><div class="w jp">${esc(w.w)}${w.r !== w.w ? `<small>${esc(w.r)}</small>` : ''}</div><div class="m">${esc(w.m)}</div></button>`).join('')}</div>` : ''}
      <div class="nav2">${wrong.length ? `<button class="btn primary" id="retry">틀린 것만 다시</button>` : ''}<button class="btn" id="again">처음부터</button></div>`;
    view.querySelectorAll('.wrongs .row').forEach(r => r.onclick = () => go(Detail, [+r.dataset.id, wrong.map(w => w.id)]));
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => go(Quiz, [wrong.slice(), title + ' (재도전)', null], true);
    document.getElementById('again').onclick = () => go(Quiz, [list, title, day], true);
  }
  Quiz._resume = () => {
    setHeader(title, true);
    if (idx >= qs.length) showResult();
    else if (st.done) next();            // 뜻까지 답한 문제 → 다음 문제로
    else { st.locked = false; draw(); }  // 풀던 문제 그대로
  };
  render();
}

// 오답 보기: 같은 유사 그룹·같은 정답 문자열 제외, 정답과 길이가 비슷한 것 우선
// 기출 세트는 '유사 그룹'이 같은 문형도 제외, 공통으로 뜻이 겹치는 문형(동의 표현) 제외
function grammarChoices(g, ans){
  ans = ans || g.a;
  const cands = shuffle(GRAMMAR.filter(x => x.id !== g.id && x.a !== ans && !(!IS_MAIN && g.g && x.g === g.g) && !mOverlap(x.m, g.m)));
  cands.sort((x, y) => Math.abs(x.a.length - ans.length) - Math.abs(y.a.length - ans.length));
  const picked = [];
  for (const c of cands.slice(0, 12).sort(() => Math.random() - 0.5)) {
    if (picked.length >= 3) break;
    if (!picked.includes(c.a) && c.a !== ans) picked.push(c.a);
  }
  return shuffle([ans, ...picked]);
}

function GQuiz(list, title, gday){
  const qs = shuffle(list);
  let idx = 0, score = 0, locked = false; const wrong = [];
  setHeader(title, true);
  function draw(){
    const g = qs[idx], e = g.ex[Math.floor(Math.random() * g.ex.length)] || g.ex[0];
    const ans = /\[([^\]]+)\]/.exec(e.s)[1], opts = grammarChoices(g, ans);
    locked = false;
    const blank = e.s.replace(/\[[^\]]+\]/, '<span class="blank">　？　</span>');
    view.innerHTML = `
      <div class="qtop"><span>${idx+1} / ${qs.length}</span><div class="bar"><i style="width:${idx/qs.length*100}%"></i></div><span>정답 ${score}</span></div>
      <div class="card qcard"><div class="step">빈칸에 들어갈 알맞은 것은?</div>
        <div class="jp gsent">${blank.split(/(<span class="blank">　？　<\/span>)/).map((t, i) => i % 2 ? t : esc(t)).join('')}</div></div>
      <div class="choices">${opts.map((o, i) => `<button class="choice jp" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    view.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const ok = opts[+b.dataset.i] === ans;
      view.querySelectorAll('.choice').forEach(x => { if (x.textContent === ans) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      if (ok) score++; else wrong.push({...g, s: e.s, k: e.k});
      srsGrade('g' + g.id, ok);
      document.getElementById('fb').innerHTML = `
        <div class="fb ${ok ? 'ok' : 'ng'}">${ok ? '⭕ 정답' : '❌ 오답'} — <b class="jp">${esc(g.p)}</b> : ${esc(g.m)}
          <div class="jp" style="margin-top:6px">${gMarked(e.s)}</div><div style="color:var(--sub);font-size:13px">${esc(e.k)}</div></div>
        <div class="nav2"><button class="btn primary" id="nx">${idx < qs.length-1 ? '다음 ›' : '결과 보기'}</button></div>`;
      document.getElementById('nx').onclick = next;
      speak(gFull(e.s));
    });
  }
  function next(){
    idx++;
    if (idx < qs.length) { draw(); window.scrollTo(0, 0); return; }
    if (gday) { const gb = store.get('gbest', {}); if (!gb[gday] || score > gb[gday].score) { gb[gday] = {score, total: qs.length}; store.set('gbest', gb); } }
    view.innerHTML = `
      <div class="card result"><div style="color:var(--sub)">${esc(title)}</div>
        <div class="score">${score} / ${qs.length}</div>
        <div style="color:var(--sub)">${score === qs.length ? '만점! 🎉' : `틀린 문형 ${wrong.length}개는 오늘 복습 목록에 추가됨`}</div></div>
      ${wrong.length ? `<h2 class="sub">틀린 문형</h2><div class="list">${wrong.map(g => `
        <div class="card grow"><div class="gp"><span class="jp">${esc(g.p)}</span><span class="gm">${esc(g.m)}</span></div>
          <div class="gx"><div class="jp s">${gMarked(g.s)}</div><div class="k">${esc(g.k)}</div></div></div>`).join('')}</div>` : ''}
      <div class="nav2">${wrong.length ? `<button class="btn primary" id="retry">틀린 것만 다시</button>` : ''}<button class="btn" id="again">처음부터</button></div>`;
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => go(GQuiz, [wrong.map(w => GRAMMAR[w.id]), title + ' (재도전)', null], true);
    document.getElementById('again').onclick = () => go(GQuiz, [list, title, gday], true);
  }
  draw();
}

// ---------- keyboard: ←/→ 이전·다음, Enter 외웠어요(상세)·다음 문제(퀴즈), 1~4 보기 선택(퀴즈)·1 발음·2 예문 듣기(상세), Backspace 이전 화면 ----------
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;   // 직접 입력 중에는 방해하지 않음
  const btn = id => { const b = document.getElementById(id); return b && !b.disabled ? b : null; };
  if (e.key === 'Backspace') { if (!e.repeat) { e.preventDefault(); back(); } return; }   // 이전 화면 (뒤로 버튼과 동일)
  let b = null;
  if (e.key === 'ArrowRight') b = btn('nx') || btn('next');
  else if (e.key === 'ArrowLeft') b = btn('prev');
  else if (e.key === 'Enter') {
    // 단어 상세: '외웠어요' 처리(다음 단어로 이동). 이미 외운 단어면 취소하지 않고 다음으로만 이동
    const m = btn('memo');
    b = btn('nx') || (m ? (m.classList.contains('primary') ? m : btn('next')) : null);
  }
  else if (/^[1-4]$/.test(e.key)) {
    const ch = view.querySelectorAll('.choice');
    if (ch.length) b = ch[+e.key - 1] || null;                 // 퀴즈: 보기 선택
    else if (!e.repeat && e.key === '1') b = btn('tts');       // 단어 상세: 1 발음 듣기
    else if (!e.repeat && e.key === '2') b = btn('ttsEx');     //            2 예문 듣기
  }
  if (b) { e.preventDefault(); b.click(); }   // preventDefault: 포커스된 버튼의 Enter 기본 클릭과 중복 방지
});

// ---------- boot ----------
go(Home);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
