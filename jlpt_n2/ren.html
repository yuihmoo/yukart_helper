<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1d1f24;--sub:#6b6f78;--line:#e2e5ea;
  --accent:#3d6fc8;--accent-weak:#e0e9f8;--ok:#2f8f5b;--ok-weak:#dcf1e5;--ng:#c8553d;--ng-weak:#f8e0da;
  --chip:#eceff3;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;
    --accent:#7fa3e6;--accent-weak:#1f2a3d;--ok:#5cc28a;--ok-weak:#1d3328;--ng:#e27a5f;--ng-weak:#3a2622;
    --chip:#2a2e36;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d;--card:#1f2229;--ink:#eceae5;--sub:#9a9ea8;--line:#2e323b;
  --accent:#7fa3e6;--accent-weak:#1f2a3d;--ok:#5cc28a;--ok-weak:#1d3328;--ng:#e27a5f;--ng-weak:#3a2622;
  --chip:#2a2e36;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Apple SD Gothic Neo","Noto Sans JP","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.kj{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:0 16px 32px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--chip)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.menu{display:grid;gap:12px;margin-top:8px}
.menu .card{padding:18px 20px;text-align:left;display:flex;gap:16px;align-items:center;width:100%}
.menu .card:disabled{opacity:.5}
.menu .big{font-size:30px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent);flex:0 0 auto}
.menu h2{margin:0;font-size:18px}.menu p{margin:2px 0 0;color:var(--sub);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{padding:12px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:16px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--chip);font-size:14px;white-space:nowrap}
.days button.on{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row .w{font-size:20px;min-width:0;flex:1}
.row .m{font-size:13px;color:var(--sub);text-align:right;max-width:50%}
.row.done{opacity:.55}
.hjtag{font-size:12px;color:var(--accent);margin-left:6px}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:13px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.toolbar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px}
.pill.on{background:var(--accent);color:#fff}
.head{padding:20px;text-align:center}
.head .word{font-size:44px;line-height:1.25;word-break:keep-all}
.head .word .hit{color:var(--accent)}
.head .mean{font-size:18px;margin-top:6px}
.head .meta{font-size:12px;color:var(--sub);margin-top:6px}
.sec{margin-top:12px;padding:16px}
.sec h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600}
.ex .s{font-size:19px;line-height:1.7}.ex .k{color:var(--sub);font-size:14px;margin-top:4px}
.hj{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hj:first-of-type{border-top:0;padding-top:0}
.hj .c{font-size:44px;line-height:64px;text-align:center;background:var(--chip);border-radius:12px;height:64px}
.hj .snd{font-size:15px}.hj .snd b{color:var(--accent);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:4px 9px;border-radius:9px;background:var(--chip);line-height:1.3;text-align:left}
.wchip b{font-size:15px;font-weight:600}.wchip b .hit{color:var(--accent)}
.wchip small{font-size:11px;color:var(--sub)}
.native{font-size:14px;color:var(--sub)}
mark{background:var(--accent-weak);color:inherit;border-radius:4px;padding:0 2px}
.nav2{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:14px;background:var(--chip);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.tts{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--chip);margin-top:10px}
.qtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{padding:28px 16px;text-align:center;margin-top:12px}
.qcard .word{font-size:40px;line-height:1.3;word-break:keep-all}
.qcard .step{font-size:13px;color:var(--sub);margin-bottom:10px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:17px}
.choice.ok{background:var(--ok-weak);border-color:var(--ok)}
.choice.ng{background:var(--ng-weak);border-color:var(--ng)}
.inp{display:flex;gap:8px;margin-top:12px}
.inp input{flex:1;min-width:0;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fb{margin-top:12px;padding:14px 16px;border-radius:14px;font-size:15px}
.fb.ok{background:var(--ok-weak)}.fb.ng{background:var(--ng-weak)}
.result{padding:24px;text-align:center}
.result .score{font-size:48px;font-weight:800}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dgrid .card{padding:14px 8px;text-align:center}
.dgrid b{display:block;font-size:17px}.dgrid span{font-size:12px;color:var(--sub)}
.dgrid .perfect{border-color:var(--ok)}
h2.sub{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:600}
.grow{display:block;width:100%;text-align:left;padding:12px 14px}
.gp{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.gp .ko{font-size:17px}.gp .gm{font-size:13px;color:var(--sub);text-align:right}
.gx{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.gx .s{font-size:17px;line-height:1.7}.gx .k{font-size:14px;color:var(--sub);margin-top:2px}
.gx .meta{font-size:12px;color:var(--sub);margin-top:6px}
.gsent{font-size:21px;line-height:1.8;text-align:left}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
</style>
</head>

<script>
"use strict";
// ---------- storage (프라이빗 모드 등 localStorage 예외 방어, よん 앱과 키 분리) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ren:'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ren:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const chunk = (arr, n) => { const d = []; for (let i = 0; i < arr.length; i += n) d.push(arr.slice(i, i+n));
  if (d.length > 1 && d[d.length-1].length < n/2) { const last = d.pop(); d[d.length-1].push(...last); } return d; };

// ---------- data ----------
const PER_DAY = 30, G_PER_DAY = 20;
const WORDS = VOCAB.map((x, i) => ({id: i, n: x.n, no: x.no || x.n, lv: x.lv ? 1 : 0, ko: x.ko, ja: x.ja, hj: HANJA[x.n] || null, ex: EXAMPLES[x.n] || null}));
// 중급(기존 Day 번호 유지) 뒤에 초급을 이어붙임 → 저장된 최고점·암기 기록의 Day/ID가 바뀌지 않음
const MID_DAYS = chunk(WORDS.filter(w => !w.lv), PER_DAY), BEG_DAYS = chunk(WORDS.filter(w => w.lv), PER_DAY);
const DAYS = [...MID_DAYS, ...BEG_DAYS];
DAYS.forEach((d, i) => { d.lv = i < MID_DAYS.length ? 0 : 1; d.forEach(w => w.day = i + 1); });
const LV_NAME = ['中級', '初級'];
const dayLabel = g => DAYS[g-1] && DAYS[g-1].lv ? `初級 Day ${g - MID_DAYS.length}` : `中級 Day ${g}`;
const lvDays = lv => DAYS.map((d, i) => i + 1).filter(g => DAYS[g-1].lv === lv);
let curLv = store.get('lv', 0) === 1 ? 1 : 0;
const setLv = lv => { curLv = lv ? 1 : 0; store.set('lv', curLv); };
const lvSeg = () => `<div class="seg">${LV_NAME.map((n, i) => `<button data-lv="${i}" class="${curLv===i?'on':''}">${n} ${WORDS.filter(w => w.lv === i).length}語</button>`).join('')}</div>`;
// 한자 → 그 한자를 쓰는 단어 목록 (음절 위치 포함)
const BY_HANJA = {};
WORDS.forEach(w => (w.hj || []).forEach(([syl, k], pos) => (BY_HANJA[k] = BY_HANJA[k] || []).push({w, pos})));
const isVerb = w => /다$/.test(w.ko);
const jaKeys = s => s.split(/[、,，]/).map(t => t.trim()).filter(Boolean);

const GRAMMAR = GRAM.map((g, i) => ({id: i, n: g.n, p: g.p, m: g.ja, s: g.s, a: g.a, k: g.exja, g: g.g}));
const GDAYS = chunk(GRAMMAR, G_PER_DAY);
GDAYS.forEach((d, i) => d.forEach(g => g.day = i + 1));

// ---------- TTS ----------
// ---------- 음성(TTS) 공통 모듈: よん·れん 빌드 시 주입 ----------
// iOS 사파리는 getVoices()가 처음엔 빈 배열이고 'voiceschanged' 이후에 채워짐 → 로딩을 기다린 뒤 고품질 음성을 고름.
// 고품질(Premium/Enhanced) 음성이 웹에 노출되는지는 iOS 버전에 따라 다르므로, 사용자가 직접 골라 들어볼 수 있는 화면을 제공.
function makeTTS(opt){
  // opt: {lang:'ja-JP', store, T:{...문구}}
  const prefix = opt.lang.slice(0, 2);
  let voices = [];
  const load = () => { try { voices = (speechSynthesis.getVoices() || []).filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(prefix)); } catch(e) { voices = []; } return voices; };
  const ready = new Promise(res => {
    if (!('speechSynthesis' in window)) return res([]);
    if (load().length) return res(voices);
    let done = false;
    const fin = () => { if (!done) { done = true; res(load()); } };
    try { speechSynthesis.addEventListener('voiceschanged', fin); } catch(e) {}
    setTimeout(fin, 1500);   // 이벤트가 오지 않는 브라우저 대비
  });
  // 장난감 음성(Eloquence: Eddy, Flo, Grandma, Grandpa, Reed, Rocko, Sandy, Shelley)은 감점
  const NOVELTY = /(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox)/i;
  function score(v){
    const id = ((v.voiceURI || '') + ' ' + (v.name || '')).toLowerCase();
    let s = 0;
    if (/premium|プレミアム|프리미엄/.test(id)) s += 30;
    if (/enhanced|拡張|고품질|향상/.test(id)) s += 20;
    if (/siri/.test(id)) s += 15;
    if (/google|microsoft|natural|neural/.test(id)) s += 12;
    if (/compact/.test(id)) s -= 5;
    if (NOVELTY.test(id)) s -= 40;
    if (v.localService) s += 1;
    if (v.lang && v.lang.replace('_', '-') === opt.lang) s += 2;
    return s;
  }
  const ranked = () => voices.slice().sort((a, b) => score(b) - score(a));
  const savedURI = () => opt.store.get('voiceURI', null);
  function pick(){
    const uri = savedURI();
    return (uri && voices.find(v => v.voiceURI === uri)) || ranked()[0] || null;
  }
  const rate = () => { const r = +opt.store.get('voiceRate', 0.9); return r >= 0.5 && r <= 1.5 ? r : 0.9; };
  function speakWith(text, voice){
    try {
      if (!('speechSynthesis' in window) || !text) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = opt.lang; u.rate = rate();
      if (voice) u.voice = voice;
      // iOS에서 cancel 직후 바로 speak하면 무시되는 경우가 있어 한 틱 늦춤
      setTimeout(() => { try { speechSynthesis.speak(u); } catch(e) {} }, 30);
    } catch(e) {}
  }
  function speak(text){ ready.then(() => speakWith(text, pick())); }

  function label(v){
    const id = ((v.voiceURI || '') + ' ' + (v.name || '')).toLowerCase();
    const tag = /premium|プレミアム|프리미엄/.test(id) ? 'Premium' : /enhanced|拡張|고품질|향상/.test(id) ? 'Enhanced' : NOVELTY.test(id) ? opt.T.novelty : '';
    return tag;
  }
  // 음성 설정 화면
  function screen(view, esc){
    view.innerHTML = `<p class="note" style="margin-top:0">${opt.T.loading}</p>`;
    ready.then(() => {
      const list = ranked(), cur = pick(), T = opt.T;
      view.innerHTML = `
        <div class="card sec" style="margin-top:0">
          <h3>${T.speed}: <b id="rv">${rate().toFixed(2)}</b></h3>
          <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${rate()}" style="width:100%">
        </div>
        <h2 class="sub">${T.voices} (${list.length})</h2>
        <div class="list">${list.map((v, i) => `
          <button class="card row" data-i="${i}" style="${cur && v.voiceURI === cur.voiceURI ? 'border-color:var(--accent);border-width:2px' : ''}">
            <div class="w" style="font-size:16px">${esc(v.name)}${label(v) ? ` <span class="pill" style="padding:2px 8px;font-size:11px">${esc(label(v))}</span>` : ''}
              <div style="font-size:12px;color:var(--sub)">${esc(v.lang)}${cur && v.voiceURI === cur.voiceURI ? ' · ' + T.selected : ''}</div></div>
            <div class="m">▶︎ ${T.tryIt}</div>
          </button>`).join('') || `<p class="note">${T.none}</p>`}</div>
        <div class="card sec"><h3>${T.howTitle}</h3><div style="font-size:14px;line-height:1.7">${T.how}</div></div>`;
      const rv = view.querySelector('#rv'), rs = view.querySelector('#rate');
      rs.oninput = () => { rv.textContent = (+rs.value).toFixed(2); };
      rs.onchange = () => { opt.store.set('voiceRate', +rs.value); speak(T.sample); };
      view.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
        const v = list[+b.dataset.i];
        opt.store.set('voiceURI', v.voiceURI);
        speakWith(T.sample, v);
        screen(view, esc);
      });
    });
  }
  return {speak, screen, ready, current: () => ready.then(pick)};
}

const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
function srsGrade(key, ok){
  const t = today0(), c = srs[key] || {r: 0, i: 0, e: 2.5, d: t};
  if (ok) {
    if (c.r > 0 && c.d > t) return;   // 복습일 전 조기 정답은 간격을 늘리지 않음
    c.r += 1; c.i = c.r === 1 ? 1 : c.r === 2 ? 3 : Math.min(180, Math.round(c.i * c.e)); c.e = Math.min(3.0, c.e + 0.1);
  } else { c.r = 0; c.i = 0; c.e = Math.max(1.3, c.e - 0.2); }
  c.d = t + c.i * DAY_MS; srs[key] = c; store.set('srs', srs);
}

}

// 예문 속 표제어 강조: 기본형 → '다' 뗀 어간 → '하다' 뗀 어근 → 활용형(마지막 음절은 초성만 비교) 순으로 찾음
function hangulParts(ch){ const o = ch.charCodeAt(0) - 0xAC00; return (o >= 0 && o < 11172) ? [Math.floor(o / 588), Math.floor((o % 588) / 28)] : null; }
function exMarked(sentence, word){
  const ko = String(word).replace(/^[〜~]/, '');
  const stem = ko.endsWith('다') ? ko.slice(0, -1) : ko;
  const cands = [ko, stem, ko.endsWith('하다') ? ko.slice(0, -2) : '', stem.length > 1 ? stem.slice(0, -1) : ''].filter(Boolean);
  let at = -1, len = 0;
  for (const c of cands) { const i = sentence.indexOf(c); if (i >= 0) { at = i; len = c.length; break; } }
  if (at < 0 && stem && [...stem].every(hangulParts)) {
    const L = stem.length;
    for (let i = 0; i + L <= sentence.length && at < 0; i++) {
      const seg = sentence.slice(i, i + L);
      if (![...seg].every(hangulParts)) continue;
      let ok = true;
      for (let k = 0; k < L - 1; k++) { const a = hangulParts(seg[k]), b = hangulParts(stem[k]); if (a[0] !== b[0] || a[1] !== b[1]) { ok = false; break; } }
      const a = hangulParts(seg[L-1]), b = hangulParts(stem[L-1]);
      if (ok && a[0] === b[0] && (L > 1 || a[1] === b[1])) { at = i; len = L; }
    }
  }
  if (at < 0) return esc(sentence);
  return esc(sentence.slice(0, at)) + '<mark>' + esc(sentence.slice(at, at + len)) + '</mark>' + esc(sentence.slice(at + len));
}

// 단어의 한글 음절 중 pos번째(한자 대응) 음절을 강조해서 표시

}

  };

function distractors(w){
  const mine = new Set(jaKeys(w.ja));
  const pool = shuffle(WORDS.filter(x => x.id !== w.id && x.ko !== w.ko && isVerb(x) === isVerb(w) && !jaKeys(x.ja).some(t => mine.has(t))));
  const out = [], seenJa = new Set(), seenKo = new Set();
  for (const x of pool) { if (out.length >= 3) break; if (seenJa.has(x.ja) || seenKo.has(x.ko)) continue; seenJa.add(x.ja); seenKo.add(x.ko); out.push(x); }
  return out;
}

    <div class="dgrid">${lvDays(curLv).map(g => { const d = DAYS[g-1], b = best[g]; const pf = b && b.score === b.total;
      return `<button class="card ${pf?'perfect':''}" data-d="${g}"><b>Day ${curLv ? g - MID_DAYS.length : g}</b><span>${b ? `最高 ${b.score}/${b.total}` : `${d.length}問`}</span></button>`; }).join('')}
      <button class="card" data-d="all"><b>ランダム</b><span>20問</span></button>
    </div>`;
  view.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { quizMode = b.dataset.m; store.set('quizMode', quizMode); QuizMenu(); });
  view.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { setLv(+b.dataset.lv); QuizMenu(); });
  view.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    if (b.dataset.d === 'all') go(Quiz, [shuffle(WORDS.filter(w => w.lv === curLv)).slice(0, 20), `${LV_NAME[curLv]} ランダム`, null]);
    else { const d = +b.dataset.d; go(Quiz, [DAYS[d-1], `${dayLabel(d)} クイズ`, d]); }
  });
}

function Quiz(list, title, day){
  const qs = shuffle(list);
  let idx = 0, score = 0, st = null; const wrong = [];
  setHeader(title);
  function render(){ const w = qs[idx]; st = {w, opts: shuffle([w, ...distractors(w)]), locked: false, done: false}; draw(); }
  function draw(){
    const {w, opts} = st;
    const askKo = quizMode === 'ko2ja';
    view.innerHTML = `
      <div class="qtop"><span>${idx+1} / ${qs.length}</span><div class="bar"><i style="width:${idx/qs.length*100}%"></i></div><span>正解 ${score}</span></div>
      <div class="card qcard"><div class="step">${askKo ? '意味は？' : quizMode === 'type' ? '韓国語で書いてください' : '韓国語は？'}</div>
        <div class="word ${askKo ? 'ko' : ''}" style="${askKo ? '' : 'font-size:28px'}">${esc(askKo ? w.ko : w.ja)}</div></div>
      <div id="ans"></div><div id="fb"></div>`;
    const ans = document.getElementById('ans');
    if (quizMode === 'type') {
      ans.innerHTML = `<form class="inp" id="f" autocomplete="off">
          <input id="in" lang="ko" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="한국어">
          <button class="btn primary" style="flex:0 0 auto">OK</button></form>
        <button class="btn" id="giveup" style="width:100%;margin-top:8px">わからない</button>`;
      const inp = document.getElementById('in');
      document.getElementById('f').onsubmit = e => { e.preventDefault(); if (!normKo(inp.value)) { inp.focus(); return; } answer(normKo(inp.value) === normKo(w.ko), null, inp.value); };
      document.getElementById('giveup').onclick = () => answer(false, null, '');
      setTimeout(() => { try { inp.focus(); } catch(e){} }, 50);
    } else {
      ans.innerHTML = `<div class="choices">${opts.map((o, i) => `<button class="choice ${askKo ? '' : 'ko'}" data-i="${i}">${esc(askKo ? o.ja : o.ko)}</button>`).join('')}</div>`;
      ans.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(opts[+b.dataset.i].id === w.id, b));
    }
  }
  function answer(ok, btn, typed){
    if (st.locked) return; st.locked = true; st.done = true;
    const w = st.w;
    if (quizMode !== 'type') {
      view.querySelectorAll('.choice').forEach((x, i) => { if (st.opts[i].id === w.id) x.classList.add('ok'); });
      if (btn && !ok) btn.classList.add('ng');
    } else {
      const inp = document.getElementById('in'); if (inp) inp.disabled = true;
      const g = document.getElementById('giveup'); if (g) g.remove();
    }
    if (ok) { score++; wrongSet.delete(w.id); } else { wrong.push(w); wrongSet.add(w.id); }
    saveWrong(); srsGrade('w' + w.id, ok);
    document.getElementById('fb').innerHTML = `
      <div class="fb ${ok ? 'ok' : 'ng'}">${ok ? '⭕ 正解' : '❌ 不正解'} — <b class="ko">${esc(w.ko)}</b>${w.hj ? ` <span class="kj">(${esc(w.hj.map(h => h[1]).join(''))})</span>` : ''} : ${esc(w.ja)}
        ${!ok && typed ? `<div style="color:var(--sub);font-size:13px">入力: ${esc(typed)}</div>` : ''}
        ${w.ex ? `<div class="ko" style="margin-top:6px">${exMarked(w.ex[0], w.ko)}</div><div style="color:var(--sub);font-size:13px">${esc(w.ex[1])}</div>` : ''}</div>
      <div class="nav2"><button class="btn" id="info">詳しく</button><button class="btn primary" id="nx">${idx < qs.length-1 ? '次へ ›' : '結果'}</button></div>`;
    document.getElementById('nx').onclick = next;
    document.getElementById('info').onclick = () => go(Detail, [w.id, null]);
    speak(w.ko);
  }
  function next(){
    idx++;
    if (idx < qs.length) { render(); window.scrollTo(0, 0); return; }
    if (day) { const best = store.get('best', {}); if (!best[day] || score > best[day].score) { best[day] = {score, total: qs.length}; store.set('best', best); } }
    showResult();
  }
  function showResult(){
    view.innerHTML = `
      <div class="card result"><div style="color:var(--sub)">${esc(title)}</div>
        <div class="score">${score} / ${qs.length}</div>
        <div style="color:var(--sub)">${score === qs.length ? '満点！🎉' : `間違えた ${wrong.length} 語は間違いノートに保存`}</div></div>
      ${wrong.length ? `<h2 class="sub">間違えた単語</h2><div class="list">${wrong.map(w => `
        <button class="card row" data-id="${w.id}"><div class="w ko">${esc(w.ko)}</div><div class="m">${esc(w.ja)}</div></button>`).join('')}</div>` : ''}
      <div class="nav2">${wrong.length ? `<button class="btn primary" id="retry">間違いだけもう一度</button>` : ''}<button class="btn" id="again">最初から</button></div>`;
    view.querySelectorAll('.row[data-id]').forEach(r => r.onclick = () => go(Detail, [+r.dataset.id, wrong.map(w => w.id)]));
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => go(Quiz, [wrong.slice(), title + '（再挑戦）', null], true);
    document.getElementById('again').onclick = () => go(Quiz, [list, title, day], true);
  }
  Quiz._resume = () => { setHeader(title); if (idx >= qs.length) showResult(); else if (st.done) next(); else { st.locked = false; draw(); } };
  render();
}

// ---------- grammar ----------
const gFull = s => s.replace(/\[([^\]]+)\]/, '$1');
const gMarked = s => { const m = /\[([^\]]+)\]/.exec(s); return m ? esc(s.slice(0, m.index)) + '<mark>' + esc(m[1]) + '</mark>' + esc(s.slice(m.index + m[0].length)) : esc(s); };
let gOpen = null;
function GBook(day){
  day = Math.min(Math.max(1, day|0), GDAYS.length); store.set('gbookDay', day);
  setHeader('中級文法');
  const gb = store.get('gbest', {});
  view.innerHTML = `
    <div class="days">${GDAYS.map((d, i) => `<button class="${i+1===day?'on':''}" data-d="${i+1}">Day ${i+1}${gb[i+1] ? ` · ${gb[i+1].score}/${gb[i+1].total}` : ''}</button>`).join('')}</div>
    <div class="nav2" style="margin:0 0 10px"><button class="btn primary" id="gq">Day ${day} 文法クイズ</button><button class="btn" id="gall">ランダム 20</button></div>
    <div class="list">${GDAYS[day-1].map(g => `
      <button class="card grow" data-id="${g.id}">
        <div class="gp"><span class="ko">${esc(g.p)}</span><span class="gm">${esc(g.m)}</span></div>
        ${gOpen === g.id ? `<div class="gx"><div class="ko s">${gMarked(g.s)}</div><div class="k">${esc(g.k)}</div>
          <div class="meta">No.${g.n} · ${esc(srsLabel('g' + g.id))}</div></div>` : ''}
      </button>`).join('')}</div>`;
  const on = view.querySelector('.days .on'); if (on) on.scrollIntoView({inline: 'center', block: 'nearest'});
  view.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { gOpen = null; go(GBook, [+b.dataset.d], true); });
  view.querySelectorAll('.grow').forEach(b => b.onclick = () => {
    const id = +b.dataset.id; gOpen = gOpen === id ? null : id; GBook(day);
    if (gOpen !== null) speak(gFull(GRAMMAR[id].s));
  });
  document.getElementById('gq').onclick = () => go(GQuiz, [GDAYS[day-1], `文法 Day ${day}`, day]);
  document.getElementById('gall').onclick = () => go(GQuiz, [shuffle(GRAMMAR).slice(0, 20), '文法ランダム', null]);
}
function grammarChoices(g){
  const cands = shuffle(GRAMMAR.filter(x => x.id !== g.id && x.a !== g.a && !(g.g && x.g === g.g)));
  cands.sort((x, y) => Math.abs(x.a.length - g.a.length) - Math.abs(y.a.length - g.a.length));
  const picked = [];
  for (const c of shuffle(cands.slice(0, 12))) { if (picked.length >= 3) break; if (!picked.includes(c.a)) picked.push(c.a); }
  return shuffle([g.a, ...picked]);
}
function GQuiz(list, title, gday){
  const qs = shuffle(list);
  let idx = 0, score = 0, locked = false; const wrong = [];
  setHeader(title);
  function draw(){
    const g = qs[idx], opts = grammarChoices(g); locked = false;
    const m = /\[([^\]]+)\]/.exec(g.s);
    const sent = esc(g.s.slice(0, m.index)) + '<span class="blank">　？　</span>' + esc(g.s.slice(m.index + m[0].length));
    view.innerHTML = `
      <div class="qtop"><span>${idx+1} / ${qs.length}</span><div class="bar"><i style="width:${idx/qs.length*100}%"></i></div><span>正解 ${score}</span></div>
      <div class="card qcard"><div class="step">空欄に入るものは？</div><div class="ko gsent">${sent}</div>
        <button class="tts" id="hint" style="margin-top:12px">ヒント（日本語訳）</button></div>
      <div class="choices">${opts.map((o, i) => `<button class="choice ko" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    document.getElementById('hint').onclick = e => { e.target.outerHTML = `<div style="color:var(--sub);font-size:14px;margin-top:8px;text-align:left">${esc(g.k)}</div>`; };
    view.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const ok = opts[+b.dataset.i] === g.a;
      view.querySelectorAll('.choice').forEach((x, i) => { if (opts[i] === g.a) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      if (ok) score++; else wrong.push(g);
      srsGrade('g' + g.id, ok);
      document.getElementById('fb').innerHTML = `
        <div class="fb ${ok ? 'ok' : 'ng'}">${ok ? '⭕ 正解' : '❌ 不正解'} — <b class="ko">${esc(g.p)}</b> : ${esc(g.m)}
          <div class="ko" style="margin-top:6px">${gMarked(g.s)}</div><div style="color:var(--sub);font-size:13px">${esc(g.k)}</div></div>
        <div class="nav2"><button class="btn primary" id="nx">${idx < qs.length-1 ? '次へ ›' : '結果'}</button></div>`;
      document.getElementById('nx').onclick = next;
      speak(gFull(g.s));
    });
  }
  function next(){
    idx++;
    if (idx < qs.length) { draw(); window.scrollTo(0, 0); return; }
    if (gday) { const gb = store.get('gbest', {}); if (!gb[gday] || score > gb[gday].score) { gb[gday] = {score, total: qs.length}; store.set('gbest', gb); } }
    view.innerHTML = `
      <div class="card result"><div style="color:var(--sub)">${esc(title)}</div>
        <div class="score">${score} / ${qs.length}</div>
        <div style="color:var(--sub)">${score === qs.length ? '満点！🎉' : `間違えた ${wrong.length} 件は今日の復習に追加`}</div></div>
      ${wrong.length ? `<h2 class="sub">間違えた文法</h2><div class="list">${wrong.map(g => `
        <div class="card grow"><div class="gp"><span class="ko">${esc(g.p)}</span><span class="gm">${esc(g.m)}</span></div>
          <div class="gx"><div class="ko s">${gMarked(g.s)}</div><div class="k">${esc(g.k)}</div></div></div>`).join('')}</div>` : ''}
      <div class="nav2">${wrong.length ? `<button class="btn primary" id="retry">間違いだけもう一度</button>` : ''}<button class="btn" id="again">最初から</button></div>`;
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => go(GQuiz, [wrong.slice(), title + '（再挑戦）', null], true);
    document.getElementById('again').onclick = () => go(GQuiz, [list, title, gday], true);
  }
  draw();
}

function VoiceSettings(){ setHeader('音声設定'); TTS.screen(view, esc); }

// ---------- keyboard: ←/→ 이전·다음, Enter 외웠어요(상세)·다음 문제(퀴즈), 1~4 보기 선택(퀴즈)·1 발음·2 예문 듣기(상세), Backspace 이전 화면 ----------
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;   // 직접 입력 중에는 방해하지 않음
  const btn = id => { const b = document.getElementById(id); return b && !b.disabled ? b : null; };
  if (e.key === 'Backspace') { if (!e.repeat) { e.preventDefault(); back(); } return; }   // 이전 화면 (뒤로 버튼과 동일)
  let b = null;
  if (e.key === 'ArrowRight') b = btn('nx') || btn('next');
  else if (e.key === 'ArrowLeft') b = btn('prev');
  else if (e.key === 'Enter') {
    // 단어 상세: '외웠어요' 처리(다음 단어로 이동). 이미 외운 단어면 취소하지 않고 다음으로만 이동
    const m = btn('memo');
    b = btn('nx') || (m ? (m.classList.contains('primary') ? m : btn('next')) : null);
  }
  else if (/^[1-4]$/.test(e.key)) {
    const ch = view.querySelectorAll('.choice');
    if (ch.length) b = ch[+e.key - 1] || null;                 // 퀴즈: 보기 선택
    else if (!e.repeat && e.key === '1') b = btn('tts');       // 단어 상세: 1 발음 듣기
    else if (!e.repeat && e.key === '2') b = btn('ttsEx');     //            2 예문 듣기
  }
  if (b) { e.preventDefault(); b.click(); }   // preventDefault: 포커스된 버튼의 Enter 기본 클릭과 중복 방지
});

go(Home);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
